---
name: Temporary format PR 1445 shell

"on":
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/format-pr1445-shell-temporary.yml"

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: deploy/merge-to-live-v1
          fetch-depth: 0
      - name: Apply canonical shell formatting only
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends shfmt
          shfmt -w -i 2 -ci -sr \
            scripts/ops/deploy-exact-commit-vps.sh \
            scripts/ops/reconcile-production-main-vps.sh
          git rm .github/workflows/format-pr1445-shell-temporary.yml
          changed="$(mktemp)"
          trap 'rm -f "$changed"' EXIT
          git status --porcelain | cut -c4- | sort > "$changed"
          printf '%s\n' \
            .github/workflows/format-pr1445-shell-temporary.yml \
            scripts/ops/deploy-exact-commit-vps.sh \
            scripts/ops/reconcile-production-main-vps.sh \
            | sort | diff -u - "$changed"
          git diff --check
          git config user.name "weltgewebe-format-bot"
          git config user.email "format-bot@weltgewebe.invalid"
          git add scripts/ops/deploy-exact-commit-vps.sh scripts/ops/reconcile-production-main-vps.sh
          git commit -m "style(ops): apply canonical shell formatting"
          git push origin HEAD:deploy/merge-to-live-v1
