---
name: policies
"on":
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

permissions:
  contents: read
concurrency:
  group: policies-${{ github.ref }}
  cancel-in-progress: true
jobs:
  limits-file-and-yaml:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # tag: v7.0.1
      - name: Ensure limits policy exists
        run: test -f policies/limits.yaml
      - name: Lint policies directory with yamllint
        run: |
          python -m pip install --upgrade pip
          python -m pip install yamllint
          if [ -f .yamllint.yml ]; then
            yamllint -c .yamllint.yml policies
          else
            yamllint policies
          fi
