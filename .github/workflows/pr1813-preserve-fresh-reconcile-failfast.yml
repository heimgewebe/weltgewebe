---
name: PR1813 preserve fresh reconcile fail-fast

"on":
  push:
    branches:
      - bureau/weltgewebe-os-v1-t084/5e0085fc46
    paths:
      - .github/workflows/pr1813-preserve-fresh-reconcile-failfast.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # tag: v7.0.1
        with:
          fetch-depth: 0
          ref: bureau/weltgewebe-os-v1-t084/5e0085fc46

      - name: Verify exact parent
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "5c6ce481c883d0af0ad428b0e2bd0474af634629"

      - name: Preserve fresh reconcile and PVC fail-fast
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              target = Path(path)
              text = target.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one replacement, found {count}")
              target.write_text(text.replace(old, new, 1), encoding="utf-8")

          staging = "scripts/platform/staging_cell.py"
          tests = "scripts/ci/tests/test_staging_cell_runtime_contract.py"
          readme = "platform/README.md"

          replace_once(
              staging,
              '''                bind_deadline = now + bind_timeout_seconds\n''',
              '''                bind_deadline = min(\n                    now + bind_timeout_seconds, visibility_deadline\n                )\n''',
          )

          replace_once(
              staging,
              '''    ready = ready_status if current_generation else "stale"\n    if resource == "gitrepository":\n''',
              '''    ready = ready_status if current_generation else "stale"\n    last_handled_value = status_payload.get("lastHandledReconcileAt")\n    last_handled = (\n        last_handled_value\n        if isinstance(last_handled_value, str) and last_handled_value\n        else "missing"\n    )\n    if resource == "gitrepository":\n''',
          )

          replace_once(
              staging,
              '''        "current_generation": current_generation,\n    }\n\n\ndef wait_flux_resource_current(\n''',
              '''        "current_generation": current_generation,\n        "last_handled_reconcile_at": last_handled,\n    }\n\n\ndef wait_flux_resource_current(\n''',
          )

          replace_once(
              staging,
              '''def wait_flux_resource_current(\n    kubectl: str,\n    resource: str,\n    name: str,\n    commit: str,\n    *,\n    timeout_seconds: float = DATA_KUSTOMIZATION_TIMEOUT_SECONDS,\n) -> dict[str, Any]:\n    deadline = time.monotonic() + timeout_seconds\n    observed: dict[str, Any] = {}\n    while True:\n        observed = flux_resource_current_state(kubectl, resource, name, commit)\n        if observed["ready"] == "True" and observed["matches_commit"]:\n            return observed\n        if time.monotonic() >= deadline:\n            raise StagingCellError(\n                f"Flux {resource}/{name} did not reach the current receipt-bound revision "\n                f"within {timeout_seconds:g}s: ready={observed.get('ready')!r} "\n                f"revision={observed.get('revision')!r}"\n            )\n        time.sleep(1)\n\n\ndef reconcile_data(flux: str) -> None:\n    run(\n        [\n            flux,\n            "reconcile",\n            "kustomization",\n            DATA_KUSTOMIZATION,\n            "--namespace=flux-system",\n            "--with-source",\n            f"--timeout={DATA_KUSTOMIZATION_TIMEOUT}",\n        ],\n        timeout=int(DATA_KUSTOMIZATION_TIMEOUT_SECONDS) + 60,\n    )\n''',
              '''def wait_flux_resource_current(\n    kubectl: str,\n    resource: str,\n    name: str,\n    commit: str,\n    *,\n    timeout_seconds: float = DATA_KUSTOMIZATION_TIMEOUT_SECONDS,\n    requested_at: str | None = None,\n) -> dict[str, Any]:\n    deadline = time.monotonic() + timeout_seconds\n    observed: dict[str, Any] = {}\n    while True:\n        observed = flux_resource_current_state(kubectl, resource, name, commit)\n        handled_request = (\n            requested_at is None\n            or observed.get("last_handled_reconcile_at") == requested_at\n        )\n        if (\n            observed["ready"] == "True"\n            and observed["matches_commit"]\n            and handled_request\n        ):\n            return observed\n        if time.monotonic() >= deadline:\n            raise StagingCellError(\n                f"Flux {resource}/{name} did not reach the current receipt-bound revision "\n                f"within {timeout_seconds:g}s: ready={observed.get('ready')!r} "\n                f"revision={observed.get('revision')!r} "\n                f"lastHandledReconcileAt={observed.get('last_handled_reconcile_at')!r}"\n            )\n        time.sleep(1)\n\n\ndef request_flux_reconcile(\n    kubectl: str, resource: str, name: str, requested_at: str\n) -> None:\n    if resource not in {"gitrepository", "kustomization"}:\n        raise StagingCellError(f"unsupported Flux reconcile resource type: {resource}")\n    run(\n        [\n            kubectl,\n            "-n",\n            "flux-system",\n            "annotate",\n            f"{resource}/{name}",\n            f"reconcile.fluxcd.io/requestedAt={requested_at}",\n            "--field-manager=flux-client-side-apply",\n            "--overwrite",\n        ],\n        timeout=30,\n    )\n\n\ndef reconcile_data(kubectl: str, commit: str) -> str:\n    requested_at = f"staging-up-{time.time_ns()}"\n    request_flux_reconcile(kubectl, "gitrepository", SOURCE_NAME, requested_at)\n    wait_flux_resource_current(\n        kubectl,\n        "gitrepository",\n        SOURCE_NAME,\n        commit,\n        requested_at=requested_at,\n    )\n\n    request_flux_reconcile(\n        kubectl, "kustomization", DATA_KUSTOMIZATION, requested_at\n    )\n    deadline = time.monotonic() + DATA_KUSTOMIZATION_TIMEOUT_SECONDS\n    pvc_budget = max(0.0, deadline - time.monotonic())\n    wait_pvcs_bound(kubectl, visibility_timeout_seconds=pvc_budget)\n    remaining = max(0.0, deadline - time.monotonic())\n    wait_flux_resource_current(\n        kubectl,\n        "kustomization",\n        DATA_KUSTOMIZATION,\n        commit,\n        timeout_seconds=remaining,\n        requested_at=requested_at,\n    )\n    return requested_at\n''',
          )

          replace_once(
              staging,
              '''\n\ndef wait_data(kubectl: str, commit: str) -> None:\n    wait_flux_resource_current(kubectl, "gitrepository", SOURCE_NAME, commit)\n    wait_pvcs_bound(kubectl)\n    wait_flux_resource_current(kubectl, "kustomization", DATA_KUSTOMIZATION, commit)\n''',
              '''''',
          )

          replace_once(
              staging,
              '''    apply_yaml(kubectl, flux_documents(commit))\n    reconcile_data(flux)\n    wait_data(kubectl, commit)\n    live_workloads = staging_live_health(kubectl)\n''',
              '''    apply_yaml(kubectl, flux_documents(commit))\n    reconcile_data(kubectl, commit)\n    live_workloads = staging_live_health(kubectl)\n''',
          )

          replace_once(
              tests,
              '''                mock.patch.object(staging, "apply_yaml"),\n                mock.patch.object(staging, "reconcile_data") as reconcile_mock,\n                mock.patch.object(staging, "wait_data"),\n                mock.patch.object(\n''',
              '''                mock.patch.object(staging, "apply_yaml"),\n                mock.patch.object(staging, "reconcile_data") as reconcile_mock,\n                mock.patch.object(\n''',
          )

          replace_once(
              tests,
              '''            reconcile_mock.assert_called_once_with("flux")\n''',
              '''            reconcile_mock.assert_called_once_with("kubectl", persisted_commit)\n''',
          )

          replace_once(
              tests,
              '''    def test_flux_wait_requires_current_generation_and_exact_revision(self) -> None:\n        commit = "a" * 40\n        states = [\n            {\n                "ready": "stale",\n                "revision": f"main@sha1:{commit}",\n                "matches_commit": True,\n                "current_generation": False,\n            },\n            {\n                "ready": "True",\n                "revision": f"main@sha1:{'b' * 40}",\n                "matches_commit": False,\n                "current_generation": True,\n            },\n            {\n                "ready": "True",\n                "revision": f"main@sha1:{commit}",\n                "matches_commit": True,\n                "current_generation": True,\n            },\n        ]\n        with (\n            mock.patch.object(\n                staging, "flux_resource_current_state", side_effect=states\n            ) as state_mock,\n            mock.patch.object(staging.time, "monotonic", side_effect=[0.0, 1.0, 2.0]),\n            mock.patch.object(staging.time, "sleep") as sleep_mock,\n        ):\n            result = staging.wait_flux_resource_current(\n                "kubectl",\n                "kustomization",\n                staging.DATA_KUSTOMIZATION,\n                commit,\n                timeout_seconds=10.0,\n            )\n        self.assertTrue(result["matches_commit"])\n        self.assertEqual(result["ready"], "True")\n        self.assertEqual(state_mock.call_count, 3)\n        self.assertEqual(sleep_mock.call_count, 2)\n\n    def test_wait_data_requires_exact_flux_states_around_pvc_binding(self) -> None:\n        events: list[str] = []\n        commit = "c" * 40\n\n        def wait_flux(\n            _kubectl: str, resource: str, name: str, observed_commit: str\n        ) -> dict[str, object]:\n            self.assertEqual(observed_commit, commit)\n            events.append(f"{resource}/{name}")\n            return {\n                "ready": "True",\n                "revision": f"main@sha1:{commit}",\n                "matches_commit": True,\n                "current_generation": True,\n            }\n\n        with (\n            mock.patch.object(staging, "wait_flux_resource_current", side_effect=wait_flux),\n            mock.patch.object(\n                staging,\n                "wait_pvcs_bound",\n                side_effect=lambda _kubectl: events.append("pvcs-bound"),\n            ),\n            mock.patch.object(\n                staging.reference,\n                "wait_condition",\n                side_effect=AssertionError("condition-only Flux wait must not run"),\n            ),\n            mock.patch.object(\n                staging.reference,\n                "wait_rollout",\n                side_effect=AssertionError("redundant rollout wait must not run"),\n            ),\n        ):\n            staging.wait_data("kubectl", commit)\n        self.assertEqual(\n            events,\n            [\n                f"gitrepository/{staging.SOURCE_NAME}",\n                "pvcs-bound",\n                f"kustomization/{staging.DATA_KUSTOMIZATION}",\n            ],\n        )\n\n\n    def test_reconcile_data_forces_source_refresh_and_waits(self) -> None:\n        with mock.patch.object(staging, "run") as run_mock:\n            staging.reconcile_data("flux")\n        run_mock.assert_called_once_with(\n            [\n                "flux",\n                "reconcile",\n                "kustomization",\n                staging.DATA_KUSTOMIZATION,\n                "--namespace=flux-system",\n                "--with-source",\n                f"--timeout={staging.DATA_KUSTOMIZATION_TIMEOUT}",\n            ],\n            timeout=int(staging.DATA_KUSTOMIZATION_TIMEOUT_SECONDS) + 60,\n        )\n''',
              '''    def test_flux_wait_requires_current_generation_exact_revision_and_request(self) -> None:\n        commit = "a" * 40\n        requested_at = "staging-up-123"\n        states = [\n            {\n                "ready": "True",\n                "revision": f"main@sha1:{commit}",\n                "matches_commit": True,\n                "current_generation": True,\n                "last_handled_reconcile_at": "older-request",\n            },\n            {\n                "ready": "stale",\n                "revision": f"main@sha1:{commit}",\n                "matches_commit": True,\n                "current_generation": False,\n                "last_handled_reconcile_at": requested_at,\n            },\n            {\n                "ready": "True",\n                "revision": f"main@sha1:{'b' * 40}",\n                "matches_commit": False,\n                "current_generation": True,\n                "last_handled_reconcile_at": requested_at,\n            },\n            {\n                "ready": "True",\n                "revision": f"main@sha1:{commit}",\n                "matches_commit": True,\n                "current_generation": True,\n                "last_handled_reconcile_at": requested_at,\n            },\n        ]\n        with (\n            mock.patch.object(\n                staging, "flux_resource_current_state", side_effect=states\n            ) as state_mock,\n            mock.patch.object(\n                staging.time, "monotonic", side_effect=[0.0, 1.0, 2.0, 3.0]\n            ),\n            mock.patch.object(staging.time, "sleep") as sleep_mock,\n        ):\n            result = staging.wait_flux_resource_current(\n                "kubectl",\n                "kustomization",\n                staging.DATA_KUSTOMIZATION,\n                commit,\n                timeout_seconds=10.0,\n                requested_at=requested_at,\n            )\n        self.assertTrue(result["matches_commit"])\n        self.assertEqual(result["ready"], "True")\n        self.assertEqual(result["last_handled_reconcile_at"], requested_at)\n        self.assertEqual(state_mock.call_count, 4)\n        self.assertEqual(sleep_mock.call_count, 3)\n\n    def test_flux_state_reads_last_handled_reconcile_token(self) -> None:\n        commit = "c" * 40\n        requested_at = "staging-up-456"\n        payload = {\n            "metadata": {"generation": 2},\n            "status": {\n                "observedGeneration": 2,\n                "conditions": [{"type": "Ready", "status": "True"}],\n                "lastAppliedRevision": f"main@sha1:{commit}",\n                "lastHandledReconcileAt": requested_at,\n            },\n        }\n        with mock.patch.object(staging, "output", return_value=json.dumps(payload)):\n            state = staging.flux_resource_current_state(\n                "kubectl", "kustomization", staging.DATA_KUSTOMIZATION, commit\n            )\n        self.assertEqual(state["ready"], "True")\n        self.assertTrue(state["matches_commit"])\n        self.assertEqual(state["last_handled_reconcile_at"], requested_at)\n\n    def test_request_flux_reconcile_uses_requested_at_annotation(self) -> None:\n        requested_at = "staging-up-789"\n        with mock.patch.object(staging, "run") as run_mock:\n            staging.request_flux_reconcile(\n                "kubectl", "gitrepository", staging.SOURCE_NAME, requested_at\n            )\n        run_mock.assert_called_once_with(\n            [\n                "kubectl",\n                "-n",\n                "flux-system",\n                "annotate",\n                f"gitrepository/{staging.SOURCE_NAME}",\n                f"reconcile.fluxcd.io/requestedAt={requested_at}",\n                "--field-manager=flux-client-side-apply",\n                "--overwrite",\n            ],\n            timeout=30,\n        )\n\n    def test_reconcile_data_keeps_pvc_fail_fast_inside_shared_budget(self) -> None:\n        events: list[str] = []\n        commit = "d" * 40\n        requested_at = "staging-up-123456789"\n        wait_calls: list[tuple[str, float, str | None]] = []\n\n        def request(\n            _kubectl: str, resource: str, name: str, token: str\n        ) -> None:\n            self.assertEqual(token, requested_at)\n            events.append(f"request:{resource}/{name}")\n\n        def wait_flux(\n            _kubectl: str,\n            resource: str,\n            name: str,\n            observed_commit: str,\n            *,\n            timeout_seconds: float = staging.DATA_KUSTOMIZATION_TIMEOUT_SECONDS,\n            requested_at: str | None = None,\n        ) -> dict[str, object]:\n            self.assertEqual(observed_commit, commit)\n            wait_calls.append((resource, timeout_seconds, requested_at))\n            events.append(f"wait:{resource}/{name}")\n            return {\n                "ready": "True",\n                "revision": f"main@sha1:{commit}",\n                "matches_commit": True,\n                "current_generation": True,\n                "last_handled_reconcile_at": requested_at,\n            }\n\n        def wait_pvcs(_kubectl: str, **kwargs: float) -> None:\n            self.assertEqual(\n                kwargs["visibility_timeout_seconds"],\n                staging.DATA_KUSTOMIZATION_TIMEOUT_SECONDS,\n            )\n            events.append("pvcs-bound")\n\n        with (\n            mock.patch.object(staging.time, "time_ns", return_value=123456789),\n            mock.patch.object(\n                staging.time, "monotonic", side_effect=[100.0, 100.0, 120.0]\n            ),\n            mock.patch.object(staging, "request_flux_reconcile", side_effect=request),\n            mock.patch.object(\n                staging, "wait_flux_resource_current", side_effect=wait_flux\n            ),\n            mock.patch.object(staging, "wait_pvcs_bound", side_effect=wait_pvcs),\n        ):\n            token = staging.reconcile_data("kubectl", commit)\n\n        self.assertEqual(token, requested_at)\n        self.assertEqual(\n            events,\n            [\n                f"request:gitrepository/{staging.SOURCE_NAME}",\n                f"wait:gitrepository/{staging.SOURCE_NAME}",\n                f"request:kustomization/{staging.DATA_KUSTOMIZATION}",\n                "pvcs-bound",\n                f"wait:kustomization/{staging.DATA_KUSTOMIZATION}",\n            ],\n        )\n        self.assertEqual(wait_calls[0][2], requested_at)\n        self.assertEqual(wait_calls[1], ("kustomization", 460.0, requested_at))\n''',
          )

          replace_once(
              readme,
              '''Nach dem Apply stößt jedes `up` ausdrücklich `flux reconcile kustomization\nweltgewebe-staging-data --with-source` an und wartet damit auf eine neue\nSource- und Kustomization-Reconciliation dieses Laufs. Danach werden Source und\nKustomization nochmals gegen aktuelle Generation und exakte Receipt-Revision\ngeprüft; die PVCs müssen `Bound` sein. Zusätzlich müssen PostgreSQL, NATS,\n`source-controller` und `kustomize-controller` als aktuelle Deployments die\ngewünschten verfügbaren, bereiten und aktualisierten Replikas melden. `status`\nverwendet dieselben Live-Workload-Schranken und degradiert bei fehlenden, stale\noder nicht verfügbaren Ressourcen statt einen früheren Ready-Zustand fortzuschreiben.\n''',
              '''Nach dem Apply fordert jedes `up` über Flux' kanonische\n`reconcile.fluxcd.io/requestedAt`-Annotation zuerst eine neue Source-Reconciliation\nan und akzeptiert sie erst, wenn `status.lastHandledReconcileAt`, aktuelle Generation\nund exakte Receipt-Revision übereinstimmen. Danach wird mit demselben eindeutigen\nToken die Daten-Kustomization angestoßen. PVC-Sichtbarkeit und -Bindung bleiben im\ngemeinsamen 8-Minuten-Kustomization-Budget; sobald beide Claims sichtbar sind, gilt\nweiterhin der 45-Sekunden-Bindefehler. Erst danach muss die Kustomization denselben\nReconcile-Token, aktuelle Generation, `Ready=True` und die exakte angewandte\nReceipt-Revision melden. Zusätzlich müssen PostgreSQL, NATS, `source-controller` und\n`kustomize-controller` als aktuelle Deployments die gewünschten verfügbaren,\nbereiten und aktualisierten Replikas melden. `status` verwendet dieselben\nLive-Workload-Schranken und degradiert bei fehlenden, stale oder nicht verfügbaren\nRessourcen statt einen früheren Ready-Zustand fortzuschreiben.\n''',
          )
          PY

      - name: Set up uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990

      - name: Run focused evidence
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          uv run --project tools/py --locked python -m unittest scripts.ci.tests.test_staging_cell_runtime_contract
          uv run --project tools/py --locked python scripts/platform/staging_cell.py self-check
          uv run --project tools/py --locked python scripts/platform/validate_platform.py --render

      - name: Publish exact tested patch
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/pr1813-preserve-fresh-reconcile-failfast.yml
          git config user.name "Alexander Mohr"
          git config user.email "216529510+alexdermohr@users.noreply.github.com"
          git add -A
          git diff --cached --check
          test -n "$(git diff --cached --name-only)"
          git commit -m "fix(platform): preserve PVC fail-fast during fresh reconcile"
          git push origin HEAD:bureau/weltgewebe-os-v1-t084/5e0085fc46
