---
name: PR 1658 current follow-up

"on":
  pull_request:
    paths:
      - "scripts/platform/.pr1658-current-followup-trigger"

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  apply-and-verify:
    if: >-
      github.event.pull_request.number == 1658 &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'feat/gewebezelle-two-operator-pilot-v1'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # tag: v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: true
      - name: Bind follow-up to marker commit
        id: gate
        shell: bash
        run: |
          set -euo pipefail
          marker='scripts/platform/.pr1658-current-followup-trigger'
          if [[ ! -f "$marker" ]]; then
            echo 'run=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          test "${GITHUB_HEAD_REF}" = 'feat/gewebezelle-two-operator-pilot-v1'
          test "$(git rev-parse HEAD)" = '${{ github.event.pull_request.head.sha }}'
          test "$(git diff --name-only HEAD^ HEAD)" = "$marker"
          test "$(cat "$marker")" = 'pr1658 current follow-up v1'
          echo 'run=true' >> "$GITHUB_OUTPUT"
          echo "bound_head=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # tag: v7.0.0
        if: steps.gate.outputs.run == 'true'
        with:
          python-version: "3.12"
      - name: Install test dependencies
        if: steps.gate.outputs.run == 'true'
        run: python -m pip install --disable-pip-version-check 'PyYAML==6.0.3' pytest ruff
      - name: Materialize and apply reviewed follow-up
        if: steps.gate.outputs.run == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PATCH_BLOB_SHA: ee887d98d19740b1b9fc8d59a4194553ee349a4d
          PATCH_SHA256: 8f129c5debffc1b99c9b66857ea4b3f24856320209b034b292e74dec163c5002
        run: |
          set -euo pipefail
          curl --fail --silent --show-error \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/git/blobs/${PATCH_BLOB_SHA}" \
            --output /tmp/pr1658-followup.json
          jq -e '.encoding == "base64" and (.content | type == "string")' \
            /tmp/pr1658-followup.json >/dev/null
          jq -r '.content' /tmp/pr1658-followup.json \
            | tr -d '\n' \
            | base64 --decode \
            > /tmp/pr1658-followup.py
          test "$(sha256sum /tmp/pr1658-followup.py | cut -d' ' -f1)" = "$PATCH_SHA256"
          cp .github/workflows/kubernetes-platform.yml /tmp/kubernetes-platform.original.yml
          rm scripts/platform/.pr1658-current-followup-trigger
          python /tmp/pr1658-followup.py
          chmod +x scripts/platform/validate_two_operator_pilot.py
      - name: Format and verify follow-up
        if: steps.gate.outputs.run == 'true'
        run: |
          python -m ruff check --fix \
            scripts/platform/validate_two_operator_pilot.py \
            scripts/ci/tests/test_two_operator_cell_pilot.py
          python -m ruff format \
            scripts/platform/validate_two_operator_pilot.py \
            scripts/ci/tests/test_two_operator_cell_pilot.py
          python -m ruff check \
            scripts/platform/validate_two_operator_pilot.py \
            scripts/ci/tests/test_two_operator_cell_pilot.py
          python -m py_compile \
            scripts/platform/validate_two_operator_pilot.py \
            scripts/ci/tests/test_two_operator_cell_pilot.py \
            scripts/ci/tests/test_kubernetes_platform_contract.py \
            scripts/ci/tests/test_kubernetes_ha_contract.py
          python -m unittest scripts.ci.tests.test_two_operator_cell_pilot
          python -m unittest \
            scripts.ci.tests.test_kubernetes_platform_contract \
            scripts.ci.tests.test_kubernetes_ha_contract
          make generate
          make docs-guard
          cargo fmt --all -- --check
          cargo test -p weltgewebe-api federation::tests::
          cargo test -p weltgewebe-api --test two_operator_pilot_example_keys
      - name: Commit verified product changes
        if: steps.gate.outputs.run == 'true'
        shell: bash
        env:
          BOUND_HEAD: ${{ steps.gate.outputs.bound_head }}
        run: |
          set -euo pipefail
          cp /tmp/kubernetes-platform.original.yml .github/workflows/kubernetes-platform.yml
          git diff --check
          test -z "$(git status --short | grep -E '^\?\?' || true)"
          git config user.name 'heimgewebe-operator'
          git config user.email 'noreply@heimgewebe.invalid'
          git ls-tree -r HEAD \
            | awk '$2 == "blob" {print $3}' \
            | git cat-file --batch >/dev/null
          git add -A
          git diff --cached --quiet -- .github/workflows/kubernetes-platform.yml
          git diff --cached --quiet -- .github/workflows/pr1658-current-followup.yml
          git commit -m 'fix(platform): complete pilot validator hardening'
          git fetch origin feat/gewebezelle-two-operator-pilot-v1
          test "$(git rev-parse origin/feat/gewebezelle-two-operator-pilot-v1)" = "$BOUND_HEAD"
          git push origin HEAD:feat/gewebezelle-two-operator-pilot-v1
