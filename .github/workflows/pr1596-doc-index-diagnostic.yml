---
name: PR1596 Doc Index Diagnostic
# activation revision: 3

permissions:
  contents: read

"on":
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/pr1596-doc-index-diagnostic.yml'

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fix/node-delete-archive-history-v1
      - name: Read exact index errors
        run: |
          set -o pipefail
          python3 scripts/docmeta/check_repo_index_consistency.py 2>&1 | tail -n 80
