---
name: PR1596 Doc Index Diagnostic
# activation revision: 4

permissions:
  actions: read
  contents: read

"on":
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/pr1596-doc-index-diagnostic.yml'

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Read exact index errors
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api \
            -H 'Accept: application/vnd.github+json' \
            /repos/${GITHUB_REPOSITORY}/actions/jobs/90216718637/logs \
            > /tmp/pr1596-doc-index.log
          echo 'BEGIN_PR1596_DOC_INDEX_ERROR'
          tail -n 50 /tmp/pr1596-doc-index.log
          echo 'END_PR1596_DOC_INDEX_ERROR'
