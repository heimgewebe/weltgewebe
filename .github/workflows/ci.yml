---
name: CI

permissions:
  contents: read

"on":
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Verwende die Standard-Bash von GitHub Actions, ohne eigenes Template.
defaults:
  run:
    shell: bash

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  docs-changes:
    name: Detect docs updates
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      docs: ${{ steps.filter.outputs.docs }}
      hygiene: ${{ steps.filter.outputs.hygiene }}
      heavy: ${{ steps.filter.outputs.heavy }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # tag: v4
        with:
          fetch-depth: 0

      - id: filter
        uses: dorny/paths-filter@v4
        with:
          filters: |
            docs:
              - '**/*.md'
              - '.markdownlint.*'
              - '.yamllint*'
            hygiene:
              - '**/*.md'
              - '.markdownlint.*'
              - '.yamllint*'
              - '.github/workflows/*.yml'
              - '.github/workflows/*.yaml'
              - '**/*.sh'
              - '**/*.bash'
              - 'Justfile'
              - 'scripts/tools/list-shell-files.py'
              - 'scripts/**'
            heavy:
              - '.github/workflows/*.yml'
              - '.github/workflows/*.yaml'
              - 'apps/**'
              - 'ci/**'
              - 'contracts/**'
              - 'infra/**'
              - 'policies/**'
              - 'scripts/**'
              - 'src/**'
              - 'tests/**'
              - 'tools/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'Justfile'
              - 'Makefile'
              - 'package.json'
              - 'package-lock.json'
              - 'pnpm-lock.yaml'
              - 'toolchain.versions.yml'
              - '.node-version'
              - '.nvmrc'
              - '.python-version'

  guard-tests:
    name: Core Guard Tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # tag: v4

      - name: Check guard syntax
        shell: bash
        run: |
          set -euo pipefail
          bash -n scripts/guard/domain-single-instance-guard.sh
          bash -n scripts/tests/test_domain_single_instance_guard.sh
          bash -n scripts/guard/prod-public-base-url-guard.sh
          bash -n scripts/tests/test_prod_public_base_url_guard.sh
          bash -n scripts/guard/run.sh

      - name: Run guard fixture suites
        shell: bash
        run: |
          set -euo pipefail
          for t in \
            scripts/tests/test_token_leak_guard.sh \
            scripts/tests/test_compose_volumes_guard.sh \
            scripts/tests/test_metrics_ref_guard.sh \
            scripts/tests/test_domain_single_instance_guard.sh \
            scripts/tests/test_prod_public_base_url_guard.sh
          do
            echo "── $t ──"
            bash "$t"
          done

      - name: Validate production public base URL contract
        shell: bash
        run: |
          set -euo pipefail
          REPO_ROOT="$GITHUB_WORKSPACE" \
            bash scripts/guard/prod-public-base-url-guard.sh

      - name: Run core guard orchestrator
        shell: bash
        run: bash scripts/guard/run.sh

  ci:
    needs: docs-changes
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NODE_OPTIONS: --max-old-space-size=4096
    # skip heavy CI when it's a docs-only change (unless manually dispatched)
    if: >
      github.event_name == 'workflow_dispatch' ||
      needs.docs-changes.outputs.docs != 'true' ||
      needs.docs-changes.outputs.heavy == 'true'
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # tag: v4
        with:
          fetch-depth: 0

      - name: Install yq
        run: |
          set -e
          YQ_VERSION="4.44.3"
          YQ_DIR="$HOME/.local/bin"
          YQ_BIN="$YQ_DIR/yq"
          mkdir -p "$YQ_DIR"

          if [[ ! -f "$YQ_BIN" ]] || ! "$YQ_BIN" --version 2>/dev/null | grep -q "$YQ_VERSION"; then
            echo "Installing yq v${YQ_VERSION}..."
            wget -qO "$YQ_BIN" "https://github.com/mikefarah/yq/releases/download/v${YQ_VERSION}/yq_linux_amd64"
            chmod +x "$YQ_BIN"
          else
            echo "yq v${YQ_VERSION} already installed"
          fi

          echo "$YQ_DIR" >> "$GITHUB_PATH"

      - name: Verify yq
        run: $HOME/.local/bin/yq --version

      - name: Read toolchain versions
        run: |
          set -euo pipefail
          export PATH="$HOME/.local/bin:$PATH"

          if [ ! -x "$HOME/.local/bin/yq" ]; then
            echo "yq is not installed or not executable at $HOME/.local/bin/yq" >&2
            exit 1
          fi

          if [ ! -f toolchain.versions.yml ]; then
            echo "toolchain.versions.yml not found" >&2
            exit 1
          fi

          # Function to extract and validate version
          get_version() {
            local key=$1
            local val
            val=$("$HOME/.local/bin/yq" -r ".${key} // \"\"" toolchain.versions.yml | xargs)
            if [ -z "$val" ] || [ "$val" == "null" ]; then
              echo "failed to parse ${key} version from toolchain.versions.yml" >&2
              exit 1
            fi
            echo "$val"
          }

          RUST=$(get_version "rust")
          UV=$(get_version "uv")
          DENY=$(get_version "cargo-deny")

          echo "Found versions: Rust=$RUST, uv=$UV, cargo-deny=$DENY"

          echo "RUST_VERSION=${RUST}" >> "$GITHUB_ENV"
          echo "UV_VERSION=${UV}" >> "$GITHUB_ENV"
          echo "DENY_VERSION=${DENY}" >> "$GITHUB_ENV"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: ${{ env.RUST_VERSION }}
          components: rustfmt, clippy
        env:
          CARGO_TERM_COLOR: always

      - name: Cache Cargo artifacts
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # tag: v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: >-
            ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Setup pnpm
        uses: pnpm/action-setup@b0f76dfb45f55f8421693e4803ac7bb65143bd34 # tag: v6
        with:
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version-file: '.node-version'
          check-latest: false
          cache: 'pnpm'
          cache-dependency-path: |
            pnpm-lock.yaml
            apps/web/pnpm-lock.yaml

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # tag: v5
        with:
          python-version-file: '.python-version'

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          ignore-nothing-to-cache: true

      - name: Install cargo-deny
        run: |
          set -euo pipefail
          # DENY_VERSION kommt aus toolchain.versions.yml (Step "Read toolchain versions").
          if [ -z "${DENY_VERSION:-}" ]; then
            echo "DENY_VERSION is not set (expected from toolchain.versions.yml)" >&2
            exit 1
          fi
          DENY_DIR="$HOME/.local/bin"
          DENY_BIN="$DENY_DIR/cargo-deny"
          mkdir -p "$DENY_DIR"

          if [[ ! -f "$DENY_BIN" ]] || ! "$DENY_BIN" --version 2>/dev/null | grep -q "${DENY_VERSION}"; then
            echo "Installing cargo-deny v${DENY_VERSION}..."
            # Use mktemp for robust extraction
            INSTALL_TMPDIR=$(mktemp -d)
            TARBALL_URL="https://github.com/EmbarkStudios/cargo-deny/releases/download"
            TARBALL_URL="${TARBALL_URL}/${DENY_VERSION}/cargo-deny-${DENY_VERSION}-x86_64-unknown-linux-musl.tar.gz"
            curl -sLf "$TARBALL_URL" | tar xz -C "$INSTALL_TMPDIR" --strip-components=1
            mv "$INSTALL_TMPDIR/cargo-deny" "$DENY_BIN"
            rm -rf "$INSTALL_TMPDIR"
            chmod +x "$DENY_BIN"
          else
            echo "cargo-deny v${DENY_VERSION} already installed"
          fi

          echo "$DENY_DIR" >> "$GITHUB_PATH"

      - name: Setup Just
        uses: extractions/setup-just@v2

      - name: Show tool versions
        run: |
          rustc --version
          python --version
          uv --version
          cargo-deny --version
          just --version

      # CI Test Architecture:
      #   ci.yml — build, lint, typecheck (web + API), cargo test, cargo-deny (via just ci),
      #            plus always-on Core Guard Tests in the independent guard-tests job.
      #   web.yml (Gate A) — web unit tests (vitest) + Playwright E2E. Path-scoped to apps/web/**.
      #   Vitest deliberately runs only in web.yml to avoid double execution on PRs
      #   that trigger both workflows. See also: Justfile ci recipe, web.yml header.
      - name: Validate project
        env:
          CARGO_TERM_COLOR: always
        run: just ci

  web-e2e:
    name: Web E2E
    runs-on: ubuntu-latest
    needs: ci
    timeout-minutes: 20
    env:
      HEADLESS: "1"
      NPM_CONFIG_AUDIT: "false"
      NPM_CONFIG_FUND: "false"
      FORCE_COLOR: "1"
      PLAYWRIGHT_HTML_REPORT_OPEN: never
      PLAYWRIGHT_JUNIT_OUTPUT_NAME: results.xml
      PREVIEW_PORT: "5173"
    defaults:
      run:
        shell: bash
        working-directory: apps/web
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # tag: v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@b0f76dfb45f55f8421693e4803ac7bb65143bd34 # tag: v6
        with:
          run_install: false

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version-file: '.node-version'
          check-latest: false
          cache: 'pnpm'
          cache-dependency-path: |
            pnpm-lock.yaml
            apps/web/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Cache Playwright browser binaries
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # tag: v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-ms-playwright-${{ hashFiles('apps/web/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-ms-playwright-

      - name: Install Playwright browsers
        run: pnpm playwright install --with-deps

      - name: Generate demo data
        run: scripts/dev/generate-demo-data.sh
        working-directory: .

      - name: Start demo API
        run: |
          PORT=8080 node scripts/dev/gewebe-demo-server.mjs > /tmp/demo-api.log 2>&1 &
        working-directory: .

      - name: Wait for API
        run: scripts/ci/wait-for-api.sh
        working-directory: .

      - name: Run Playwright tests
        env:
          PLAYWRIGHT_HTML_REPORT: playwright-report
        run: pnpm test:ci

      - name: Upload Playwright report
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # tag: v4
        with:
          name: playwright-report-${{ github.run_id }}-${{ github.job }}
          path: apps/web/playwright-report
          if-no-files-found: ignore

  lint-docs:
    name: Docs & Shell Hygiene
    needs: docs-changes
    if: github.event_name == 'workflow_dispatch' || needs.docs-changes.outputs.hygiene == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # tag: v4
        with:
          fetch-depth: 0

      - name: Shell lint
        run: |
          set -euo pipefail
          echo "Installing shell linters..."
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends shellcheck shfmt
          shell_files="${RUNNER_TEMP:-/tmp}/weltgewebe-shell-files.txt"
          python3 scripts/tools/list-shell-files.py > "${shell_files}"
          if [ -s "${shell_files}" ]; then
            xargs -0 -a "${shell_files}" -n 1 bash -n --
            xargs -0 -a "${shell_files}" shfmt -d -i 2 -ci -sr --
            xargs -0 -a "${shell_files}" shellcheck -S style --
          else
            echo "No shell files found."
          fi

      - name: Markdownlint
        uses: DavidAnson/markdownlint-cli2-action@v16
        with:
          globs: |
            **/*.md
            !**/node_modules/**
            !**/dist/**
            !**/.git/**

      - name: Cache lychee responses
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # tag: v4
        with:
          path: .lycheecache
          key: ${{ runner.os }}-lychee-${{ hashFiles('**/*.md', '.lychee.toml') }}
          restore-keys: |
            ${{ runner.os }}-lychee-

      - name: Link check (lychee)
        id: lychee
        continue-on-error: true
        uses: lycheeverse/lychee-action@8646ba30535128ac92d33dfc9133794bfdd9b411 # tag: v2
        with:
          failIfEmpty: false
          # lychee v0.15 expects integer seconds for retry wait time
          args: >
            --no-progress
            --config .lychee.toml
            --accept "200,206,301,302,308,429,999"
            --timeout 20
            --max-concurrency 3
            --retry-wait-time 3
            --max-retries 3
            --user-agent "heimgewebe-ci-lychee"
            --exclude 'https?://(localhost|127\.0\.0\.1|0\.0\.0\.0)(:\d+)?(/.*)?'
            --exclude-path 'node_modules'
            --exclude-path 'dist'
            --exclude-path '.git'
            --cache
            '**/*.md'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Link check (lychee - verbose retry)
        if: ${{ steps.lychee.outcome == 'failure' }}
        uses: lycheeverse/lychee-action@8646ba30535128ac92d33dfc9133794bfdd9b411 # tag: v2
        with:
          failIfEmpty: false
          args: >
            --no-progress
            --config .lychee.toml
            --accept "200,206,301,302,308,429,999"
            --timeout 20
            --max-concurrency 3
            --retry-wait-time 3
            --max-retries 3
            --verbose
            --user-agent "heimgewebe-ci-lychee"
            --exclude 'https?://(localhost|127\.0\.0\.1|0\.0\.0\.0)(:\d+)?(/.*)?'
            --exclude-path 'node_modules'
            --exclude-path 'dist'
            --exclude-path '.git'
            --cache
            --max-cache-age 1d
            '**/*.md'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Lint YAML and JSON files
        run: |
          set -euo pipefail
          echo "Linting YAML files..."
          python -m pip install --user yamllint
          export PATH="$HOME/.local/bin:$PATH"
          git ls-files -z -- '*.yml' '*.yaml' | xargs -r -0 --no-run-if-empty \
            yamllint --strict -c .yamllint.yml
          echo "Checking for jq..."
          if ! command -v jq >/dev/null 2>&1; then
            echo "jq not found, installing..."
            sudo apt-get update -qq
            sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends jq
          fi
          echo "Linting JSON files..."
          git ls-files -z -- '*.json' ':!:**/package-lock.json' | xargs -r -0 --no-run-if-empty \
            jq -n 'inputs' >/dev/null
          echo "Linting completed."
