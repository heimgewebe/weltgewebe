---
name: claim-registry

"on":
  pull_request:
    paths:
      - "docs/claims/**"
      - "scripts/docmeta/validate_claim_registry.py"
      - "scripts/docmeta/tests/test_validate_claim_registry.py"
      - ".github/workflows/claim-registry.yml"
  workflow_dispatch: {}

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

permissions:
  contents: read

concurrency:
  group: claim-registry-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-claim-registry:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # tag: v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # tag: v7.0.0
        with:
          python-version-file: '.python-version'

      - name: Validate claim registry
        run: python3 scripts/docmeta/validate_claim_registry.py

      - name: Run claim registry tests
        run: python3 -m unittest scripts.docmeta.tests.test_validate_claim_registry -v
