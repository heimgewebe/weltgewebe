---
name: claim-registry

"on":
  pull_request:
    paths:
      - "docs/claims/**"
      - "scripts/docmeta/validate_claim_registry.py"
      - "scripts/docmeta/tests/test_validate_claim_registry.py"
      - ".github/workflows/claim-registry.yml"
  workflow_dispatch: {}

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

permissions:
  contents: read

concurrency:
  group: claim-registry-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-claim-registry:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # tag: v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # tag: v5
        with:
          python-version-file: '.python-version'

      - name: Validate claim registry
        run: python3 scripts/docmeta/validate_claim_registry.py

      - name: Run claim registry tests
        run: python3 -m unittest scripts.docmeta.tests.test_validate_claim_registry -v
