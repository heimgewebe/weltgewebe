---
name: PR1813 toolchain integrity and impl index closeout

"on":
  push:
    branches:
      - bureau/weltgewebe-os-v1-t084/5e0085fc46
    paths:
      - .github/workflows/pr1813-toolchain-index-closeout.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # tag: v7.0.1
        with:
          fetch-depth: 0
          ref: bureau/weltgewebe-os-v1-t084/5e0085fc46

      - name: Verify exact parent
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "1e8f840a36a14a0d824913f276fbfcb8362cee30"

      - name: Set up uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990

      - name: Derive installed binary hashes from locked sources
        shell: bash
        run: |
          set -euo pipefail
          uv run --project tools/py --locked python - <<'PY'
          import json
          import tempfile
          from pathlib import Path

          from scripts.platform import bootstrap_tools

          lock_path = Path("platform/toolchain.lock.json")
          lock = json.loads(lock_path.read_text(encoding="utf-8"))
          with tempfile.TemporaryDirectory(prefix="weltgewebe-tool-digest-") as tmp_name:
              cache = Path(tmp_name) / "toolchain"
              receipt = bootstrap_tools.install(
                  cache,
                  tool_names=list(lock["tools"]),
                  include_artifacts=False,
              )
              for name, path_text in receipt["tools"].items():
                  lock["tools"][name]["binary_sha256"] = bootstrap_tools._sha256(
                      Path(path_text)
                  )
          lock_path.write_text(
              json.dumps(lock, indent=2, ensure_ascii=False) + "\n", encoding="utf-8"
          )
          PY

      - name: Harden bootstrap and staging receipt verification
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              target = Path(path)
              text = target.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one replacement, found {count}")
              target.write_text(text.replace(old, new, 1), encoding="utf-8")

          bootstrap = "scripts/platform/bootstrap_tools.py"
          staging = "scripts/platform/staging_cell.py"
          runtime_tests = "scripts/ci/tests/test_staging_cell_runtime_contract.py"
          platform_tests = "scripts/ci/tests/test_kubernetes_platform_contract.py"

          replace_once(
              bootstrap,
              '''        else:\n            raise RuntimeError(f"unsupported format {spec['format']} for {name}")\n        tool_paths[name] = str(destination)\n''',
              '''        else:\n            raise RuntimeError(f"unsupported format {spec['format']} for {name}")\n        expected_binary_sha256 = spec.get("binary_sha256")\n        if (\n            not isinstance(expected_binary_sha256, str)\n            or len(expected_binary_sha256) != 64\n            or any(ch not in "0123456789abcdef" for ch in expected_binary_sha256)\n        ):\n            raise RuntimeError(f"tool {name} has no canonical binary_sha256 in the lock")\n        actual_binary_sha256 = _sha256(destination)\n        if actual_binary_sha256 != expected_binary_sha256:\n            raise DownloadIntegrityError(\n                f"installed tool hash mismatch for {name}: "\n                f"expected {expected_binary_sha256}, got {actual_binary_sha256}"\n            )\n        tool_paths[name] = str(destination)\n''',
          )

          old_load = '''def load_tool_receipt(root: Path) -> dict[str, Any]:\n    receipt_path = root / "toolchain/receipt.json"\n    if not receipt_path.is_file() or receipt_path.is_symlink():\n        raise StagingCellError(\n            "pinned toolchain receipt is missing; run bootstrap_tools.py into the T084 state root first"\n        )\n    receipt = json.loads(receipt_path.read_text(encoding="utf-8"))\n    lock_path = ROOT / "platform/toolchain.lock.json"\n    expected_lock = sha256_file(lock_path)\n    if receipt.get("schema_version") != 1 or receipt.get("lock_sha256") != expected_lock:\n        raise StagingCellError("toolchain receipt is not bound to the current platform lock")\n    tools = receipt.get("tools") if isinstance(receipt.get("tools"), dict) else {}\n    artifacts = receipt.get("artifacts") if isinstance(receipt.get("artifacts"), dict) else {}\n    missing_tools = [\n        name for name in REQUIRED_TOOLS if not Path(str(tools.get(name, ""))).is_file()\n    ]\n    missing_artifacts = [\n        name\n        for name in REQUIRED_ARTIFACTS\n        if not Path(str(artifacts.get(name, ""))).is_file()\n    ]\n    if missing_tools or missing_artifacts:\n        raise StagingCellError(\n            f"toolchain receipt incomplete: tools={missing_tools} artifacts={missing_artifacts}"\n        )\n    return receipt\n'''
          new_load = '''def require_locked_file(\n    path: Path, expected_sha256: str, *, label: str, executable: bool = False\n) -> None:\n    if (\n        len(expected_sha256) != 64\n        or any(ch not in "0123456789abcdef" for ch in expected_sha256)\n    ):\n        raise StagingCellError(f"{label} has no canonical SHA-256 in the platform lock")\n    try:\n        linked = path.lstat()\n    except OSError as error:\n        raise StagingCellError(f"{label} is missing or unreadable: {path}") from error\n    if stat.S_ISLNK(linked.st_mode) or not stat.S_ISREG(linked.st_mode):\n        raise StagingCellError(f"{label} must be a regular non-symlink file: {path}")\n    if linked.st_uid != os.geteuid() or stat.S_IMODE(linked.st_mode) & 0o022:\n        raise StagingCellError(f"{label} ownership or write mode is unsafe: {path}")\n    if executable and not os.access(path, os.X_OK):\n        raise StagingCellError(f"{label} is not executable: {path}")\n    actual_sha256 = sha256_file(path)\n    if not hmac.compare_digest(actual_sha256, expected_sha256):\n        raise StagingCellError(\n            f"{label} digest mismatch: expected {expected_sha256}, got {actual_sha256}"\n        )\n\n\ndef load_tool_receipt(root: Path) -> dict[str, Any]:\n    receipt_path = root / "toolchain/receipt.json"\n    if not receipt_path.is_file() or receipt_path.is_symlink():\n        raise StagingCellError(\n            "pinned toolchain receipt is missing; run bootstrap_tools.py into the T084 state root first"\n        )\n    receipt = json.loads(receipt_path.read_text(encoding="utf-8"))\n    lock_path = ROOT / "platform/toolchain.lock.json"\n    lock = json.loads(lock_path.read_text(encoding="utf-8"))\n    expected_lock = sha256_file(lock_path)\n    if receipt.get("schema_version") != 1 or receipt.get("lock_sha256") != expected_lock:\n        raise StagingCellError("toolchain receipt is not bound to the current platform lock")\n    cache_root = root / "toolchain"\n    if cache_root.is_symlink() or not cache_root.is_dir():\n        raise StagingCellError("toolchain cache root must be a real directory")\n    receipt_cache = Path(str(receipt.get("cache") or ""))\n    try:\n        cache_matches = receipt_cache.resolve(strict=True) == cache_root.resolve(strict=True)\n    except OSError:\n        cache_matches = False\n    if not cache_matches:\n        raise StagingCellError("toolchain receipt cache path is not the canonical T084 cache")\n    tools = receipt.get("tools") if isinstance(receipt.get("tools"), dict) else {}\n    artifacts = receipt.get("artifacts") if isinstance(receipt.get("artifacts"), dict) else {}\n    lock_tools = lock.get("tools") if isinstance(lock.get("tools"), dict) else {}\n    lock_artifacts = (\n        lock.get("artifacts") if isinstance(lock.get("artifacts"), dict) else {}\n    )\n    missing_specs = [\n        name for name in (*REQUIRED_TOOLS, *REQUIRED_ARTIFACTS)\n        if name not in (lock_tools if name in REQUIRED_TOOLS else lock_artifacts)\n    ]\n    if missing_specs:\n        raise StagingCellError(f"platform lock is missing staging entries: {missing_specs}")\n    for name in REQUIRED_TOOLS:\n        spec = lock_tools[name]\n        expected_path = cache_root / "bin" / str(spec.get("binary") or "")\n        observed_path = Path(str(tools.get(name) or ""))\n        try:\n            path_matches = observed_path.resolve(strict=True) == expected_path.resolve(strict=True)\n        except OSError:\n            path_matches = False\n        if not path_matches:\n            raise StagingCellError(\n                f"toolchain receipt path mismatch for tool {name}: {observed_path}"\n            )\n        require_locked_file(\n            observed_path,\n            str(spec.get("binary_sha256") or ""),\n            label=f"tool {name}",\n            executable=True,\n        )\n    for name in REQUIRED_ARTIFACTS:\n        spec = lock_artifacts[name]\n        expected_path = cache_root / "artifacts" / str(spec.get("filename") or "")\n        observed_path = Path(str(artifacts.get(name) or ""))\n        try:\n            path_matches = observed_path.resolve(strict=True) == expected_path.resolve(strict=True)\n        except OSError:\n            path_matches = False\n        if not path_matches:\n            raise StagingCellError(\n                f"toolchain receipt path mismatch for artifact {name}: {observed_path}"\n            )\n        require_locked_file(\n            observed_path,\n            str(spec.get("sha256") or ""),\n            label=f"artifact {name}",\n        )\n    return receipt\n'''
          replace_once(staging, old_load, new_load)

          marker = '''    def test_persistent_volumes_are_static_prebound_and_fenced_to_data_worker(self) -> None:\n'''
          new_runtime_test = '''    def test_tool_receipt_revalidates_locked_binary_and_artifact_digests(self) -> None:\n        with tempfile.TemporaryDirectory(prefix="staging-tool-receipt-") as tmp_name:\n            temp = Path(tmp_name)\n            repo_root = temp / "repo"\n            state_root = temp / "state"\n            cache = state_root / "toolchain"\n            (repo_root / "platform").mkdir(parents=True)\n            (cache / "bin").mkdir(parents=True)\n            (cache / "artifacts").mkdir(parents=True)\n\n            lock: dict[str, object] = {\n                "schema_version": 1,\n                "tools": {},\n                "artifacts": {},\n            }\n            tools: dict[str, str] = {}\n            artifacts: dict[str, str] = {}\n            for name in staging.REQUIRED_TOOLS:\n                payload = f"tool:{name}".encode()\n                path = cache / "bin" / name\n                path.write_bytes(payload)\n                path.chmod(0o700)\n                lock["tools"][name] = {\n                    "binary": name,\n                    "binary_sha256": staging.sha256_bytes(payload),\n                }\n                tools[name] = str(path)\n            for name in staging.REQUIRED_ARTIFACTS:\n                payload = f"artifact:{name}".encode()\n                filename = f"{name}.locked"\n                path = cache / "artifacts" / filename\n                path.write_bytes(payload)\n                path.chmod(0o600)\n                lock["artifacts"][name] = {\n                    "filename": filename,\n                    "sha256": staging.sha256_bytes(payload),\n                }\n                artifacts[name] = str(path)\n\n            lock_path = repo_root / "platform/toolchain.lock.json"\n            lock_path.write_text(json.dumps(lock), encoding="utf-8")\n            receipt = {\n                "schema_version": 1,\n                "lock_sha256": staging.sha256_file(lock_path),\n                "cache": str(cache),\n                "tools": tools,\n                "artifacts": artifacts,\n                "kubernetes": {"kind_node_image": "kind-node-image"},\n            }\n            receipt_path = cache / "receipt.json"\n            receipt_path.write_text(json.dumps(receipt), encoding="utf-8")\n\n            with mock.patch.object(staging, "ROOT", repo_root):\n                loaded = staging.load_tool_receipt(state_root)\n                self.assertEqual(loaded["lock_sha256"], receipt["lock_sha256"])\n\n                kind = Path(tools["kind"])\n                kind.write_bytes(b"tampered-kind")\n                kind.chmod(0o700)\n                with self.assertRaisesRegex(staging.StagingCellError, "tool kind digest mismatch"):\n                    staging.load_tool_receipt(state_root)\n\n                kind.write_bytes(b"tool:kind")\n                kind.chmod(0o700)\n                first_artifact = staging.REQUIRED_ARTIFACTS[0]\n                Path(artifacts[first_artifact]).write_bytes(b"tampered-artifact")\n                with self.assertRaisesRegex(\n                    staging.StagingCellError, f"artifact {first_artifact} digest mismatch"\n                ):\n                    staging.load_tool_receipt(state_root)\n\n'''
          replace_once(runtime_tests, marker, new_runtime_test + marker)

          platform_marker = '''    def test_tool_bootstrap_selection_is_exact_and_deduplicated(self) -> None:\n'''
          platform_test = '''    def test_toolchain_lock_binds_installed_binary_digests(self) -> None:\n        lock = json.loads(\n            (ROOT / "platform/toolchain.lock.json").read_text(encoding="utf-8")\n        )\n        for name, spec in lock["tools"].items():\n            with self.subTest(name=name):\n                digest = spec.get("binary_sha256")\n                self.assertIsInstance(digest, str)\n                self.assertEqual(len(digest), 64)\n                self.assertTrue(all(ch in "0123456789abcdef" for ch in digest))\n\n'''
          replace_once(platform_tests, platform_marker, platform_test + platform_marker)
          PY

      - name: Regenerate implementation index
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/docmeta/generate-impl-index.sh
          grep -F '| impl.platform.staging-cell | scripts/platform/staging_cell.py | platform | high |' docs/_generated/impl-index.md

      - name: Run focused evidence
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          bash scripts/docmeta/generate-impl-index.sh --check
          uv run --project tools/py --locked python -m unittest \
            scripts.ci.tests.test_staging_cell_runtime_contract \
            scripts.ci.tests.test_kubernetes_platform_contract
          uv run --project tools/py --locked python scripts/platform/staging_cell.py self-check
          uv run --project tools/py --locked python scripts/platform/validate_platform.py --render

      - name: Publish exact tested patch
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/pr1813-toolchain-index-closeout.yml
          git config user.name "Alexander Mohr"
          git config user.email "216529510+alexdermohr@users.noreply.github.com"
          git add -A
          git diff --cached --check
          test -n "$(git diff --cached --name-only)"
          git commit -m "fix(platform): bind staging toolchain integrity"
          git push origin HEAD:bureau/weltgewebe-os-v1-t084/5e0085fc46
