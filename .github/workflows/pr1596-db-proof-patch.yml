---
name: PR1596 Database Proof Patch
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

permissions:
  contents: write

"on":
  push:
    branches:
      - fix/node-delete-archive-history-v1
    paths:
      - '.github/workflows/pr1596-db-proof-patch.yml'

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # tag: v7.0.1
        with:
          fetch-depth: 0

      - name: Apply exact database proof patch
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          test_path = Path("apps/api/tests/db_node_conversations.rs")
          text = test_path.read_text(encoding="utf-8")

          cleanup_pattern = re.compile(
              r"async fn cleanup\(pool: &sqlx::PgPool\) \{.*?\n\}\n\n(?=#\[tokio::test\])",
              re.DOTALL,
          )
          text, cleanup_count = cleanup_pattern.subn("", text, count=1)
          if cleanup_count != 1:
              raise SystemExit(f"cleanup function: expected 1 match, observed {cleanup_count}")

          cleanup_calls = text.count("    cleanup(&pool).await;\n")
          if cleanup_calls != 2:
              raise SystemExit(f"cleanup calls: expected 2 matches, observed {cleanup_calls}")
          text = text.replace("    cleanup(&pool).await;\n", "")

          def replace_once(old: str, new: str, label: str) -> None:
              global text
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected 1 match, observed {count}")
              text = text.replace(old, new, 1)

          replace_once(
              '''    assert_eq!(conversation["id"], conversation_id);
              assert_eq!(conversation["visibility"], "public");''',
              '''    assert_eq!(conversation["id"], conversation_id);
              assert_eq!(conversation["lifecycle_state"], "active");
              assert_eq!(conversation["visibility"], "public");''',
              "active lifecycle response",
          )

          replace_once(
              '''    let removed_edges = delete_node_with_edges_in_postgres(&pool, NODE_ID)
                  .await
                  .expect("node deletion must archive a non-empty public conversation");''',
              '''    let direct_active_delete_error =
                  sqlx::query("DELETE FROM domain_conversations WHERE id = $1::uuid")
                      .bind(&conversation_id)
                      .execute(&pool)
                      .await
                      .expect_err("PostgreSQL must reject deletion of a non-empty active conversation");
              assert_eq!(
                  direct_active_delete_error
                      .as_database_error()
                      .and_then(|error| error.constraint()),
                  Some("domain_conversations_history_guard")
              );

              let removed_edges = delete_node_with_edges_in_postgres(&pool, NODE_ID)
                  .await
                  .expect("node deletion must archive a non-empty public conversation");''',
              "active parent delete proof",
          )

          replace_once(
              '''    assert_eq!(node_title_snapshot, "Gesprächsknoten");
              assert!(archived_at.is_some());''',
              '''    assert_eq!(node_title_snapshot, "Gesprächsknoten");
              assert!(archived_at.is_some());
              let archive_event_count: i64 = sqlx::query_scalar(
                  "SELECT count(*) FROM domain_outbox \
                   WHERE aggregate_type = 'conversation' AND aggregate_id = $1 \
                     AND event_type = 'domain.conversation.archived'",
              )
              .bind(&conversation_id)
              .fetch_one(&pool)
              .await
              .expect("read conversation archive outbox event");
              assert_eq!(archive_event_count, 1);''',
              "archive outbox proof",
          )

          replace_once(
              '''    assert_eq!(status, StatusCode::OK);
              assert!(archive_view["node_id"].is_null());''',
              '''    assert_eq!(status, StatusCode::OK);
              assert_eq!(archive_view["lifecycle_state"], "archived");
              assert!(archive_view["node_id"].is_null());''',
              "archived lifecycle response",
          )

          old_archived_delete = '''    let (status, archived_delete) = json_response(
                  &app,
                  request(
                      "DELETE",
                      &item_path,
                      Some(&admin),
                      None,
                      None,
                      tombstone["updated_at"].as_str(),
                  ),
              )
              .await;
              assert_eq!(status, StatusCode::CONFLICT);
              assert_eq!(archived_delete["code"], "conversation_archived");'''
          new_archived_delete = '''    let archived_guest_path = format!(
                  "{message_path}/{}",
                  guest_message["id"].as_str().expect("guest message id")
              );
              let (status, archived_tombstone) = json_response(
                  &app,
                  request(
                      "DELETE",
                      &archived_guest_path,
                      Some(&guest),
                      None,
                      None,
                      guest_message["updated_at"].as_str(),
                  ),
              )
              .await;
              assert_eq!(status, StatusCode::OK);
              assert!(archived_tombstone["content"].is_null());
              assert!(archived_tombstone["deleted_at"].is_string());

              let direct_tombstone_target: String = sqlx::query_scalar(
                  "SELECT id::text FROM domain_messages \
                   WHERE conversation_id = $1::uuid AND content = 'Zweiter'",
              )
              .bind(&conversation_id)
              .fetch_one(&pool)
              .await
              .expect("message for direct archive tombstone proof");
              let direct_tombstone = sqlx::query(
                  "UPDATE domain_messages \
                   SET content = NULL, \
                       deleted_at = GREATEST(NOW(), updated_at + INTERVAL '1 microsecond'), \
                       updated_at = GREATEST(NOW(), updated_at + INTERVAL '1 microsecond') \
                   WHERE id = $1::uuid",
              )
              .bind(&direct_tombstone_target)
              .execute(&pool)
              .await
              .expect("PostgreSQL must allow the canonical one-way archive tombstone");
              assert_eq!(direct_tombstone.rows_affected(), 1);'''
          replace_once(old_archived_delete, new_archived_delete, "archive tombstone API and SQL proof")

          physical_old = 'Some("domain_messages_archived_conversation_guard")\n    );\n\n    let direct_archive_update_error'
          physical_new = 'Some("domain_messages_physical_delete_guard")\n    );\n\n    let direct_archive_update_error'
          replace_once(physical_old, physical_new, "physical message delete constraint")

          old_guard_count = text.count('Some("domain_conversations_archived_record_guard")')
          if old_guard_count != 2:
              raise SystemExit(
                  f"archived conversation guard expectations: expected 2, observed {old_guard_count}"
              )
          text = text.replace(
              'Some("domain_conversations_archived_record_guard")',
              'Some("domain_conversations_history_guard")',
          )

          test_path.write_text(text, encoding="utf-8")

          spec_path = Path("docs/specs/garnrolle-knoten-faden.md")
          spec = spec_path.read_text(encoding="utf-8")

          relation_old = '''  - type: relates_to
              target: docs/specs/governance-antraege.md
            - type: supersedes'''
          relation_new = '''  - type: relates_to
              target: docs/specs/governance-antraege.md
            - type: relates_to
              target: docs/specs/objektlebenszyklen-und-loeschwirkungen.md
            - type: supersedes'''
          if spec.count(relation_old) != 1:
              raise SystemExit("lifecycle relation: expected exactly one match")
          spec = spec.replace(relation_old, relation_new, 1)

          archive_old = '''Das Archiv bleibt über seine stabile Gesprächs-ID öffentlich lesbar. Nach der
          Archivierung sind neue Beiträge, Änderungen und Entfernungen ausgeschlossen;
          die frühere Diskussion darf nicht durch das Löschen ihres Kartenobjekts
          verschwinden oder nachträglich umgeschrieben werden.'''
          archive_new = '''Das Archiv bleibt über seine stabile Gesprächs-ID öffentlich lesbar. Nach der
          Archivierung sind neue Beiträge und normale Inhaltsänderungen ausgeschlossen.
          Autoren dürfen eigene Beiträge weiterhin zurückziehen, Administratoren dürfen
          sie moderativ entfernen; beides erzeugt einen Tombstone statt einer physischen
          Löschung. Beim Accountaustritt wird weiterhin nur die aktive Accountbindung
          gelöst. Die frühere Diskussion darf nicht durch das Entfernen ihres Kartenobjekts
          verschwinden oder nachträglich wiederbeschrieben werden. Die übergreifenden
          Begriffe und Purgegrenzen normiert
          `docs/specs/objektlebenszyklen-und-loeschwirkungen.md`.'''
          if spec.count(archive_old) != 1:
              raise SystemExit("archive product text: expected exactly one match")
          spec = spec.replace(archive_old, archive_new, 1)
          spec_path.write_text(spec, encoding="utf-8")
          PY

      - name: Format, inspect and commit proof patch
        shell: bash
        run: |
          cargo fmt --manifest-path apps/api/Cargo.toml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/api/tests/db_node_conversations.rs docs/specs/garnrolle-knoten-faden.md
          git diff --cached --check
          git diff --cached --stat
          git commit -m "test(conversations): prove canonical archive lifecycle"
          git push origin HEAD:${GITHUB_REF_NAME}
