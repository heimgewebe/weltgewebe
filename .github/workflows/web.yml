---
# Web Check (Gate A) — canonical location for web unit tests (vitest) and Playwright E2E.
# ci.yml does NOT run vitest; it handles build/lint/typecheck + API tests + guard tests.
# This split avoids double vitest execution when both workflows trigger on the same PR.
name: Web Check (Gate A)

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

permissions:
  contents: read

"on":
  pull_request:
    branches: [main, dev]
    paths:
      - apps/web/**
      - .github/workflows/web.yml
      - .node-version
  push:
    branches: [main, dev, 'feat/**', 'fix/**']
    paths:
      - apps/web/**
      - .github/workflows/web.yml
      - .node-version

jobs:
  build:
    name: Build & Lint
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      actions: write   # required for npm cache restore
    env:
      PUPPETEER_SKIP_DOWNLOAD: "true"
      NPM_CONFIG_AUDIT: "false"
      NPM_CONFIG_FUND: "false"
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}
      cancel-in-progress: true
    defaults:
      run:
        working-directory: apps/web

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # tag: v7.0.1

      - name: Install pnpm
        uses: pnpm/action-setup@b0f76dfb45f55f8421693e4803ac7bb65143bd34 # tag: v6

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version-file: '.node-version'
          cache: 'pnpm'
          cache-dependency-path: apps/web/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: SvelteKit prepare
        run: pnpm sync

      - name: Typecheck
        run: pnpm check

      - name: Lint
        run: pnpm lint

      - name: Build
        run: CI=true pnpm build

      - name: Get Playwright version
        shell: bash
        run: |
          PLAYWRIGHT_VERSION=$(pnpm exec playwright --version | awk '{print $2}')
          echo "PLAYWRIGHT_VERSION=$PLAYWRIGHT_VERSION" >> $GITHUB_ENV

      - name: Cache Playwright browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # tag: v6.1.0
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-${{ runner.arch }}-playwright-${{ env.PLAYWRIGHT_VERSION }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-playwright-

      - name: Unit tests (Vitest)
        run: pnpm test:unit

      - name: "Playwright: setup browsers (CI)"
        # WICHTIG: Nicht "0" setzen – jede nicht-leere Zeichenkette gilt als truthy
        # und verhindert weiterhin den Download. Ein leerer String sorgt dafür,
        # dass vorhandene job-/repo-/orgweite Defaults überschrieben werden.
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: ""
        run: pnpm test:setup

      - name: Debug Playwright cache path (temporary)
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: ls -la ~/.cache/ms-playwright || true

      - name: Test (CI)
        run: pnpm test:ci

      - name: Upload Playwright report (best-effort)
        if: always()
        run: |
          if [ -d "playwright-report" ]; then
            echo "Playwright report directory contents:"
            ls -R playwright-report || true
          else
            echo "No Playwright report directory found at apps/web/playwright-report"
          fi
      - name: Upload Playwright report artifact
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # tag: v7.0.1
        with:
          name: playwright-report
          path: apps/web/playwright-report
          if-no-files-found: ignore

  lifecycle-diagnostic-pr1568:
    if: github.event_name == 'pull_request' && github.head_ref == 'feat/first-user-ux-v1'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feat/first-user-ux-v1

      - name: Materialize lifecycle change
        shell: python
        run: |
          from pathlib import Path

          path = Path("apps/web/src/lib/components/MyGarnrolleSection.svelte")
          text = path.read_text(encoding="utf-8")
          text = text.replace(
              'import { tick } from "svelte";',
              'import { onDestroy, tick } from "svelte";',
              1,
          )
          marker = "\n  function currentDraft(): GarnrolleDraft {"
          text = text.replace(
              marker,
              "\n  onDestroy(invalidateAccountOperations);\n" + marker,
              1,
          )
          path.write_text(text, encoding="utf-8")

      - name: Upload exact generated component
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: pr1568-lifecycle-component
          path: apps/web/src/lib/components/MyGarnrolleSection.svelte
          if-no-files-found: error
