---
# Web Check (Gate A) — path-scoped web quality gates and Playwright E2E.
# Pull requests and main pushes receive Vitest through `just ci`; non-main branch
# pushes use the conditional fallback below because ci.yml does not cover them.
name: Web Check (Gate A)

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

permissions:
  contents: read
  actions: write

"on":
  pull_request:
    branches: [main, dev]
    paths:
      - apps/web/**
      - .github/workflows/web.yml
      - .github/workflows/reusable-web-check.yml
      - .node-version
  push:
    branches: [main, dev, 'feat/**', 'fix/**']
    paths:
      - apps/web/**
      - .github/workflows/web.yml
      - .github/workflows/reusable-web-check.yml
      - .node-version

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & Lint
    uses: ./.github/workflows/reusable-web-check.yml
    with:
      job_name: Build & Lint
      timeout_minutes: 30
      run_unit_tests: ${{ github.event_name == 'push' && github.ref != 'refs/heads/main' }}
      run_typecheck: true
      run_lint: true
      run_build: true
      run_demo_api: false
      suite: ci
      artifact_name: playwright-report
