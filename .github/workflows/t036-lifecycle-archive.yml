---
name: T036 branch-bound lifecycle archival

"on":
  pull_request:
    types: [synchronize, reopened]

permissions:
  contents: write

jobs:
  archive-exact-point-in-time-reports:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.head_ref == 'docs/t036-truth-lifecycle-20260824'
    runs-on: ubuntu-latest
    concurrency:
      group: t036-lifecycle-archive-${{ github.event.pull_request.number }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # tag: v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Archive exact due point-in-time reports and self-remove
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          due_reports = {
              "docs/reports/domain-account-write-path-proof.md": "2026-07-16",
              "docs/reports/auth-persistence-runtime-target-reconciliation.md": "2026-08-22",
              "docs/reports/domain-backfill-proof.md": "2026-07-16",
              "docs/reports/domain-read-path-proof.md": "2026-07-16",
              "docs/reports/domain-account-email-uniqueness-audit.md": "2026-07-13",
              "docs/reports/domain-node-write-path-proof.md": "2026-07-16",
              "docs/reports/domain-edge-reference-audit.md": "2026-07-16",
          }

          generic_notice = (
              "> **Lifecycle-Hinweis (2026-08-24):** Archivierter Point-in-Time-Beleg.\n"
              "> Die historischen Aussagen bleiben unverändert; aktuelle Statuswahrheit ist aus\n"
              "> den kanonischen Status-, Architektur- und Runtimequellen abzuleiten.\n\n"
          )
          auth_notice = (
              "> **Lifecycle-Hinweis (2026-08-24):** Archivierter Point-in-Time-Abgleich.\n"
              "> Die historischen Runtime-Beobachtungen bleiben unverändert. Die normative\n"
              "> Gegenwartsentscheidung liegt in `docs/adr/ADR-0007__auth-persistence-production-db-path.md`;\n"
              "> aktuelle Betriebswahrheit muss aus dem heutigen Deployment/Runtime-Readback kommen.\n\n"
          )

          for rel, due in due_reports.items():
              path = Path(rel)
              text = path.read_text(encoding="utf-8")
              expected = {
                  "status: active\n": 1,
                  "lifecycle_state: active\n": 1,
                  f"review_after: {due}\n": 1,
              }
              for needle, count in expected.items():
                  actual = text.count(needle)
                  if actual != count:
                      raise SystemExit(
                          f"fail-closed: {rel}: expected {count} x {needle!r}, found {actual}"
                      )
              text = text.replace("status: active\n", "status: deprecated\n", 1)
              text = text.replace("lifecycle_state: active\n", "lifecycle_state: archived\n", 1)
              text = text.replace(f"review_after: {due}\n", "", 1)

              heading_start = text.find("\n# ")
              if heading_start < 0:
                  raise SystemExit(f"fail-closed: {rel}: missing first H1")
              heading_end = text.find("\n", heading_start + 1)
              if heading_end < 0:
                  raise SystemExit(f"fail-closed: {rel}: malformed H1")
              notice = auth_notice if "auth-persistence-runtime-target-reconciliation" in rel else generic_notice
              text = text[: heading_end + 1] + "\n" + notice + text[heading_end + 1 :]

              if "auth-persistence-runtime-target-reconciliation" in rel:
                  exact_pairs = [
                      ("- **Lifecycle-State:** active", "- **Lifecycle-State:** archived"),
                      ("- **Review after:** 2026-08-22", "- **Review after:** entfällt; am 2026-08-24 archiviert"),
                      (
                          "- **Bewertung:** Weiterhin aktiver Architekturabgleich zur Produktionsentscheidung\n  direkter PostgreSQL-Pfad vs. PgBouncer-Dev-/Spezialpfad. Keine neue\n  Runtime-Aussage in diesem PR.",
                          "- **Bewertung:** Archivierter Architekturabgleich zur Produktionsentscheidung.\n  ADR-0007 bleibt normative Quelle; aktuelle Runtime-Aussagen werden nicht aus\n  diesem historischen Bericht abgeleitet.",
                      ),
                  ]
                  for old, new in exact_pairs:
                      count = text.count(old)
                      if count != 1:
                          raise SystemExit(
                              f"fail-closed: {rel}: expected exactly one lifecycle narrative match, found {count}"
                          )
                      text = text.replace(old, new)

              path.write_text(text, encoding="utf-8")

          roadmap = Path("docs/roadmap.md")
          text = roadmap.read_text(encoding="utf-8")
          roadmap_pairs = [
              (
                  "| Auth-Persistenz (Runtime-Proof) | [auth-persistence-runtime-proof.md](blueprints/auth-persistence-runtime-proof.md) | [auth-persistence-runtime-target-reconciliation.md](reports/auth-persistence-runtime-target-reconciliation.md), [optimierungsstatus.md](reports/optimierungsstatus.md) |",
                  "| Auth-Persistenz (Runtime-Proof) | [auth-persistence-runtime-proof.md](blueprints/auth-persistence-runtime-proof.md) | [ADR-0007](adr/ADR-0007__auth-persistence-production-db-path.md), [optimierungsstatus.md](reports/optimierungsstatus.md) |",
              ),
              (
                  "[Zielarchitektur-Abgleich](reports/auth-persistence-runtime-target-reconciliation.md)",
                  "[archivierter Zielarchitektur-Abgleich](reports/auth-persistence-runtime-target-reconciliation.md)",
              ),
          ]
          for old, new in roadmap_pairs:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(
                      f"fail-closed: docs/roadmap.md: expected exactly one match, found {count}: {old!r}"
                  )
              text = text.replace(old, new)
          roadmap.write_text(text, encoding="utf-8")

          workflow = Path(".github/workflows/t036-lifecycle-archive.yml")
          if not workflow.is_file():
              raise SystemExit("fail-closed: temporary workflow cannot self-remove")
          workflow.unlink()
          PY
          git diff --check

      - name: Commit lifecycle archival
        shell: bash
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- docs/reports docs/roadmap.md .github/workflows/t036-lifecycle-archive.yml
          git diff --cached --check
          test -n "$(git diff --cached --name-only)"
          git commit -m "docs: archive due point-in-time evidence"
          git push origin "HEAD:${HEAD_REF}"
