name: Apply collective lock-order correction

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'feat/collective-edit-delete-v1'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: feat/collective-edit-delete-v1
      - uses: dtolnay/rust-toolchain@stable
      - name: Align PostgreSQL lock order
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('apps/api/src/domain_db.rs')
          text = path.read_text()
          old = '''    let mut tx = pool.begin().await.map_err(NodeWriteError::Database)?;
    // Edge creation also takes this table lock. Holding it through both deletes makes
    // "node + attached edges" one closed graph mutation instead of a race-prone pair.
    sqlx::query("LOCK TABLE domain_edges IN EXCLUSIVE MODE")
        .execute(&mut *tx)
        .await
        .map_err(NodeWriteError::Database)?;
    let node_id: Option<String> =
        sqlx::query_scalar("SELECT id FROM domain_nodes WHERE id = $1 FOR UPDATE")
            .bind(id)
            .fetch_optional(&mut *tx)
            .await
            .map_err(NodeWriteError::Database)?;
    if node_id.is_none() {
        tx.rollback().await.ok();
        return Err(NodeWriteError::NotFound);
    }

'''
          new = '''    let mut tx = pool.begin().await.map_err(NodeWriteError::Database)?;
    let node_id: Option<String> =
        sqlx::query_scalar("SELECT id FROM domain_nodes WHERE id = $1 FOR UPDATE")
            .bind(id)
            .fetch_optional(&mut *tx)
            .await
            .map_err(NodeWriteError::Database)?;
    if node_id.is_none() {
        tx.rollback().await.ok();
        return Err(NodeWriteError::NotFound);
    }
    // Keep the same lock order as edge creation: endpoint rows first, edge table
    // second. Reversing it would permit a create/delete deadlock.
    sqlx::query("LOCK TABLE domain_edges IN EXCLUSIVE MODE")
        .execute(&mut *tx)
        .await
        .map_err(NodeWriteError::Database)?;

'''
          if text.count(old) != 1:
              raise SystemExit(f'unexpected lock block count: {text.count(old)}')
          path.write_text(text.replace(old, new, 1))
          PY
          cargo fmt --all
          git diff --check
      - name: Verify API types and focused contract
        run: |
          cargo check -p weltgewebe-api --all-targets
          cargo test -p weltgewebe-api --test api_collective_mutations -- --nocapture
      - name: Commit corrected product state
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/apply-collective-lock-order-fix.yml
          git add apps/api/src/domain_db.rs
          git commit -m "fix: align collective delete lock order"
          git push origin HEAD:feat/collective-edit-delete-v1
