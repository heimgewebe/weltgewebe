---
name: PR1596 Product Log Diagnostic
# activation revision: 5

permissions:
  actions: read
  contents: read

"on":
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/pr1596-product-log-diagnostic.yml'

jobs:
  read-tail:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Read product convergence failure
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api \
            -H 'Accept: application/vnd.github+json' \
            /repos/${GITHUB_REPOSITORY}/actions/jobs/90210728355/logs \
            > /tmp/pr1596-product.log
          python3 - <<'PY'
          from pathlib import Path
          import re

          ansi = re.compile(r'\x1b\[[0-9;]*m')
          lines = [ansi.sub('', line) for line in Path('/tmp/pr1596-product.log').read_text(errors='replace').splitlines()]
          hits = [index for index, line in enumerate(lines) if 'error' in line.lower()]
          print('BEGIN_PR1596_PRODUCT_ERROR')
          for index in hits[-6:]:
              for line in lines[max(0, index - 6): min(len(lines), index + 25)]:
                  print(line)
              print('---')
          print('END_PR1596_PRODUCT_ERROR')
          PY
