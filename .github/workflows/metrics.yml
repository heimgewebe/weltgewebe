---
# Thin consumer wrapper — contract ownership stays in metarepo.
# Delegates to the canonical reusable metrics workflow; no local
# fetch / validate / schema-normalization logic needed here.
name: "📊 Metrics Snapshot & Validation"

permissions:
  contents: read
  actions: write
  checks: write

"on":
  workflow_dispatch:
  schedule:
    - cron: "0 * * * *"

jobs:
  metrics:
    uses: heimgewebe/metarepo/.github/workflows/wgx-metrics.yml@9450e1dc7d1e75bb349dc14278e2f3ec691e5f0f
    with:
      metarepo_ref: "9450e1dc7d1e75bb349dc14278e2f3ec691e5f0f"
    secrets:
      post_url: ${{ secrets.HAUSKI_METRICS_URL }}
