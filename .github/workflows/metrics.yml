---
# Thin consumer wrapper — contract ownership stays in metarepo.
# Delegates to the canonical reusable metrics workflow; no local
# fetch / validate / schema-normalization logic needed here.
name: "📊 Metrics Snapshot & Validation"

permissions:
  contents: read
  actions: write
  checks: write

"on":
  workflow_dispatch:
  schedule:
    - cron: "0 * * * *"

jobs:
  metrics:
    uses: heimgewebe/metarepo/.github/workflows/wgx-metrics.yml@12d45ad97eb40fe6e5dc97546ead71f66acab6ca
    with:
      metarepo_ref: "12d45ad97eb40fe6e5dc97546ead71f66acab6ca"
    secrets:
      post_url: ${{ secrets.HAUSKI_METRICS_URL }}
      post_token: ${{ secrets.HAUSKI_METRICS_TOKEN }}
