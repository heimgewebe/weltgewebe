---
name: Temporary PR 1568 formatter

permissions:
  contents: read

"on":
  push:
    branches: ['feat/first-user-ux-v1']
    paths:
      - .github/workflows/tmp-format-pr1568.yml

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: apps/web
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Install pnpm
        uses: pnpm/action-setup@b0f76dfb45f55f8421693e4803ac7bb65143bd34

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version-file: '.node-version'
          cache: 'pnpm'
          cache-dependency-path: apps/web/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format changed web files
        run: |
          pnpm exec prettier --write \
            src/lib/api/domainWrites.ts \
            src/lib/components/MyGarnrolleSection.svelte \
            src/lib/components/TopBar.svelte \
            src/lib/garnrolle/visibility.ts \
            src/routes/antraege/+page.svelte \
            tests/garnrolle-update-safety.spec.ts

      - name: Stage formatted files
        run: |
          mkdir -p /tmp/pr1568-formatted/apps/web/src/lib/api
          mkdir -p /tmp/pr1568-formatted/apps/web/src/lib/components
          mkdir -p /tmp/pr1568-formatted/apps/web/src/lib/garnrolle
          mkdir -p /tmp/pr1568-formatted/apps/web/src/routes/antraege
          mkdir -p /tmp/pr1568-formatted/apps/web/tests
          cp src/lib/api/domainWrites.ts /tmp/pr1568-formatted/apps/web/src/lib/api/
          cp src/lib/components/MyGarnrolleSection.svelte /tmp/pr1568-formatted/apps/web/src/lib/components/
          cp src/lib/components/TopBar.svelte /tmp/pr1568-formatted/apps/web/src/lib/components/
          cp src/lib/garnrolle/visibility.ts /tmp/pr1568-formatted/apps/web/src/lib/garnrolle/
          cp src/routes/antraege/+page.svelte /tmp/pr1568-formatted/apps/web/src/routes/antraege/
          cp tests/garnrolle-update-safety.spec.ts /tmp/pr1568-formatted/apps/web/tests/

      - name: Upload formatted files
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: pr1568-formatted
          path: /tmp/pr1568-formatted
          if-no-files-found: error
