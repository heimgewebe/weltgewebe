---
name: PR1596 Domain Delete Outcome
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

permissions:
  contents: write

"on":
  push:
    branches:
      - fix/node-delete-archive-history-v1
    paths:
      - '.github/workflows/pr1596-domain-delete-outcome.yml'

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # tag: v7.0.1
        with:
          fetch-depth: 0
      - name: Patch domain helper
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("apps/api/src/domain_db.rs")
          text = path.read_text(encoding="utf-8")

          def once(old: str, new: str, label: str) -> None:
              global text
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected 1 match, observed {count}")
              text = text.replace(old, new, 1)

          once(
              '''pub async fn delete_node_with_edges_in_postgres(
                  pool: &PgPool,
                  id: &str,
              ) -> Result<Vec<String>, NodeWriteError> {
                  let mut tx = pool.begin().await.map_err(NodeWriteError::Database)?;''',
              '''#[derive(Clone, Debug, PartialEq, Eq)]
              pub enum NodeConversationDeleteEffect {
                  DeletedEmpty,
                  Archived { conversation_id: String },
              }

              #[derive(Clone, Debug, PartialEq, Eq)]
              pub struct NodeDeleteOutcome {
                  pub removed_edge_ids: Vec<String>,
                  pub conversation_effect: NodeConversationDeleteEffect,
              }

              pub async fn delete_node_with_edges_in_postgres(
                  pool: &PgPool,
                  id: &str,
              ) -> Result<Vec<String>, NodeWriteError> {
                  Ok(delete_node_with_effects_in_postgres(pool, id)
                      .await?
                      .removed_edge_ids)
              }

              pub async fn delete_node_with_effects_in_postgres(
                  pool: &PgPool,
                  id: &str,
              ) -> Result<NodeDeleteOutcome, NodeWriteError> {
                  let mut tx = pool.begin().await.map_err(NodeWriteError::Database)?;''',
              "delete helper signature",
          )

          once(
              '''    if node_id.is_none() {
                      tx.rollback().await.ok();
                      return Err(NodeWriteError::NotFound);
                  }

                  // The database BEFORE DELETE trigger owns the history decision.''',
              '''    if node_id.is_none() {
                      tx.rollback().await.ok();
                      return Err(NodeWriteError::NotFound);
                  }

                  let conversation_id: String = sqlx::query_scalar(
                      "SELECT id::text FROM domain_conversations WHERE node_id = $1 FOR UPDATE",
                  )
                  .bind(id)
                  .fetch_one(&mut *tx)
                  .await
                  .map_err(NodeWriteError::Database)?;
                  let conversation_has_messages: bool = sqlx::query_scalar(
                      "SELECT EXISTS (SELECT 1 FROM domain_messages WHERE conversation_id = $1::uuid)",
                  )
                  .bind(&conversation_id)
                  .fetch_one(&mut *tx)
                  .await
                  .map_err(NodeWriteError::Database)?;

                  // The database BEFORE DELETE trigger owns the history decision.''',
              "conversation effect lock",
          )

          once(
              '''    tx.commit().await.map_err(NodeWriteError::Database)?;
                  Ok(edge_ids)
              }

              // ── node-create write path''',
              '''    tx.commit().await.map_err(NodeWriteError::Database)?;
                  Ok(NodeDeleteOutcome {
                      removed_edge_ids: edge_ids,
                      conversation_effect: if conversation_has_messages {
                          NodeConversationDeleteEffect::Archived { conversation_id }
                      } else {
                          NodeConversationDeleteEffect::DeletedEmpty
                      },
                  })
              }

              // ── node-create write path''',
              "structured delete return",
          )

          path.write_text(text, encoding="utf-8")
          PY
          cargo fmt --manifest-path apps/api/Cargo.toml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/api/src/domain_db.rs
          git diff --cached --check
          git commit -m "feat(nodes): bind conversation effect to delete transaction"
          git push origin HEAD:${GITHUB_REF_NAME}
