---
name: "Validate Domain Schemas"
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

permissions:
  contents: read
"on":
  push:
    paths:
      - 'contracts/domain/**.schema.json'
      - 'contracts/domain/examples/**.json'
      - 'contracts/federation/v1/**.json'
      - '.node-version'
  pull_request:
    paths:
      - 'contracts/domain/**.schema.json'
      - 'contracts/domain/examples/**.json'
      - 'contracts/federation/v1/**.json'
      - '.node-version'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-schemas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # tag: v7.0.1
      - uses: pnpm/action-setup@b0f76dfb45f55f8421693e4803ac7bb65143bd34 # tag: v6
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version-file: '.node-version'
          cache: 'pnpm'

      - name: Install ajv-cli and ajv-formats
        run: pnpm install -g ajv-cli ajv-formats

      - name: Compile schemas
        run: |
          for schema in contracts/domain/*.schema.json; do
            echo "Compiling $schema"
            ajv compile -s "$schema" --strict=false -c ajv-formats
          done

      - name: Validate example instances
        run: |
          set -euo pipefail
          shopt -s nullglob

          for example in contracts/domain/examples/*.example.json; do
            filename=$(basename "$example")
            entity="${filename%.example.json}"
            schema="contracts/domain/${entity}.schema.json"
            echo "Validating $example against $schema"
            ajv validate -s "$schema" -d "$example" -c ajv-formats
          done

      - name: Compile Federation v1 schemas
        run: |
          set -euo pipefail
          for schema in contracts/federation/v1/*.schema.json; do
            echo "Compiling $schema"
            ajv compile --spec=draft2020 -s "$schema" --strict=false -c ajv-formats
          done

      - name: Validate Federation v1 positive examples
        run: |
          set -euo pipefail
          ajv validate --spec=draft2020 -s contracts/federation/v1/event.schema.json \
            -d contracts/federation/v1/examples/event.example.json --strict=false -c ajv-formats
          ajv validate --spec=draft2020 -s contracts/federation/v1/cell-descriptor.schema.json \
            -d contracts/federation/v1/examples/cell-descriptor.example.json --strict=false -c ajv-formats

      - name: Reject Federation v1 negative fixtures
        run: |
          set -euo pipefail
          for fixture in contracts/federation/v1/examples/invalid/event.*.invalid.json; do
            echo "Expecting schema rejection: $fixture"
            if ajv validate --spec=draft2020 -s contracts/federation/v1/event.schema.json \
              -d "$fixture" --strict=false -c ajv-formats; then
              echo "error: invalid fixture unexpectedly passed: $fixture" >&2
              exit 1
            fi
          done
