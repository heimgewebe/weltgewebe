---
name: PR1813 Flux PVC wait hardening

"on":
  push:
    branches:
      - bureau/weltgewebe-os-v1-t084/5e0085fc46
    paths:
      - .github/workflows/pr1813-flux-pvc-wait-fix.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # tag: v7.0.1
        with:
          fetch-depth: 0
          ref: bureau/weltgewebe-os-v1-t084/5e0085fc46

      - name: Verify exact parent
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "f4912f5bd1734638f8a1b69f8fd100e306fee628"

      - name: Harden Flux apply and PVC wait contract
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              p = Path(path)
              text = p.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one replacement, found {count}")
              p.write_text(text.replace(old, new, 1), encoding="utf-8")

          staging = "scripts/platform/staging_cell.py"
          replace_once(
              staging,
              '''SECRET_SOURCE_ANNOTATION = "commonthing.net/external-secret-source-sha256"\nPVC_BIND_TIMEOUT_SECONDS = 45.0\n''',
              '''SECRET_SOURCE_ANNOTATION = "commonthing.net/external-secret-source-sha256"\nDATA_KUSTOMIZATION_TIMEOUT = "8m"\nDATA_KUSTOMIZATION_TIMEOUT_SECONDS = 8 * 60.0\nPVC_BIND_TIMEOUT_SECONDS = 45.0\n''',
          )
          replace_once(
              staging,
              '''                "timeout": "8m",\n''',
              '''                "timeout": DATA_KUSTOMIZATION_TIMEOUT,\n''',
          )
          replace_once(
              staging,
              '''def wait_pvcs_bound(\n    kubectl: str, *, timeout_seconds: float = PVC_BIND_TIMEOUT_SECONDS\n) -> None:\n    pvcs = ("postgres-data", "nats-data")\n    deadline = time.monotonic() + timeout_seconds\n    observed: dict[str, str] = {}\n    while True:\n        for pvc in pvcs:\n            phase = output(\n                [\n                    kubectl,\n                    "-n",\n                    DATA_NAMESPACE,\n                    "get",\n                    "pvc",\n                    pvc,\n                    "--ignore-not-found",\n                    "-o",\n                    "jsonpath={.status.phase}",\n                ]\n            )\n            observed[pvc] = phase or "missing"\n        if all(observed[pvc] == "Bound" for pvc in pvcs):\n            return\n        unexpected = {\n            pvc: phase\n            for pvc, phase in observed.items()\n            if phase not in {"missing", "Pending", "Bound"}\n        }\n        if unexpected:\n            raise StagingCellError(f"staging PVC entered unexpected phase: {unexpected!r}")\n        if time.monotonic() >= deadline:\n            raise StagingCellError(\n                f"staging PVCs did not bind within {timeout_seconds:g}s: {observed!r}"\n            )\n        time.sleep(1)\n''',
              '''def pvc_phase_snapshot(kubectl: str) -> dict[str, str]:\n    pvcs = ("postgres-data", "nats-data")\n    raw = output(\n        [\n            kubectl,\n            "-n",\n            DATA_NAMESPACE,\n            "get",\n            "pvc",\n            *pvcs,\n            "--ignore-not-found",\n            "-o",\n            "json",\n        ]\n    )\n    if not raw:\n        return {pvc: "missing" for pvc in pvcs}\n    try:\n        document = json.loads(raw)\n    except json.JSONDecodeError as error:\n        raise StagingCellError("cannot parse staging PVC status JSON") from error\n    if not isinstance(document, dict):\n        raise StagingCellError("staging PVC status payload is not an object")\n    items = document.get("items")\n    if isinstance(items, list):\n        documents = items\n    elif document.get("kind") == "PersistentVolumeClaim":\n        documents = [document]\n    else:\n        raise StagingCellError("staging PVC status payload has no resource items")\n    observed = {pvc: "missing" for pvc in pvcs}\n    for item in documents:\n        if not isinstance(item, dict):\n            continue\n        metadata = item.get("metadata")\n        status = item.get("status")\n        if not isinstance(metadata, dict) or not isinstance(status, dict):\n            continue\n        name = metadata.get("name")\n        if name in observed:\n            phase = status.get("phase")\n            observed[str(name)] = phase if isinstance(phase, str) and phase else "missing"\n    return observed\n\n\ndef wait_pvcs_bound(\n    kubectl: str,\n    *,\n    visibility_timeout_seconds: float = DATA_KUSTOMIZATION_TIMEOUT_SECONDS,\n    bind_timeout_seconds: float = PVC_BIND_TIMEOUT_SECONDS,\n) -> None:\n    pvcs = ("postgres-data", "nats-data")\n    visibility_deadline = time.monotonic() + visibility_timeout_seconds\n    bind_deadline: float | None = None\n    while True:\n        observed = pvc_phase_snapshot(kubectl)\n        if all(observed[pvc] == "Bound" for pvc in pvcs):\n            return\n        unexpected = {\n            pvc: phase\n            for pvc, phase in observed.items()\n            if phase not in {"missing", "Pending", "Bound"}\n        }\n        if unexpected:\n            raise StagingCellError(f"staging PVC entered unexpected phase: {unexpected!r}")\n        now = time.monotonic()\n        all_visible = all(observed[pvc] != "missing" for pvc in pvcs)\n        if all_visible:\n            if bind_deadline is None:\n                bind_deadline = now + bind_timeout_seconds\n            if now >= bind_deadline:\n                raise StagingCellError(\n                    "staging PVCs did not bind within "\n                    f"{bind_timeout_seconds:g}s after becoming visible: {observed!r}"\n                )\n        elif now >= visibility_deadline:\n            raise StagingCellError(\n                "staging PVCs did not become visible within the Flux Kustomization "\n                f"budget of {visibility_timeout_seconds:g}s: {observed!r}"\n            )\n        time.sleep(1)\n''',
          )
          replace_once(
              staging,
              '''    root.mkdir(parents=True, exist_ok=True)\n    os.chmod(root, 0o700)\n    data_root = root / "data"\n    data_root.mkdir(parents=True, exist_ok=True)\n    os.chmod(data_root, 0o755)\n    (data_root / "postgres").mkdir(parents=True, exist_ok=True)\n    (data_root / "nats").mkdir(parents=True, exist_ok=True)\n    configure_reference_paths(root)\n    receipt = load_tool_receipt(root)\n''',
              '''    root.mkdir(parents=True, exist_ok=True)\n    os.chmod(root, 0o700)\n    configure_reference_paths(root)\n    receipt = load_tool_receipt(root)\n    data_root = root / "data"\n    data_root.mkdir(parents=True, exist_ok=True)\n    os.chmod(data_root, 0o755)\n    (data_root / "postgres").mkdir(parents=True, exist_ok=True)\n    (data_root / "nats").mkdir(parents=True, exist_ok=True)\n''',
          )
          replace_once(
              staging,
              '''                    "source_ready": result.get("source_ready") == "True",\n                    "data_ready": result.get("data_ready") == "True",\n                    "data_revision": str(result.get("data_revision") or ""),\n''',
              '''                    "source_ready": result.get("source_ready") == "True",\n                    "source_ready_status": str(result.get("source_ready") or "missing"),\n                    "data_ready": result.get("data_ready") == "True",\n                    "data_ready_status": str(result.get("data_ready") or "missing"),\n                    "data_revision": str(result.get("data_revision") or ""),\n''',
          )

          tests = "scripts/ci/tests/test_staging_cell_runtime_contract.py"
          replace_once(
              tests,
              '''        self.assertFalse(public["source_matches_commit"])\n        self.assertFalse(public["data_matches_commit"])\n''',
              '''        self.assertFalse(public["source_matches_commit"])\n        self.assertEqual(public["source_ready_status"], "missing")\n        self.assertEqual(public["data_ready_status"], "False")\n        self.assertFalse(public["data_matches_commit"])\n''',
          )
          replace_once(
              tests,
              '''        self.assertNotIn("allow-app-data-access", policies)\n\n    def test_data_workloads_are_pinned_and_avoid_recursive_fs_group_churn(self) -> None:\n''',
              '''        self.assertNotIn("allow-app-data-access", policies)\n\n        api_documents = self._documents(\n            "platform/apps/weltgewebe/base/api-deployment.yaml"\n        )\n        api = next(\n            document\n            for document in api_documents\n            if document.get("kind") == "Deployment"\n            and document.get("metadata", {}).get("name") == "weltgewebe-api"\n        )\n        expected_api_selector = {"app.kubernetes.io/name": "weltgewebe-api"}\n        self.assertEqual(api["spec"]["selector"]["matchLabels"], expected_api_selector)\n        self.assertEqual(\n            {\n                "app.kubernetes.io/name": api["spec"]["template"]["metadata"][\n                    "labels"\n                ]["app.kubernetes.io/name"]\n            },\n            expected_api_selector,\n        )\n\n    def test_data_workloads_are_pinned_and_avoid_recursive_fs_group_churn(self) -> None:\n''',
          )
          extra_tests = '''    def test_pvc_wait_batches_queries_and_starts_bind_budget_after_visibility(self) -> None:\n        missing = json.dumps({"apiVersion": "v1", "kind": "List", "items": []})\n        pending = json.dumps(\n            {\n                "apiVersion": "v1",\n                "kind": "List",\n                "items": [\n                    {\n                        "metadata": {"name": "postgres-data"},\n                        "status": {"phase": "Pending"},\n                    },\n                    {\n                        "metadata": {"name": "nats-data"},\n                        "status": {"phase": "Pending"},\n                    },\n                ],\n            }\n        )\n        bound = json.dumps(\n            {\n                "apiVersion": "v1",\n                "kind": "List",\n                "items": [\n                    {\n                        "metadata": {"name": "postgres-data"},\n                        "status": {"phase": "Bound"},\n                    },\n                    {\n                        "metadata": {"name": "nats-data"},\n                        "status": {"phase": "Bound"},\n                    },\n                ],\n            }\n        )\n        with (\n            mock.patch.object(staging, "output", side_effect=[missing, pending, bound]) as output_mock,\n            mock.patch.object(staging.time, "monotonic", side_effect=[0.0, 100.0, 150.0]),\n            mock.patch.object(staging.time, "sleep"),\n        ):\n            staging.wait_pvcs_bound(\n                "kubectl",\n                visibility_timeout_seconds=200.0,\n                bind_timeout_seconds=10.0,\n            )\n        self.assertEqual(output_mock.call_count, 3)\n        for call in output_mock.call_args_list:\n            argv = call.args[0]\n            self.assertEqual(argv.count("postgres-data"), 1)\n            self.assertEqual(argv.count("nats-data"), 1)\n            self.assertIn("json", argv)\n            self.assertFalse(any(str(value).startswith("jsonpath=") for value in argv))\n\n    def test_pvc_wait_uses_flux_budget_before_claims_exist(self) -> None:\n        missing = json.dumps({"apiVersion": "v1", "kind": "List", "items": []})\n        with (\n            mock.patch.object(staging, "output", side_effect=[missing, missing]),\n            mock.patch.object(staging.time, "monotonic", side_effect=[0.0, 50.0, 101.0]),\n            mock.patch.object(staging.time, "sleep"),\n        ):\n            with self.assertRaisesRegex(\n                staging.StagingCellError, "Flux Kustomization budget"\n            ):\n                staging.wait_pvcs_bound(\n                    "kubectl",\n                    visibility_timeout_seconds=100.0,\n                    bind_timeout_seconds=1.0,\n                )\n\n'''
          replace_once(
              tests,
              '''    def test_wait_data_checks_pvcs_before_flux_health_without_rollout_duplication(self) -> None:\n''',
              extra_tests
              + '''    def test_wait_data_checks_pvcs_before_flux_health_without_rollout_duplication(self) -> None:\n''',
          )
          PY

      - name: Run focused regression
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check --no-cache-dir 'PyYAML==6.0.2'
          python3 -m compileall -q scripts/platform/staging_cell.py scripts/ci/tests/test_staging_cell_runtime_contract.py
          python3 -m unittest scripts.ci.tests.test_staging_cell_runtime_contract
          python3 scripts/platform/staging_cell.py self-check
          python3 scripts/platform/validate_platform.py --render
          git diff --check

      - name: Commit exact fix and remove one-shot writer
        shell: bash
        env:
          BRANCH: bureau/weltgewebe-os-v1-t084/5e0085fc46
        run: |
          set -euo pipefail
          git rm .github/workflows/pr1813-flux-pvc-wait-fix.yml
          git config user.name 'alexdermohr'
          git config user.email '216529510+alexdermohr@users.noreply.github.com'
          git add scripts/platform/staging_cell.py scripts/ci/tests/test_staging_cell_runtime_contract.py
          git diff --cached --check
          git commit -m 'fix(platform): harden Flux PVC readiness wait'
          git push origin "HEAD:${BRANCH}"
