name: Collective mutation contract

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  contract:
    if: github.head_ref == 'feat/collective-edit-delete-v1'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Run focused contract tests
        run: cargo test -p weltgewebe-api --test api_collective_mutations -- --nocapture
