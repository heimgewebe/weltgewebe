---
name: pr1658-foldin-stage

permissions:
  contents: read

"on":
  pull_request:
    paths:
      - ".github/workflows/pr1658-foldin-stage.yml"
      - "platform/cell-pilot/.pr1658-foldin-trigger"

concurrency:
  group: pr1658-foldin-stage-${{ github.event.pull_request.head.sha }}
  cancel-in-progress: false

jobs:
  stage-reviewed-foldin:
    if: >-
      github.event.pull_request.number == 1658 &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'feat/gewebezelle-two-operator-pilot-v1'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # tag: v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: true
      - name: Verify immutable staging binding
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_HEAD_REF}" = "feat/gewebezelle-two-operator-pilot-v1"
          test "$(git rev-parse HEAD^^)" = "dead513ee36f0dfc752fe0c81081d20e818e2839"
          test "$(git diff --name-only HEAD^^ HEAD^)" = ".github/workflows/pr1658-foldin-stage.yml"
          test "$(git diff --name-only HEAD^ HEAD)" = "platform/cell-pilot/.pr1658-foldin-trigger"
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # tag: v7.0.0
        with:
          python-version: "3.12"
      - name: Install fold-in dependencies
        run: python -m pip install --disable-pip-version-check 'PyYAML==6.0.3' pytest ruff
      - name: Materialize and apply reviewed fold-in
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PATCH_BLOB_SHA: b4b00a03161d10564ab5bca521e830ec3d074fad
          PATCH_SHA256: f8a7350fdfb0b6f3e9706067fee935be19949820544d2a7886a364fcdc1003be
        run: |
          set -euo pipefail
          curl --fail --silent --show-error \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/git/blobs/${PATCH_BLOB_SHA}" \
            | jq -r '.content' | tr -d '\n' | base64 --decode \
            | gzip --decompress > /tmp/pr1658-foldin.py
          test "$(sha256sum /tmp/pr1658-foldin.py | cut -d' ' -f1)" = "$PATCH_SHA256"
          python /tmp/pr1658-foldin.py
          chmod +x scripts/platform/validate_two_operator_pilot.py
          rm -f \
            .github/workflows/pr1658-foldin-stage.yml \
            platform/cell-pilot/.pr1658-foldin-trigger
      - name: Format and lint changed Python
        run: |
          python -m ruff check --fix \
            scripts/platform/validate_two_operator_pilot.py \
            scripts/ci/tests/test_two_operator_cell_pilot.py
          python -m ruff format \
            scripts/platform/validate_two_operator_pilot.py \
            scripts/ci/tests/test_two_operator_cell_pilot.py
          python -m ruff check \
            scripts/platform/validate_two_operator_pilot.py \
            scripts/ci/tests/test_two_operator_cell_pilot.py
          python -m py_compile \
            scripts/platform/validate_two_operator_pilot.py \
            scripts/ci/tests/test_two_operator_cell_pilot.py \
            scripts/ci/tests/test_kubernetes_platform_contract.py \
            scripts/ci/tests/test_kubernetes_ha_contract.py
      - name: Run focused Python contracts
        run: |
          python -m unittest scripts.ci.tests.test_two_operator_cell_pilot
          python -m unittest \
            scripts.ci.tests.test_kubernetes_platform_contract \
            scripts.ci.tests.test_kubernetes_ha_contract
      - name: Run platform and docs gates
        run: |
          make cell-pilot-check
          make platform-check
          make docs-guard
      - name: Run federation key regressions
        run: |
          cargo fmt --all -- --check
          cargo test -p weltgewebe-api federation::tests::
          cargo test -p weltgewebe-api --test two_operator_pilot_example_keys
      - name: Stage reviewed fold-in
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('.github/workflows/kubernetes-platform.yml')
          path.write_text(path.read_text().rstrip('\n') + '\n')
          PY
          git diff --check
          test -z "$(git status --short | grep -E '^\?\?' || true)"
          git config user.name 'heimgewebe-operator'
          git config user.email 'noreply@heimgewebe.invalid'
          git ls-tree -r HEAD \
            | awk '$2 == "blob" {print $3}' \
            | git cat-file --batch >/dev/null
          git add -A
          git commit -m 'fix(platform): close two-operator pilot trust gaps'
          commit_sha="$(git rev-parse HEAD)"
          staging_ref="operator/pr1658-ready-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          git push origin "HEAD:refs/heads/${staging_ref}"
          printf 'STAGED_COMMIT=%s\nSTAGING_REF=%s\n' "$commit_sha" "$staging_ref"
