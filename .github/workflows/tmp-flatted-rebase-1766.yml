name: tmp flatted rebase 1766

'on':
  push:
    branches:
      - renovate/flatted-3.x
    paths:
      - '.github/workflows/tmp-flatted-rebase-1766.yml'

permissions:
  contents: write

jobs:
  rebase:
    if: ${{ github.repository == 'heimgewebe/weltgewebe' && github.ref_name == 'renovate/flatted-3.x' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact PR branch
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Merge current main fail-closed
        run: |
          git fetch origin main
          git config user.name 'renovate-rebase-check'
          git config user.email 'noreply@users.noreply.github.com'
          git merge --no-commit --no-ff origin/main

          mapfile -t changed < <(git diff --name-only origin/main)
          printf 'effective diff vs current main: %s\n' "${changed[@]}"
          expected=(
            '.github/workflows/tmp-flatted-rebase-1766.yml'
            'apps/web/package.json'
            'apps/web/pnpm-lock.yaml'
          )
          test "${changed[*]}" = "${expected[*]}"
          grep -q '"flatted": "3\.4\.4"' apps/web/package.json
          grep -q '"eslint": "10\.8\.1"' apps/web/package.json
          git diff --check origin/main

      - name: Materialize merged tree as Git objects
        id: materialize
        env:
          REPO_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import subprocess
          import urllib.request
          from pathlib import Path

          repo = os.environ['GITHUB_REPOSITORY']
          head = os.environ['GITHUB_SHA']
          main = subprocess.check_output(
              ['git', 'rev-parse', 'origin/main'], text=True
          ).strip()
          paths = ['apps/web/package.json', 'apps/web/pnpm-lock.yaml']
          token = os.environ['REPO_TOKEN']
          api = f'https://api.github.com/repos/{repo}'

          def request(method, path, payload=None):
              data = None if payload is None else json.dumps(payload).encode()
              req = urllib.request.Request(
                  api + path,
                  data=data,
                  method=method,
                  headers={
                      'Authorization': f'Bearer {token}',
                      'Accept': 'application/vnd.github+json',
                      'X-GitHub-Api-Version': '2022-11-28',
                      'Content-Type': 'application/json',
                  },
              )
              with urllib.request.urlopen(req) as resp:
                  return json.load(resp)

          main_commit = request('GET', f'/git/commits/{main}')
          entries = []
          for path in paths:
              blob = request('POST', '/git/blobs', {
                  'content': Path(path).read_text(encoding='utf-8'),
                  'encoding': 'utf-8',
              })
              entries.append({
                  'path': path,
                  'mode': '100644',
                  'type': 'blob',
                  'sha': blob['sha'],
              })

          tree = request('POST', '/git/trees', {
              'base_tree': main_commit['tree']['sha'],
              'tree': entries,
          })
          commit = request('POST', '/git/commits', {
              'message': 'Merge current main into Renovate flatted update',
              'tree': tree['sha'],
              'parents': [head, main],
          })
          print(f"MAIN_SHA={main}")
          print(f"SERVER_COMMIT_SHA={commit['sha']}")
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as out:
              out.write(f"main_sha={main}\n")
              out.write(f"commit_sha={commit['sha']}\n")
          PY

      - name: Report object-only result
        run: |
          echo "Prepared ${{ steps.materialize.outputs.commit_sha }} against main ${{ steps.materialize.outputs.main_sha }}"
          echo "Branch ref intentionally not moved by this workflow."
