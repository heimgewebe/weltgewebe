---
name: Apply PR 1445 review follow-ups

"on":
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/apply-pr1445-review-followups.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: deploy/merge-to-live-v1
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version-file: ".python-version"
      - name: Apply and verify confirmed review findings
        shell: bash
        env:
          EXPECTED_BASE: 05a6f6be032b7cb53157d55881b57ebb52ed69ae
        run: |
          set -euo pipefail
          git merge-base --is-ancestor "$EXPECTED_BASE" HEAD
          mapfile -t staged_paths < <(git diff --name-only "$EXPECTED_BASE"...HEAD)
          expected_paths=(
            .github/workflows/apply-pr1445-review-followups.yml
            scripts/ci/apply_pr1445_review_followups.py
          )
          [[ "${staged_paths[*]}" == "${expected_paths[*]}" ]]

          python scripts/ci/apply_pr1445_review_followups.py
          python -m py_compile \
            scripts/ops/verify_public_release_commit.py \
            scripts/ops/validate_web_deploy_archive.py
          bash -n scripts/ops/deploy-exact-commit-vps.sh
          shellcheck -S style scripts/ops/deploy-exact-commit-vps.sh
          python -m unittest \
            scripts/ci/tests/test_verify_public_release_commit.py \
            scripts/ci/tests/test_validate_web_deploy_archive.py \
            scripts/ci/tests/test_production_reconciler_contract.py -v
          git diff --check

          mapfile -t changed_paths < <(
            git diff --name-only "$EXPECTED_BASE" -- \
              ':(exclude).github/workflows/apply-pr1445-review-followups.yml' \
              ':(exclude)scripts/ci/apply_pr1445_review_followups.py'
          )
          expected_changed=(
            docs/deploy/merge-to-live.md
            scripts/ci/tests/test_production_reconciler_contract.py
            scripts/ci/tests/test_validate_web_deploy_archive.py
            scripts/ci/tests/test_verify_public_release_commit.py
            scripts/ops/deploy-exact-commit-vps.sh
            scripts/ops/validate_web_deploy_archive.py
            scripts/ops/verify_public_release_commit.py
          )
          [[ "${changed_paths[*]}" == "${expected_changed[*]}" ]]

          git config user.name alexdermohr
          git config user.email 216529510+alexdermohr@users.noreply.github.com
          git add \
            docs/deploy/merge-to-live.md \
            scripts/ci/tests/test_production_reconciler_contract.py \
            scripts/ci/tests/test_validate_web_deploy_archive.py \
            scripts/ci/tests/test_verify_public_release_commit.py \
            scripts/ops/deploy-exact-commit-vps.sh \
            scripts/ops/validate_web_deploy_archive.py \
            scripts/ops/verify_public_release_commit.py
          git commit -m "fix: harden production readback and archive boundary"
          git push origin HEAD:deploy/merge-to-live-v1
