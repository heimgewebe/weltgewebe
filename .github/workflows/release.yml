---
name: release
"on":
  push:
    tags: ['v*.*.*']
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  publish:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # tag: v7.0.0
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
