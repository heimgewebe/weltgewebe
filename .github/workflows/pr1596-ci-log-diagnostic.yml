---
name: PR1596 CI Log Diagnostic
# activation revision: 2

permissions:
  actions: read
  contents: read

"on":
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/pr1596-ci-log-diagnostic.yml'

jobs:
  read-tail:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Read failed CI job tail
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api \
            -H 'Accept: application/vnd.github+json' \
            /repos/${GITHUB_REPOSITORY}/actions/jobs/90189514897/logs \
            > /tmp/pr1596-ci.log
          echo 'BEGIN_PR1596_CI_TAIL'
          tail -n 300 /tmp/pr1596-ci.log
          echo 'END_PR1596_CI_TAIL'
