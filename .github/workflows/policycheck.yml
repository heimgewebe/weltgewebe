---
name: policycheck
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

permissions:
  contents: read
"on":
  pull_request:
    paths:
      - "policies/**"
      - "tools/py/**"
      - ".github/workflows/policycheck.yml"
      - ".python-version"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # tag: v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # tag: v5
        with:
          python-version-file: '.python-version'
      - run: python -m pip install pyyaml
      - run: python tools/py/policycheck.py
