---
name: Review Evidence Gate

"on":
  pull_request_target:
    types: [opened, synchronize, reopened, edited, ready_for_review]
  issue_comment:
    types: [created, edited]
  workflow_dispatch:
    inputs:
      pr_number:
        description: Open pull request number to re-evaluate
        required: true
        type: number

permissions:
  contents: read
  issues: read
  pull-requests: read
  statuses: write

concurrency:
  group: review-evidence-${{ github.event.pull_request.number || github.event.issue.number || inputs.pr_number }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  review-evidence:
    name: Review evidence gate
    if: >-
      github.event_name != 'issue_comment' ||
      github.event.issue.pull_request != null
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Security boundary: pull_request_target and issue_comment have a privileged token.
      # Therefore only the trusted default branch is checked out and executed. The PR
      # commits are fetched as inert Git objects solely for diff generation.
      - name: Checkout trusted governance implementation
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # tag: v7.0.0
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve PR and evaluate exact review evidence
        id: evaluate
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_PATH: ${{ github.event_path }}
          DISPATCH_PR_NUMBER: ${{ inputs.pr_number }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -Eeuo pipefail
          output_dir="${RUNNER_TEMP}/weltgewebe-review-evidence"
          mkdir -p "${output_dir}"

          write_internal_failure() {
            local message="$1"
            python3 - "${output_dir}/evaluation.json" "${message}" <<'PY'
          import json
          import pathlib
          import sys

          path = pathlib.Path(sys.argv[1])
          payload = {
              "schema_version": 1,
              "kind": "weltgewebe-review-evaluation",
              "pass": False,
              "reasons": [sys.argv[2]],
          }
          path.write_text(json.dumps(payload, indent=2, sort_keys=True) + "\n", encoding="utf-8")
          PY
          }

          on_error() {
            local rc=$?
            write_internal_failure "trusted workflow preparation failed with exit code ${rc}"
            exit "${rc}"
          }
          trap on_error ERR

          case "${EVENT_NAME}" in
            pull_request_target)
              pr_number="$(jq -r '.pull_request.number' "${EVENT_PATH}")"
              ;;
            issue_comment)
              pr_number="$(jq -r '.issue.number' "${EVENT_PATH}")"
              ;;
            workflow_dispatch)
              pr_number="${DISPATCH_PR_NUMBER}"
              ;;
            *)
              write_internal_failure "unsupported event: ${EVENT_NAME}"
              exit 2
              ;;
          esac
          [[ "${pr_number}" =~ ^[1-9][0-9]*$ ]]

          gh api "repos/${REPOSITORY}/pulls/${pr_number}" > "${RUNNER_TEMP}/pr.json"
          state="$(jq -r '.state' "${RUNNER_TEMP}/pr.json")"
          [[ "${state}" == "open" ]]
          base_ref="$(jq -r '.base.ref' "${RUNNER_TEMP}/pr.json")"
          base_sha="$(jq -r '.base.sha' "${RUNNER_TEMP}/pr.json")"
          head_sha="$(jq -r '.head.sha' "${RUNNER_TEMP}/pr.json")"
          [[ "${base_sha}" =~ ^[0-9a-f]{40}$ ]]
          [[ "${head_sha}" =~ ^[0-9a-f]{40}$ ]]

          {
            echo "pr_number=${pr_number}"
            echo "base_sha=${base_sha}"
            echo "head_sha=${head_sha}"
            echo "output_dir=${output_dir}"
          } >> "${GITHUB_OUTPUT}"

          gh api --method POST "repos/${REPOSITORY}/statuses/${head_sha}" \
            -f state=pending \
            -f context='Review evidence gate' \
            -f description='Exact diff and review evidence are being verified.' \
            -f target_url="${GITHUB_SERVER_URL}/${REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
            >/dev/null

          git fetch --no-tags origin \
            "refs/pull/${pr_number}/head:refs/remotes/weltgewebe/pr-${pr_number}-head" \
            "${base_ref}:refs/remotes/origin/${base_ref}"
          fetched_head="$(git rev-parse "refs/remotes/weltgewebe/pr-${pr_number}-head")"
          fetched_base="$(git rev-parse "refs/remotes/origin/${base_ref}")"
          [[ "${fetched_head}" == "${head_sha}" ]]
          [[ "${fetched_base}" == "${base_sha}" ]]

          jq -r '.body // ""' "${RUNNER_TEMP}/pr.json" > "${RUNNER_TEMP}/pr-body.md"
          gh api --paginate --slurp \
            "repos/${REPOSITORY}/issues/${pr_number}/comments?per_page=100" \
            > "${RUNNER_TEMP}/comments.json"

          trap - ERR
          python3 scripts/quality/review_governance.py evaluate \
            --repo "${GITHUB_WORKSPACE}" \
            --output-dir "${output_dir}" \
            --base-sha "${base_sha}" \
            --head-sha "${head_sha}" \
            --pr-number "${pr_number}" \
            --pr-body-file "${RUNNER_TEMP}/pr-body.md" \
            --comments-file "${RUNNER_TEMP}/comments.json"

      - name: Upload downloadable diff and review bundle
        if: ${{ always() && steps.evaluate.outputs.pr_number != '' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # tag: v4
        with:
          name: wg-review-pr-${{ steps.evaluate.outputs.pr_number }}-${{ steps.evaluate.outputs.head_sha }}
          path: ${{ steps.evaluate.outputs.output_dir }}
          if-no-files-found: error
          retention-days: 30

      - name: Publish exact-head gate status
        if: ${{ always() && steps.evaluate.outputs.head_sha != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          HEAD_SHA: ${{ steps.evaluate.outputs.head_sha }}
          OUTPUT_DIR: ${{ steps.evaluate.outputs.output_dir }}
        shell: bash
        run: |
          set -euo pipefail
          evaluation="${OUTPUT_DIR}/evaluation.json"
          if [[ -f "${evaluation}" ]] && [[ "$(jq -r '.pass // false' "${evaluation}")" == "true" ]]; then
            state=success
            description='Exact diff and required independent reviews are verified.'
          else
            state=failure
            description='Review evidence is missing, stale, malformed or blocking.'
          fi
          gh api --method POST "repos/${REPOSITORY}/statuses/${HEAD_SHA}" \
            -f state="${state}" \
            -f context='Review evidence gate' \
            -f description="${description}" \
            -f target_url="${GITHUB_SERVER_URL}/${REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
            >/dev/null

      - name: Enforce review evidence result
        if: ${{ always() }}
        env:
          OUTPUT_DIR: ${{ steps.evaluate.outputs.output_dir }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "${OUTPUT_DIR:-}"
          test -f "${OUTPUT_DIR}/evaluation.json"
          test "$(jq -r '.pass // false' "${OUTPUT_DIR}/evaluation.json")" = "true"
