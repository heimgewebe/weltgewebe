---
name: compose-smoke
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  GIT_COMMIT_SHA: ${{ github.sha }}

permissions:
  contents: read
"on":
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "infra/compose/compose.core.yml"
      - "infra/caddy/Caddyfile"
      - ".github/workflows/compose-smoke.yml"
      - "apps/api/**"
      - "apps/web/**"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a # tag: v7.0.1
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # tag: v4
      - name: Compose up (detached)
        run: docker compose -f infra/compose/compose.core.yml --profile dev up -d --build
      - name: Wait for services (API & Web)
        run: |
          set -euo pipefail
          tries=60
          until curl -fsS http://localhost:8081/ >/dev/null; do
            ((tries--)) || (docker compose -f infra/compose/compose.core.yml --profile dev logs --no-color && exit 1)
            sleep 2
          done
          tries=60
          until curl -fsS http://localhost:8081/api/version >/dev/null \
            || curl -fsS http://localhost:8081/api/health/ready >/dev/null; do
            ((tries--)) || (docker compose -f infra/compose/compose.core.yml --profile dev logs --no-color && exit 1)
            sleep 2
          done
      - name: Show brief logs
        if: always()
        run: docker compose -f infra/compose/compose.core.yml --profile dev logs --no-color --tail=200
      - name: Compose down
        if: always()
        run: docker compose -f infra/compose/compose.core.yml --profile dev down -v
