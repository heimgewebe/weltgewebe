---
name: PR1596 DB Diagnostic

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

permissions:
  contents: write

"on":
  push:
    branches:
      - fix/node-delete-archive-history-v1
    paths:
      - '.github/workflows/pr1596-db-diagnostic.yml'

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CARGO_TERM_COLOR: never
      DATABASE_URL: postgres://welt:gewebe@localhost:5432/weltgewebe_ci_proof
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: welt
          POSTGRES_PASSWORD: gewebe
          POSTGRES_DB: weltgewebe_ci_proof
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # tag: v7.0.1
        with:
          fetch-depth: 0

      - name: Read Rust version
        id: rust-version
        shell: bash
        run: |
          set -euo pipefail
          SED_EXPR="s/^[[:space:]]*rust:[[:space:]]*['\"]?([^'\"#[:space:]]+)['\"]?[[:space:]]*(#.*)?$/\1/p"
          RUST_VERSION="$(sed -nE "${SED_EXPR}" toolchain.versions.yml | head -n1 | xargs)"
          test -n "${RUST_VERSION}"
          printf 'rust_version=%s\n' "${RUST_VERSION}" >> "${GITHUB_OUTPUT}"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # tag: v1
        with:
          toolchain: ${{ steps.rust-version.outputs.rust_version }}

      - name: Cache cargo
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # tag: v2

      - name: Run exact database proof and capture result
        shell: bash
        run: |
          set +e
          cargo test --locked --manifest-path apps/api/Cargo.toml \
            --test db_node_conversations node_conversation_vertical_slice \
            -- --include-ignored --exact --test-threads=1 --nocapture \
            > /tmp/pr1596-db-test.log 2>&1
          status=$?
          set -e
          mkdir -p docs/reports
          {
            printf 'PR1596 exact DB test exit status: %s\n' "${status}"
            printf 'Captured at commit: %s\n\n' "${GITHUB_SHA}"
            tail -n 240 /tmp/pr1596-db-test.log
          } > docs/reports/pr1596-db-test-diagnostic.txt

      - name: Commit bounded diagnostic
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/reports/pr1596-db-test-diagnostic.txt
          git diff --cached --check
          git commit -m "test(conversations): capture failing DB proof"
          git push origin HEAD:${GITHUB_REF_NAME}
