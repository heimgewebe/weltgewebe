---
name: wgx-guard

"on":
  push:
    paths: [".wgx/**", ".github/workflows/wgx-guard.yml", "pyproject.toml", "Cargo.toml"]
  pull_request:
    paths: [".wgx/**", ".github/workflows/wgx-guard.yml", "pyproject.toml", "Cargo.toml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  guard:
    # Pin the reusable workflow to reviewed bytes. Updating this SHA is a deliberate supply-chain change.
    uses: heimgewebe/wgx/.github/workflows/wgx-guard.yml@fd3c8d22c42fa15e2aa63a1f39706dcedbdf503a
