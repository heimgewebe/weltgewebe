---
name: T084 publish verified exact fix
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

permissions:
  contents: write

"on":
  push:
    branches:
      - "bureau/weltgewebe-os-v1-t084/5e0085fc46"

concurrency:
  group: t084-exact-head-closeout-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # tag: v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@8549b9f8f590ad24eab7482f36f6e1e24d34597b # tag: v7.0.0
        with:
          python-version-file: ".python-version"
      - name: Read uv version
        id: uv-version
        shell: bash
        run: |
          set -euo pipefail
          UV_VERSION=$(grep '^uv:' toolchain.versions.yml | cut -d '"' -f2)
          test -n "${UV_VERSION}"
          printf 'uv_version=%s\n' "${UV_VERSION}" >> "${GITHUB_OUTPUT}"
      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # tag: v8.3.2
        with:
          version: ${{ steps.uv-version.outputs.uv_version }}
      - name: Verify exact temporary state
        shell: bash
        run: |
          set -euo pipefail
          bootstrap="9e252e954b968ac1269b70f3eae13dd721656f0c"
          git merge-base --is-ancestor "${bootstrap}" HEAD
          actual=$(git diff --name-only "${bootstrap}" HEAD | sort)
          expected=$(printf '%s\n' \
            '.github/workflows/t084-closeout-fix.yml' \
            '.github/workflows/t084-publish-exact-fix.yml' | sort)
          test "${actual}" = "${expected}"
      - name: Extract and apply exact reviewed patch
        shell: bash
        run: |
          set -euo pipefail
          awk '
            /cat > \/tmp\/t084\.patch <<.PATCH./ { capture=1; next }
            capture && /^[[:space:]]*PATCH$/ { exit }
            capture { sub(/^          /, ""); print }
          ' .github/workflows/t084-closeout-fix.yml > /tmp/t084.patch
          test -s /tmp/t084.patch
          grep -q '^diff --git a/scripts/platform/staging_cell.py' /tmp/t084.patch
          grep -q '^diff --git a/scripts/ci/tests/test_staging_cell_runtime_contract.py' /tmp/t084.patch
          test "$(grep -c '^diff --git ' /tmp/t084.patch)" = "2"
          git apply --check /tmp/t084.patch
          git apply /tmp/t084.patch
      - name: Verify canonical focused contracts
        shell: bash
        run: |
          set -euo pipefail
          uv sync --project tools/py --locked
          uv run --project tools/py --locked python -m unittest scripts.ci.tests.test_staging_cell_runtime_contract
          uv run --project tools/py --locked python scripts/platform/staging_cell.py self-check
          uv run --project tools/py --locked python scripts/platform/validate_platform.py --render
          uv run --project tools/py --locked python -m scripts.agent.validate_repo_agent_contract
          git diff --check
      - name: Publish clean final tree
        shell: bash
        run: |
          set -euo pipefail
          bootstrap="9e252e954b968ac1269b70f3eae13dd721656f0c"
          rm .github/workflows/t084-closeout-fix.yml
          rm .github/workflows/t084-publish-exact-fix.yml
          actual=$(git diff --name-only "${bootstrap}" | sort)
          expected=$(printf '%s\n' \
            'scripts/ci/tests/test_staging_cell_runtime_contract.py' \
            'scripts/platform/staging_cell.py' | sort)
          test "${actual}" = "${expected}"
          git diff --check "${bootstrap}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix(platform): close T084 review edge cases"
          git push origin "HEAD:${GITHUB_REF_NAME}"
