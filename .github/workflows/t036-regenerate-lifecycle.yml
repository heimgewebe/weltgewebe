---
name: T036 branch-bound lifecycle regeneration

"on":
  pull_request:
    types: [synchronize, reopened]

permissions:
  contents: write

jobs:
  regenerate-exact-lifecycle-artifacts:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.head_ref == 'docs/t036-truth-lifecycle-20260824'
    runs-on: ubuntu-latest
    concurrency:
      group: t036-regenerate-lifecycle-${{ github.event.pull_request.number }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # tag: v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@8549b9f8f590ad24eab7482f36f6e1e24d34597b # tag: v7.0.0
        with:
          python-version-file: '.python-version'

      - name: Read uv version
        id: uv-version
        shell: bash
        run: |
          set -euo pipefail
          UV_VERSION=$(grep '^uv:' toolchain.versions.yml | cut -d '"' -f2)
          test -n "${UV_VERSION}"
          printf 'uv_version=%s\n' "${UV_VERSION}" >> "${GITHUB_OUTPUT}"

      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # tag: v8.3.2
        with:
          version: ${{ steps.uv-version.outputs.uv_version }}

      - name: Sync hash-locked tooling
        run: uv sync --project tools/py --locked

      - name: Regenerate via canonical generators
        shell: bash
        run: |
          set -euo pipefail
          uv run --project tools/py --locked python -m scripts.docmeta.generate_report_lifecycle
          uv run --project tools/py --locked python -m scripts.docmeta.generate_report_lifecycle_inventory
          uv run --project tools/py --locked python -m scripts.docmeta.validate_report_lifecycle --mode strict
          uv run --project tools/py --locked python -m scripts.docmeta.generate_report_lifecycle --check
          uv run --project tools/py --locked python -m scripts.docmeta.generate_report_lifecycle_inventory --check
          git diff --check -- docs/_generated/report-lifecycle.md docs/_generated/report-lifecycle-inventory.md

      - name: Verify generator-owned scope and self-remove
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          workflow = Path('.github/workflows/t036-regenerate-lifecycle.yml')
          if not workflow.is_file():
              raise SystemExit('temporary workflow missing before self-removal')
          workflow.unlink()
          PY
          mapfile -t changed < <(git diff --name-only | sort)
          printf '%s\n' "${changed[@]}"
          expected=(
            .github/workflows/t036-regenerate-lifecycle.yml
            docs/_generated/report-lifecycle-inventory.md
            docs/_generated/report-lifecycle.md
          )
          mapfile -t expected_sorted < <(printf '%s\n' "${expected[@]}" | sort)
          if [ "$(printf '%s\n' "${changed[@]}")" != "$(printf '%s\n' "${expected_sorted[@]}")" ]; then
            echo 'unexpected generator diff scope' >&2
            exit 1
          fi

      - name: Commit generated lifecycle artifacts
        shell: bash
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- docs/_generated/report-lifecycle.md docs/_generated/report-lifecycle-inventory.md .github/workflows/t036-regenerate-lifecycle.yml
          git diff --cached --check
          git commit -m "docs: regenerate report lifecycle truth"
          git push origin "HEAD:${HEAD_REF}"
