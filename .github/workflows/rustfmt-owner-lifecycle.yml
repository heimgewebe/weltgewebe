---
name: Format owner lifecycle proof

"on":
  pull_request:
    paths:
      - ".github/workflows/rustfmt-owner-lifecycle.yml"

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # tag: v7.0.1
        with:
          ref: feat/semantic-search-t012-production-v1
          fetch-depth: 0

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # tag: v1
        with:
          toolchain: 1.89.0
          components: rustfmt

      - name: Apply canonical Rust formatting
        run: |
          cargo fmt --all
          git diff --check
          rm .github/workflows/rustfmt-owner-lifecycle.yml

      - name: Commit formatted proof
        run: |
          git config user.name "weltgewebe-ci"
          git config user.email "weltgewebe-ci@users.noreply.github.com"
          git add apps/api/tests/db_semantic_search_owner_lifecycle.rs \
            .github/workflows/rustfmt-owner-lifecycle.yml
          git diff --cached --check
          git commit -m "style(search): format owner lifecycle proof"
          git push origin HEAD:feat/semantic-search-t012-production-v1
