---
name: Bootstrap Issue 1378 PR

"on":
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/_bootstrap-issue-1378.yml"
      - ".github/workflows/_bootstrap-issue-1378-pr.yml"
      - ".ops/issue-1378-bootstrap-failure.log"

permissions:
  contents: write

jobs:
  implement:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # tag: v7.0.0
        with:
          ref: feat/auth-persistent-browser-sessions-1378
          fetch-depth: 0

      - name: Extract and apply implementation
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          source = Path('.github/workflows/_bootstrap-issue-1378.yml').read_text().splitlines()
          start = next(i for i, line in enumerate(source) if "python3 <<'PY'" in line) + 1
          end = next(i for i in range(start, len(source)) if source[i].strip() == 'PY')
          script_lines = source[start:end]
          indent = min(len(line) - len(line.lstrip()) for line in script_lines if line.strip())
          script = '\n'.join(line[indent:] for line in script_lines) + '\n'
          Path('/tmp/apply_issue_1378.py').write_text(script)
          PY

          set +e
          python3 /tmp/apply_issue_1378.py > /tmp/issue-1378-apply.log 2>&1
          apply_rc=$?
          set -e
          if [ "${apply_rc}" -ne 0 ]; then
            mkdir -p .ops
            cp /tmp/issue-1378-apply.log .ops/issue-1378-bootstrap-failure.log
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add .ops/issue-1378-bootstrap-failure.log
            git commit -m "chore(auth): record issue 1378 bootstrap failure"
            git push origin HEAD:feat/auth-persistent-browser-sessions-1378
            cat /tmp/issue-1378-apply.log
            exit "${apply_rc}"
          fi
          rm -f .ops/issue-1378-bootstrap-failure.log
          rm -f .github/workflows/_bootstrap-issue-1378-pr.yml

      - name: Read Rust version
        id: rust-version
        shell: bash
        run: |
          set -euo pipefail
          SED_EXPR="s/^[[:space:]]*rust:[[:space:]]*['\"]?([^'\"#[:space:]]+)['\"]?[[:space:]]*(#.*)?$/\1/p"
          RUST_VERSION="$(sed -nE "${SED_EXPR}" toolchain.versions.yml | head -n1 | xargs)"
          test -n "${RUST_VERSION}"
          printf 'rust_version=%s\n' "${RUST_VERSION}" >> "${GITHUB_OUTPUT}"

      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: ${{ steps.rust-version.outputs.rust_version }}

      - uses: Swatinem/rust-cache@v2

      - name: Format and validate API
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --all --check
          cargo test --locked -p weltgewebe-api

      - uses: pnpm/action-setup@b0f76dfb45f55f8421693e4803ac7bb65143bd34 # tag: v6
        with:
          version: 9.11.0

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version-file: ".node-version"
          cache: pnpm
          cache-dependency-path: apps/web/pnpm-lock.yaml

      - name: Install web dependencies
        run: pnpm install --frozen-lockfile
        working-directory: apps/web

      - name: Check web and browser proof
        shell: bash
        working-directory: apps/web
        run: |
          set -euo pipefail
          pnpm check:ci
          pnpm exec playwright install --with-deps chromium
          pnpm test:proof:auth-session-browser

      - name: Commit implementation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "feat(auth): persist browser sessions across restarts (#1378)"
          git push origin HEAD:feat/auth-persistent-browser-sessions-1378
