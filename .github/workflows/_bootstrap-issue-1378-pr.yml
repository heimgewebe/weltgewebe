---
name: Bootstrap Issue 1378 PR

"on":
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/_bootstrap-issue-1378.yml"
      - ".github/workflows/_bootstrap-issue-1378-pr.yml"

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  implement:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # tag: v7.0.0
        with:
          ref: feat/auth-persistent-browser-sessions-1378
          fetch-depth: 1

      - name: Extract and apply implementation
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          source = Path('.github/workflows/_bootstrap-issue-1378.yml').read_text().splitlines()
          start = next(i for i, line in enumerate(source) if "python3 <<'PY'" in line) + 1
          end = next(i for i in range(start, len(source)) if source[i].strip() == 'PY')
          script_lines = source[start:end]
          first_code_line = next(line for line in script_lines if line.strip())
          indent = len(first_code_line) - len(first_code_line.lstrip())
          prefix = ' ' * indent
          script = '\n'.join(
              line[indent:] if line.startswith(prefix) else line
              for line in script_lines
          ) + '\n'
          Path('/tmp/apply_issue_1378.py').write_text(script)
          PY

          set +e
          python3 /tmp/apply_issue_1378.py > /tmp/issue-1378-apply.log 2>&1
          apply_rc=$?
          set -e
          if [ "${apply_rc}" -ne 0 ]; then
            {
              printf '## Bootstrap-Diagnose\n\n'
              printf 'Der Implementierungspatch wurde nicht committed. Konkreter Fehler:\n\n```text\n'
              tail -n 40 /tmp/issue-1378-apply.log
              printf '\n```\n'
            } > /tmp/issue-1378-comment.md
            gh pr comment 1386 --body-file /tmp/issue-1378-comment.md
            exit "${apply_rc}"
          fi

          python3 <<'PY'
          from pathlib import Path
          import re

          pattern = re.compile(
              r'(?m)^(?P<indent>[ \t]*)auth_trusted_proxies: None,\n'
              r'(?![ \t]*auth_session_ttl_seconds:)'
          )
          updated_files = []
          updated_initializers = 0
          tests_root = Path('apps/api/tests')
          for target in Path('apps/api').rglob('*.rs'):
              text = target.read_text()
              if 'AppConfig {' not in text:
                  continue
              try:
                  target.relative_to(tests_root)
                  constant_path = (
                      'weltgewebe_api::config::DEFAULT_AUTH_SESSION_TTL_SECONDS'
                  )
              except ValueError:
                  constant_path = (
                      'crate::config::DEFAULT_AUTH_SESSION_TTL_SECONDS'
                  )

              def add_ttl(match: re.Match[str]) -> str:
                  indent = match.group('indent')
                  return (
                      f'{indent}auth_trusted_proxies: None,\n'
                      f'{indent}auth_session_ttl_seconds: {constant_path},\n'
                  )

              revised, count = pattern.subn(add_ttl, text)
              if count:
                  target.write_text(revised)
                  updated_files.append(str(target))
                  updated_initializers += count

          if updated_initializers < 4:
              raise SystemExit(
                  'expected several explicit AppConfig fixtures, updated only '
                  f'{updated_initializers}: {updated_files}'
              )
          print(
              f'updated {updated_initializers} AppConfig initializers in '
              f'{len(updated_files)} files'
          )
          PY

          python3 <<'PY'
          from pathlib import Path
          import re

          def replace_once(path: Path, old: str, new: str) -> None:
              text = path.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(
                      f'{path}: expected one browser-proof anchor, found {count}'
                  )
              path.write_text(text.replace(old, new, 1))

          proof_path = Path(
              'apps/web/tests/proofs/persistent-browser-session.proof.ts'
          )
          replace_once(
              proof_path,
              'import { chromium, expect, test, type Page } from "@playwright/test";\n',
              'import { chromium, expect, test, type BrowserContext, type Page } '
              'from "@playwright/test";\n',
          )
          proof_text = proof_path.read_text()
          login_pattern = re.compile(
              r'async function loginWithDevAccount\(page: Page\): Promise<string> '
              r'\{.*?\n\}\n\n(?=test\()',
              re.DOTALL,
          )
          login_replacement = (
              'async function loginWithProofSession(\n'
              '  context: BrowserContext,\n'
              '  baseURL: string,\n'
              '): Promise<string> {\n'
              '  const response = await context.request.post(\n'
              '    `${baseURL}/api/auth/testing/passkeys/bootstrap-session`,\n'
              '  );\n'
              '  if (!response.ok()) {\n'
              '    throw new Error(\n'
              '      `proof session bootstrap failed: ${response.status()} '
              '${await response.text()}`,\n'
              '    );\n'
              '  }\n'
              '  const body = (await response.json()) as { account_id?: string };\n'
              '  if (!body.account_id) {\n'
              '    throw new Error("proof session bootstrap returned no account_id");\n'
              '  }\n'
              '  return body.account_id;\n'
              '}\n\n'
          )
          proof_text, count = login_pattern.subn(login_replacement, proof_text)
          if count != 1:
              raise SystemExit(
                  f'{proof_path}: expected one dev-login helper, found {count}'
              )
          proof_path.write_text(proof_text)
          replace_once(
              proof_path,
              '    const accountId = await loginWithDevAccount(firstPage);\n',
              '    const accountId = await loginWithProofSession('
              'persistentContext, baseURL);\n',
          )

          config_path = Path('apps/web/playwright.session.proof.config.ts')
          replace_once(
              config_path,
              '        AUTH_DEV_LOGIN: "1",\n',
              '',
          )
          PY
          rm -f .github/workflows/_bootstrap-issue-1378-pr.yml

      - name: Read Rust version
        id: rust-version
        shell: bash
        run: |
          set -euo pipefail
          SED_EXPR="s/^[[:space:]]*rust:[[:space:]]*['\"]?([^'\"#[:space:]]+)['\"]?[[:space:]]*(#.*)?$/\1/p"
          RUST_VERSION="$(sed -nE "${SED_EXPR}" toolchain.versions.yml | head -n1 | xargs)"
          test -n "${RUST_VERSION}"
          printf 'rust_version=%s\n' "${RUST_VERSION}" >> "${GITHUB_OUTPUT}"

      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: ${{ steps.rust-version.outputs.rust_version }}
          components: rustfmt

      - uses: Swatinem/rust-cache@v2

      - name: Format and validate API
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          CARGO_TERM_COLOR: never
        run: |
          set +e
          {
            cargo fmt --all
            cargo fmt --all --check
            cargo test --locked -p weltgewebe-api
          } > /tmp/issue-1378-rust.log 2>&1
          rust_rc=$?
          set -e
          if [ "${rust_rc}" -ne 0 ]; then
            python3 <<'PY'
          from pathlib import Path
          import re

          text = Path('/tmp/issue-1378-rust.log').read_text(errors='replace')
          text = re.sub(r'\x1b\[[0-9;]*[A-Za-z]', '', text)
          lines = text.splitlines()
          markers = re.compile(
              r'(^error(?:\[|:)|panicked at|\bFAILED\b|^failures:|could not compile|test result: FAILED)',
              re.IGNORECASE,
          )
          hits = [i for i, line in enumerate(lines) if markers.search(line)]
          if hits:
              chosen = []
              seen = set()
              for hit in hits[-6:]:
                  for idx in range(max(0, hit - 4), min(len(lines), hit + 14)):
                      if idx not in seen:
                          seen.add(idx)
                          chosen.append((idx, lines[idx]))
              chosen.sort()
              excerpt = '\n'.join(line for _, line in chosen[-100:])
          else:
              excerpt = '\n'.join(lines[-80:])
          body = (
              '## Rust-Diagnose\n\n'
              'Parser, Compiler oder Tests melden kompakt:\n\n```text\n'
              f'{excerpt}\n'
              '```\n'
          )
          Path('/tmp/issue-1378-rust-comment.md').write_text(body)
          PY
            gh api repos/heimgewebe/weltgewebe/issues/comments/4933719203 \
              --method PATCH \
              --raw-field body="$(cat /tmp/issue-1378-rust-comment.md)" >/dev/null
            exit "${rust_rc}"
          fi

      - uses: pnpm/action-setup@b0f76dfb45f55f8421693e4803ac7bb65143bd34 # tag: v6
        with:
          version: 9.11.0

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version-file: ".node-version"
          cache: pnpm
          cache-dependency-path: apps/web/pnpm-lock.yaml

      - name: Install web dependencies
        run: pnpm install --frozen-lockfile
        working-directory: apps/web

      - name: Check web and browser proof
        shell: bash
        working-directory: apps/web
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          run_stage() {
            local stage="$1"
            shift
            local slug
            slug="$(printf '%s' "${stage}" | tr '[:upper:] ' '[:lower:]-' | tr -cd 'a-z0-9-')"
            local log="/tmp/issue-1378-${slug}.log"
            set +e
            "$@" >"${log}" 2>&1
            local rc=$?
            set -e
            if [ "${rc}" -ne 0 ]; then
              {
                printf '## Browser-Proof-Diagnose\n\n'
                printf '**Fehlgeschlagene Stufe:** `%s`\n\n```text\n' "${stage}"
                tail -n 120 "${log}"
                printf '\n```\n'
              } > /tmp/issue-1378-browser-comment.md
              gh pr comment 1386 --body-file /tmp/issue-1378-browser-comment.md
              return "${rc}"
            fi
          }

          run_stage "web-check" pnpm check:ci
          run_stage "chromium-install" pnpm exec playwright install --with-deps chromium
          run_stage "browser-proof" pnpm test:proof:auth-session-browser

      - name: Commit implementation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "feat(auth): persist browser sessions across restarts (#1378)"
          git push origin HEAD:feat/auth-persistent-browser-sessions-1378
