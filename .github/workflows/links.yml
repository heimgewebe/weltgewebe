---
name: links
"on":
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:
  # Link checks on pull requests are handled in the central CI.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

permissions:
  contents: read
concurrency:
  group: links-${{ github.ref }}
  cancel-in-progress: true
jobs:
  lychee:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # tag: v7.0.0
      - uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # tag: v2
        with:
          args: >
            --accept 200,429
            --max-redirects 5
            --exclude-mail
            --no-progress
            --config .lychee.toml
            --exclude "https?://(localhost|127\.0\.0\.1|0\.0\.0\.0)(:\d+)?(/.*)?"
            "docs/**/*.md"
