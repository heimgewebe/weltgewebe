---
name: links
"on":
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:
  # Link checks on pull requests are handled in the central CI.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

permissions:
  contents: read
concurrency:
  group: links-${{ github.ref }}
  cancel-in-progress: true
jobs:
  lychee:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a # tag: v7.0.1
      - uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # tag: v2
        with:
          args: >
            --accept 200,429
            --max-redirects 5
            --include-mail=false
            --no-progress
            --config .lychee.toml
            --exclude "https?://(localhost|127\.0\.0\.1|0\.0\.0\.0)(:\d+)?(/.*)?"
            "docs/**/*.md"
