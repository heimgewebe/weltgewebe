---
name: Docs Guard

"on":
  push:
    branches:
      - main
      - dev
  pull_request:
    paths:
      - 'manifest/**'
      - 'architecture/**'
      - 'runtime/**'
      - 'runbooks/**'
      - 'contracts/agent/**'
      - 'scripts/agent/**'
      - 'tests/fixtures/agent/**'
      - 'scripts/contracts-agent-check.sh'
      - 'scripts/docmeta/**'
      - '.wgx/generated-artifacts.yml'
      - '.github/workflows/docs-guard.yml'
      - 'docs/_generated/system-map.md'
      - 'docs/_generated/report-lifecycle.md'
      - 'docs/_generated/report-lifecycle-inventory.md'
      - 'docs/doc-freshness-registry.yml'
      - 'docs/reports/**'
      - 'docs/process/report-lifecycle.md'
      - 'docs/process/report-lifecycle-contract-alignment.md'
      - 'docs/claims/**'
      - 'docs/_generated/claim-evidence-map.md'
      - 'docs/_generated/agent-readiness.md'
      - 'docs/tasks/index.json'
      - 'docs/tasks/board.md'
      - 'docs/tasks/schema.json'
      - 'docs/reports/optimierungsstatus.json'
      - 'docs/reference/agent-run-evidence-lite.md'
      - 'docs/security/agent-write-scope-baseline.md'
      - 'AGENTS.md'
      - 'repo.meta.yaml'
      - 'agent-policy.yaml'
      - 'audit/impl-registry.yaml'
      - '.python-version'

permissions:
  contents: read

concurrency:
  group: docs-guard-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  blocking-doc-validations:
    name: Blocking doc validations
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # tag: v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # tag: v7.0.0
        with:
          python-version-file: '.python-version'

      - name: Install Python test dependencies
        run: python -m pip install pytest==8.3.4 pyyaml==6.0.2

      - name: Report lifecycle global strict
        run: python3 -m scripts.docmeta.validate_report_lifecycle --mode strict

      - name: Optimierungsstatus Markdown JSON parity
        run: python3 -m scripts.docmeta.validate_optimierungsstatus_parity

      - name: Report lifecycle changed-only strict
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: >-
          python3 -m scripts.docmeta.validate_report_lifecycle
          --mode strict
          --changed-from "$BASE_SHA"
          --changed-to "$GITHUB_SHA"

      - name: Test generated artifact control
        run: python3 -m unittest scripts.docmeta.tests.test_validate_generated_artifacts -v

      - name: run-ci-validate
        run: make ci-validate


  generated-diagnostics:
    name: Generated diagnostics (non-blocking)
    runs-on: ubuntu-latest
    continue-on-error: true
    needs: blocking-doc-validations
    if: always()
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # tag: v7.0.1

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # tag: v7.0.0
        with:
          python-version-file: '.python-version'

      - name: generate-doc-index
        run: bash scripts/docmeta/generate-doc-index.sh

      - name: generate-backlinks
        run: python3 -m scripts.docmeta.generate_backlinks

      - name: generate-orphans
        run: python3 -m scripts.docmeta.generate_orphans

      - name: generate-system-map
        run: python3 -m scripts.docmeta.generate_system_map

      - name: Generate report lifecycle overview
        run: python3 -m scripts.docmeta.generate_report_lifecycle

      - name: generate-report-lifecycle-inventory
        run: python3 -m scripts.docmeta.generate_report_lifecycle_inventory

      # Policy: generated diagnostics are derived observability outputs; drift is reported, not blocking.
      - name: non-blocking generated drift report
        if: always()
        run: |
          set -euo pipefail
          if git diff --quiet -- docs/_generated/; then
            printf 'No generated drift detected after diagnostics generation.\n' > generated-drift-report.txt
          else
            {
              printf 'Generated drift detected (non-blocking).\n\n'
              git --no-pager diff -- docs/_generated/
            } > generated-drift-report.txt
          fi

      - name: annotate-generated-drift
        if: always()
        run: |
          set -euo pipefail
          if grep -q '^Generated drift detected' generated-drift-report.txt; then
            msg="docs/_generated drift detected. See generated-diagnostics artifact."
            echo "::warning title=Generated diagnostics drift::$msg"
          fi

      - name: upload-generated-diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # tag: v7.0.1
        with:
          name: generated-diagnostics
          path: |
            docs/_generated/doc-index.md
            docs/_generated/backlinks.md
            docs/_generated/orphans.md
            docs/_generated/system-map.md
            docs/_generated/report-lifecycle.md
            docs/_generated/report-lifecycle-inventory.md
            generated-drift-report.txt
          if-no-files-found: ignore
