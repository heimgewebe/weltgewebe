---
name: Semantic search owner lifecycle proof

"on":
  push:
    branches: [main]
    paths:
      - "apps/api/migrations/**semantic_search_owner_lifecycle**"
      - "apps/api/tests/db_semantic_search_owner_lifecycle.rs"
      - "apps/api/tests/db_semantic_search_projection_worker.rs"
      - "apps/api/src/search/**"
      - "scripts/ci/run-postgres-integration-proofs.sh"
      - ".github/workflows/semantic-search-owner-lifecycle-proof.yml"
  pull_request:
    paths:
      - "apps/api/migrations/**semantic_search_owner_lifecycle**"
      - "apps/api/tests/db_semantic_search_owner_lifecycle.rs"
      - "apps/api/tests/db_semantic_search_projection_worker.rs"
      - "apps/api/src/search/**"
      - "scripts/ci/run-postgres-integration-proofs.sh"
      - ".github/workflows/semantic-search-owner-lifecycle-proof.yml"
  workflow_dispatch: {}

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  owner-lifecycle:
    name: Private-owner PostgreSQL proof
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16@sha256:be01cf82fc7dbba824acf0a82e150b4b360f3ff93c6631d7844af431e841a95c
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/weltgewebe_owner_lifecycle_test
      PG_DIRECT_URL: postgres://postgres:postgres@127.0.0.1:5432/weltgewebe_owner_lifecycle_test
      POSTGRES_PROOF_PROVISION_NATS: "1"
      POSTGRES_PROOF_ALLOW_RESET: "1"
      POSTGRES_PROOF_TARGETS: db_semantic_search_owner_lifecycle
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a # tag: v7.0.1

      - name: Install PostgreSQL client
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends postgresql-client

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # tag: v1
        with:
          toolchain: 1.89.0

      - name: Cache cargo
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # tag: v2

      - name: Prove private-owner lifecycle
        run: |
          set -o pipefail
          scripts/ci/run-postgres-integration-proofs.sh 2>&1 | tee owner-lifecycle-proof.log

      - name: Upload proof log
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # tag: v7.0.1
        with:
          name: semantic-search-owner-lifecycle-${{ github.run_id }}
          path: owner-lifecycle-proof.log
          if-no-files-found: error
          retention-days: 7
