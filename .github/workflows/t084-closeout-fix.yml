---
name: T084 exact-head closeout fix
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

permissions:
  contents: write

"on":
  push:
    branches:
      - "bureau/weltgewebe-os-v1-t084/5e0085fc46"

concurrency:
  group: t084-exact-head-closeout-${{ github.ref }}
  cancel-in-progress: false

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # tag: v7.0.1
        with:
          fetch-depth: 20
          persist-credentials: true
      - uses: actions/setup-python@8549b9f8f590ad24eab7482f36f6e1e24d34597b # tag: v7.0.0
        with:
          python-version-file: ".python-version"
      - name: Read uv version
        id: uv-version
        shell: bash
        run: |
          set -euo pipefail
          UV_VERSION=$(grep '^uv:' toolchain.versions.yml | cut -d '"' -f2)
          test -n "${UV_VERSION}"
          printf 'uv_version=%s\n' "${UV_VERSION}" >> "${GITHUB_OUTPUT}"
      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # tag: v8.3.2
        with:
          version: ${{ steps.uv-version.outputs.uv_version }}
      - name: Verify exact bootstrap ancestry
        shell: bash
        run: |
          set -euo pipefail
          bootstrap="9e252e954b968ac1269b70f3eae13dd721656f0c"
          git cat-file -e "${bootstrap}^{commit}"
          git merge-base --is-ancestor "${bootstrap}" HEAD
          test "$(git diff --name-only "${bootstrap}" HEAD)" = ".github/workflows/t084-closeout-fix.yml"
      - name: Apply exact review patch
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/t084.patch <<'PATCH'
          diff --git a/scripts/platform/staging_cell.py b/scripts/platform/staging_cell.py
          index bf7be3b..52fbd43 100755
          --- a/scripts/platform/staging_cell.py
          +++ b/scripts/platform/staging_cell.py
          @@ -549,6 +549,8 @@ def load_or_create_secret_material(root: Path) -> tuple[dict[str, str], str]:
                       payload = json.loads(path.read_text(encoding="utf-8"))
                   except (json.JSONDecodeError, OSError, UnicodeError) as exc:
                       raise StagingCellError("staging secret source is unreadable or malformed") from exc
          +        if not isinstance(payload, dict):
          +            raise StagingCellError("staging secret source is malformed")
               else:
                   if retained_postgres_state_exists(root):
                       raise StagingCellError(
          @@ -943,17 +945,14 @@ def wait_pvcs_bound(
                       raise StagingCellError(f"staging PVC entered unexpected phase: {unexpected!r}")
                   now = time.monotonic()
                   all_visible = all(observed[pvc] != "missing" for pvc in pvcs)
          -        if all_visible:
          -            if bind_deadline is None:
          -                bind_deadline = min(
          -                    now + bind_timeout_seconds, visibility_deadline
          -                )
          -            if now >= bind_deadline:
          -                raise StagingCellError(
          -                    "staging PVCs did not bind within "
          -                    f"{bind_timeout_seconds:g}s after becoming visible: {observed!r}"
          -                )
          -        elif now >= visibility_deadline:
          +        if all_visible and bind_deadline is None:
          +            bind_deadline = min(now + bind_timeout_seconds, visibility_deadline)
          +        if bind_deadline is not None and now >= bind_deadline:
          +            raise StagingCellError(
          +                "staging PVCs did not bind within "
          +                f"{bind_timeout_seconds:g}s after becoming visible: {observed!r}"
          +            )
          +        if bind_deadline is None and now >= visibility_deadline:
                       raise StagingCellError(
                           "staging PVCs did not become visible within the Flux Kustomization "
                           f"budget of {visibility_timeout_seconds:g}s: {observed!r}"
          diff --git a/scripts/ci/tests/test_staging_cell_runtime_contract.py b/scripts/ci/tests/test_staging_cell_runtime_contract.py
