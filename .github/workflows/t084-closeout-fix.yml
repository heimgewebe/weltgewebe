          -            secret_path = root / "secrets/staging-runtime.json"
          -            secret_path.parent.mkdir(parents=True, exist_ok=True)
          -            secret_path.write_text('{"schema_version": 1,', encoding="utf-8")
          -            secret_path.chmod(0o600)
