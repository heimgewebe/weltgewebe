          --- a/scripts/ci/tests/test_staging_cell_runtime_contract.py
          +++ b/scripts/ci/tests/test_staging_cell_runtime_contract.py
          @@ -628,47 +628,59 @@ class StagingCellRuntimeContractTests(unittest.TestCase):
