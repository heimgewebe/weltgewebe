---
name: Patch owner worker lock order

"on":
  pull_request:
    types: [edited]

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # tag: v7.0.1
        with:
          ref: feat/semantic-search-t012-production-v1
          fetch-depth: 0

      - name: Align worker and account lock order
        run: |
          python3 scripts/ci/patch-owner-worker-lock-order.py
          cargo fmt --all
          git diff --check
          rm scripts/ci/patch-owner-worker-lock-order.py
          rm .github/workflows/patch-owner-worker-lock-order.yml

      - name: Commit exact lock-order correction
        run: |
          git config user.name "weltgewebe-ci"
          git config user.email "weltgewebe-ci@users.noreply.github.com"
          git add apps/api/src/search/worker.rs \
            apps/api/tests/db_semantic_search_owner_lifecycle.rs \
            scripts/ci/patch-owner-worker-lock-order.py \
            .github/workflows/patch-owner-worker-lock-order.yml
          git diff --cached --check
          git commit -m "fix(search): align owner lifecycle lock order"
          git push origin HEAD:feat/semantic-search-t012-production-v1
