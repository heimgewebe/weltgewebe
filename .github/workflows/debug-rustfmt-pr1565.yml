---
name: Debug rustfmt PR1565

"on":
  pull_request:
    branches: [main]
    paths:
      - "apps/api/tests/db_semantic_search_generation_binding.rs"
      - ".github/workflows/debug-rustfmt-pr1565.yml"
  workflow_dispatch: {}

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  formatted-file:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # tag: v7.0.1

      - name: Install rustfmt
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # tag: v1
        with:
          toolchain: 1.89.0
          components: rustfmt

      - name: Format exact file
        run: |
          cargo fmt --all
          mkdir -p artifact
          cp apps/api/tests/db_semantic_search_generation_binding.rs artifact/
          git diff -- apps/api/tests/db_semantic_search_generation_binding.rs > artifact/rustfmt.diff

      - name: Upload formatted file
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # tag: v7.0.1
        with:
          name: pr1565-generation-proof-rustfmt
          path: artifact/**
          if-no-files-found: error
          retention-days: 1
