---
name: Debug rustfmt PR1565

"on":
  push:
    branches:
      - feat/semantic-search-t012-production-v1
    paths:
      - "apps/api/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "toolchain.versions.yml"
      - ".github/workflows/debug-rustfmt-pr1565.yml"
  pull_request:
    branches: [main]
    paths:
      - "apps/api/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "toolchain.versions.yml"
      - ".github/workflows/debug-rustfmt-pr1565.yml"
  workflow_dispatch: {}

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  formatted-files:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # tag: v7.0.1

      - name: Read Rust version
        id: rust-version
        shell: bash
        run: |
          set -euo pipefail
          SED_EXPR="s/^[[:space:]]*rust:[[:space:]]*['\"]?([^'\"#[:space:]]+)['\"]?[[:space:]]*(#.*)?$/\1/p"
          RUST_VERSION="$(sed -nE "${SED_EXPR}" toolchain.versions.yml | head -n1 | xargs)"
          test -n "${RUST_VERSION}"
          printf 'rust_version=%s\n' "${RUST_VERSION}" >> "${GITHUB_OUTPUT}"

      - name: Install rustfmt
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # tag: v1
        with:
          toolchain: ${{ steps.rust-version.outputs.rust_version }}
          components: rustfmt

      - name: Format and collect exact files
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --all
          mkdir -p artifact/apps/api/src/bin artifact/apps/api/tests/support
          cp apps/api/src/bin/search-backfill.rs artifact/apps/api/src/bin/search-backfill.rs
          cp apps/api/tests/support/postgres_proof.rs artifact/apps/api/tests/support/postgres_proof.rs
          git diff --check
          git diff -- apps/api/src/bin/search-backfill.rs apps/api/tests/support/postgres_proof.rs > artifact/rustfmt.diff

      - name: Upload formatted files
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # tag: v7.0.1
        with:
          name: pr1565-rustfmt-files
          path: artifact/**
          if-no-files-found: error
          retention-days: 1
