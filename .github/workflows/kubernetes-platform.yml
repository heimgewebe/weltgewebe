---
name: kubernetes-platform
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

permissions:
  contents: read

"on":
  pull_request:
    paths:
      - ".github/workflows/kubernetes-platform.yml"
      - ".github/workflows/kubernetes-platform-proof.yml"
      - ".dockerignore"
      - "Cargo.toml"
      - "Cargo.lock"
      - "toolchain.versions.yml"
      - "apps/api/**"
      - "apps/web/**"
      - "configs/**"
      - "scripts/dev/**"
      - "scripts/ops/**"
      - "policies/**"
      - "infra/compose/compose.prod.yml"
      - "platform/**"
      - "scripts/platform/**"
      - "scripts/security/**"
      - "scripts/ci/tests/test_kubernetes_platform_contract.py"
      - "scripts/ci/tests/test_trivy_rendered_manifests.py"
      - "scripts/ci/tests/test_kubernetes_ha_contract.py"
      - "repo.meta.yaml"

concurrency:
  group: kubernetes-platform-pr-${{ github.event.pull_request.head.sha }}
  cancel-in-progress: false

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # tag: v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # tag: v7.0.0
        with:
          python-version: "3.10"
      - name: Install validator dependency
        run: python -m pip install --disable-pip-version-check 'PyYAML==6.0.3'
      - name: Compile platform tools
        run: >-
          python -m py_compile
          scripts/platform/bootstrap_tools.py
          scripts/platform/proof_identity.py
          scripts/platform/oci_proof_mirror.py
          scripts/platform/validate_platform.py
          scripts/platform/kind_reference.py
          scripts/platform/ha_reference.py
          scripts/security/trivy_rendered_manifests.py
      - name: Run platform contract tests
        run: >-
          python -m unittest
          scripts.ci.tests.test_kubernetes_platform_contract
          scripts.ci.tests.test_kubernetes_ha_contract
          scripts.ci.tests.test_trivy_rendered_manifests
      - name: Render and validate all platform targets
        run: python scripts/platform/validate_platform.py --render

  trivy-rendered-security:
    needs: contract
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # tag: v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # tag: v7.0.0
        with:
          python-version: "3.10"
      - name: Install validator dependency
        run: python -m pip install --disable-pip-version-check 'PyYAML==6.0.3'
      - name: Scan canonical rendered manifests and generate CycloneDX SBOM
        run: python scripts/security/trivy_rendered_manifests.py
      - name: Upload Trivy evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # tag: v7.0.1
        with:
          name: trivy-rendered-security-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/security/trivy/*.json
          if-no-files-found: error
          retention-days: 14

  pr1658-bound-hardening:
    if: >-
      github.event.pull_request.number == 1658 &&
      github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # tag: v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: true
      - name: Verify immutable operator binding
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_HEAD_REF}" = "feat/gewebezelle-two-operator-pilot-v1"
          test "$(git rev-parse HEAD^)" = "88e624793b7a8b2af524330c540be3c20c7f55dd"
          test "$(git diff --name-only HEAD^ HEAD)" = ".github/workflows/kubernetes-platform.yml"
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # tag: v7.0.0
        with:
          python-version: "3.12"
      - name: Install operator validation dependencies
        run: python -m pip install --disable-pip-version-check 'PyYAML==6.0.3' pytest ruff
      - name: Restore original pilot assertions on current main test
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("scripts/ci/tests/test_kubernetes_platform_contract.py")
          source = path.read_text(encoding="utf-8")
          marker = '        self.assertIn("completed two-operator WAN pilot", contract["nonclaims"])\n'
          if marker not in source:
              anchor = '''        self.assertIn(
              "automatic peer discovery or trust", contract["nonclaims"]
          )
          '''
              insertion = anchor + '''        self.assertIn("completed two-operator WAN pilot", contract["nonclaims"])
          self.assertEqual(
              contract["artifacts"]["two_operator_pilot_contract"],
              "platform/cell-pilot/two-operator-pilot.contract.json",
          )
          self.assertEqual(
              contract["artifacts"]["two_operator_pilot_example"],
              "platform/cell-pilot/two-operator-pilot.example.invalid.json",
          )
          self.assertEqual(
              contract["artifacts"]["two_operator_pilot_validator"],
              "scripts/platform/validate_two_operator_pilot.py",
          )
          '''
              if source.count(anchor) != 1:
                  raise SystemExit("manual profile assertion anchor drift")
              source = source.replace(anchor, insertion, 1)
          runbook_marker = '            (ROOT / "docs/runbooks/gewebezelle-two-operator-pilot-v1.md").is_file()\n'
          if runbook_marker not in source:
              anchor = '''        self.assertTrue(
              (ROOT / "docs/runbooks/gewebezelle-manual-pilot.md").is_file()
          )
          '''
              insertion = anchor + '''        self.assertTrue(
              (ROOT / "docs/runbooks/gewebezelle-two-operator-pilot-v1.md").is_file()
          )
          self.assertTrue(
              (ROOT / "docs/proofs/gewebezelle-two-operator-pilot-contract-v1.md").is_file()
          )
          '''
              if source.count(anchor) != 1:
                  raise SystemExit("manual runbook assertion anchor drift")
              source = source.replace(anchor, insertion, 1)
          path.write_text(source, encoding="utf-8")
          PY
      - name: Materialize and apply head-bound hardening
        shell: bash
        env:
          PATCH_BLOB_SHAS: >-
            3bc6dbc5db86f4831eef387a2d979669bc36d802
            93b0e0fc3b60c99124547fc8deb8b53a745bef7a
            6f3ffa9ba085a1142254885125d20ccc5fa0f8d1
            8aeeac2905bf97cb51377ad074b7dbaf59b8d5ae
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          : > /tmp/pr1658-patch.b64
          for sha in $PATCH_BLOB_SHAS; do
            curl --fail --silent --show-error \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/git/blobs/${sha}" \
              | jq -r '.content' | tr -d '\n' | base64 --decode \
              >> /tmp/pr1658-patch.b64
          done
          base64 --decode /tmp/pr1658-patch.b64 | gzip --decompress \
            > /tmp/pr1658_hardening.py
          python /tmp/pr1658_hardening.py
      - name: Restore canonical workflow and regenerate derived docs
        run: |
          git checkout 19abd7a9fe773c74991afd3820c2d5000a9c6efc -- \
            .github/workflows/kubernetes-platform.yml
          python -m ruff check --fix --exit-zero \
            scripts/platform/validate_two_operator_pilot.py \
            scripts/platform/validate_platform.py \
            scripts/ci/tests/test_two_operator_cell_pilot.py \
            scripts/ci/tests/test_kubernetes_platform_contract.py
          cargo fmt --all
          python -m ruff format \
            scripts/platform/validate_two_operator_pilot.py \
            scripts/ci/tests/test_two_operator_cell_pilot.py
          make generate
      - name: Validate Python, platform and documentation contracts
        run: |
          python -m ruff check \
            scripts/platform/validate_two_operator_pilot.py \
            scripts/platform/validate_platform.py \
            scripts/ci/tests/test_two_operator_cell_pilot.py \
            scripts/ci/tests/test_kubernetes_platform_contract.py
          python -m py_compile \
            scripts/platform/validate_two_operator_pilot.py \
            scripts/platform/validate_platform.py \
            scripts/ci/tests/test_two_operator_cell_pilot.py \
            scripts/ci/tests/test_kubernetes_platform_contract.py
          python -m unittest \
            scripts.ci.tests.test_two_operator_cell_pilot \
            scripts.ci.tests.test_kubernetes_platform_contract
          make platform-check
          make docs-guard
      - name: Validate federation runtime
        run: |
          cargo fmt --all -- --check
          cargo test -p weltgewebe-api federation::tests::
          cargo test -p weltgewebe-api \
            federation::tests::weak_public_keys_cannot_validate_universal_signatures \
            -- --exact
      - name: Commit hardening
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          test -z "$(git status --short | grep -E '^\?\?' || true)"
          git config user.name 'heimgewebe-operator'
          git config user.email 'noreply@heimgewebe.invalid'
          git add -A
          git commit -m 'fix(platform): harden two-operator pilot trust boundary'
          git push origin HEAD:feat/gewebezelle-two-operator-pilot-v1
