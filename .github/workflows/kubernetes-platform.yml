---
name: kubernetes-platform
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

permissions:
  contents: read

"on":
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/kubernetes-platform.yml"
      - "apps/api/Dockerfile"
      - "apps/api/entrypoint.sh"
      - "apps/web/**"
      - "infra/compose/compose.prod.yml"
      - "platform/**"
      - "scripts/platform/**"
      - "scripts/ci/tests/test_kubernetes_platform_contract.py"
      - "scripts/ci/tests/test_kubernetes_ha_contract.py"
      - "repo.meta.yaml"
  push:
    branches: [main]
    paths:
      - ".github/workflows/kubernetes-platform.yml"
      - "apps/api/Dockerfile"
      - "apps/api/entrypoint.sh"
      - "apps/web/**"
      - "infra/compose/compose.prod.yml"
      - "platform/**"
      - "scripts/platform/**"
      - "scripts/ci/tests/test_kubernetes_platform_contract.py"
      - "scripts/ci/tests/test_kubernetes_ha_contract.py"
      - "repo.meta.yaml"

concurrency:
  group: kubernetes-platform-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # tag: v7.0.0
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # tag: v7.0.0
        with:
          python-version: "3.10"
      - name: Install validator dependency
        run: python -m pip install --disable-pip-version-check 'PyYAML==6.0.3'
      - name: Compile platform tools
        run: >-
          python -m py_compile
          scripts/platform/bootstrap_tools.py
          scripts/platform/validate_platform.py
          scripts/platform/kind_reference.py
          scripts/platform/ha_reference.py
      - name: Run platform contract tests
        run: >-
          python -m unittest
          scripts.ci.tests.test_kubernetes_platform_contract
          scripts.ci.tests.test_kubernetes_ha_contract
      - name: Render and validate all platform targets
        run: python scripts/platform/validate_platform.py --render

  kind-gitops-proof:
    needs: contract
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CLUSTER_NAME: wg-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # tag: v7.0.0
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # tag: v7.0.0
        with:
          python-version: "3.10"
      - name: Install proof dependency
        run: python -m pip install --disable-pip-version-check 'PyYAML==6.0.3'
      - name: Run pull-request direct reference proof
        if: github.event_name == 'pull_request'
        run: >-
          python scripts/platform/kind_reference.py proof
          --cluster "$CLUSTER_NAME"
          --mode direct
      - name: Run commit-bound GitOps reference proof
        if: github.event_name != 'pull_request'
        run: >-
          python scripts/platform/kind_reference.py proof
          --cluster "$CLUSTER_NAME"
          --mode gitops
          --source-commit "$GITHUB_SHA"
      - name: Collect failure diagnostics
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # tag: v4
        with:
          name: kubernetes-platform-failure-${{ github.run_id }}-${{ github.run_attempt }}
          path: .cache/weltgewebe-platform/failures/
          if-no-files-found: ignore
          retention-days: 7

  kind-ha-recovery-proof:
    needs: contract
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      CLUSTER_NAME: wg-ha-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # tag: v7.0.0
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # tag: v7.0.0
        with:
          python-version: "3.10"
      - name: Install proof dependency
        run: python -m pip install --disable-pip-version-check 'PyYAML==6.0.3'
      - name: Run HA failover and blank-cluster recovery proof
        run: >-
          python scripts/platform/ha_reference.py proof
          --cluster "$CLUSTER_NAME"
      - name: Upload HA recovery receipt
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # tag: v4
        with:
          name: kubernetes-ha-recovery-${{ github.run_id }}-${{ github.run_attempt }}
          path: .cache/weltgewebe-platform/receipts/*-ha-recovery.json
          if-no-files-found: ignore
          retention-days: 14
      - name: Collect HA failure diagnostics
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # tag: v4
        with:
          name: kubernetes-ha-failure-${{ github.run_id }}-${{ github.run_attempt }}
          path: .cache/weltgewebe-platform/failures/
          if-no-files-found: ignore
          retention-days: 14
      - name: Reconcile owned HA proof resources
        if: always()
        run: >-
          python scripts/platform/ha_reference.py down
          --cluster "$CLUSTER_NAME"
          --commit "$(git rev-parse HEAD)"
