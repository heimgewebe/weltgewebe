---
name: kubernetes-platform
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

permissions:
  contents: read

"on":
  pull_request:
    paths:
      - ".github/workflows/kubernetes-platform.yml"
      - ".github/workflows/kubernetes-platform-proof.yml"
      - ".dockerignore"
      - "Cargo.toml"
      - "Cargo.lock"
      - "toolchain.versions.yml"
      - "apps/api/**"
      - "apps/web/**"
      - "configs/**"
      - "scripts/dev/**"
      - "scripts/ops/**"
      - "policies/**"
      - "infra/compose/compose.prod.yml"
      - "platform/**"
      - "scripts/platform/**"
      - "scripts/security/**"
      - "scripts/ci/tests/test_kubernetes_platform_contract.py"
      - "scripts/ci/tests/test_two_operator_cell_pilot.py"
      - "scripts/ci/tests/test_trivy_rendered_manifests.py"
      - "scripts/ci/tests/test_kubernetes_ha_contract.py"
      - "docs/runbooks/gewebezelle-manual-pilot.md"
      - "docs/runbooks/gewebezelle-two-operator-pilot-v1.md"
      - "docs/proofs/gewebezelle-two-operator-pilot-contract-v1.md"
      - "docs/tasks/board.md"
      - "Makefile"
      - "repo.meta.yaml"

concurrency:
  group: kubernetes-platform-pr-${{ github.event.pull_request.head.sha }}
  cancel-in-progress: false

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # tag: v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # tag: v7.0.0
        with:
          python-version: "3.10"
      - name: Install validator dependency
        run: python -m pip install --disable-pip-version-check 'PyYAML==6.0.3'
      - name: Compile platform tools
        run: >-
          python -m py_compile
          scripts/platform/bootstrap_tools.py
          scripts/platform/proof_identity.py
          scripts/platform/oci_proof_mirror.py
          scripts/platform/validate_platform.py
          scripts/platform/validate_two_operator_pilot.py
          scripts/platform/kind_reference.py
          scripts/platform/ha_reference.py
          scripts/security/trivy_rendered_manifests.py
      - name: Run platform contract tests
        run: >-
          python -m unittest
          scripts.ci.tests.test_kubernetes_platform_contract
          scripts.ci.tests.test_two_operator_cell_pilot
          scripts.ci.tests.test_kubernetes_ha_contract
          scripts.ci.tests.test_trivy_rendered_manifests
      - name: Render and validate all platform targets
        run: python scripts/platform/validate_platform.py --render

  trivy-rendered-security:
    needs: contract
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # tag: v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # tag: v7.0.0
        with:
          python-version: "3.10"
      - name: Install validator dependency
        run: python -m pip install --disable-pip-version-check 'PyYAML==6.0.3'
      - name: Scan canonical rendered manifests and generate CycloneDX SBOM
        run: python scripts/security/trivy_rendered_manifests.py
      - name: Upload Trivy evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # tag: v7.0.1
        with:
          name: trivy-rendered-security-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/security/trivy/*.json
          if-no-files-found: error
          retention-days: 14

  pr1658-bound-hardening:
    if: github.event.pull_request.number == 1658
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # tag: v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: true
      - name: Verify immutable operator binding
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_HEAD_REF}" = "feat/gewebezelle-two-operator-pilot-v1"
          test "$(git rev-parse HEAD^)" = "f58d0dd68e2821978efd00bad047f35a99241ea4"
          test "$(git diff --name-only HEAD^ HEAD)" = ".github/workflows/kubernetes-platform.yml"
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # tag: v7.0.0
        with:
          python-version: "3.12"
      - name: Install operator validation dependencies
        run: python -m pip install --disable-pip-version-check 'PyYAML==6.0.2' pytest ruff
      - name: Materialize and apply head-bound hardening
        shell: bash
        env:
          PATCH_BLOB_SHAS: >-
            3bc6dbc5db86f4831eef387a2d979669bc36d802
            93b0e0fc3b60c99124547fc8deb8b53a745bef7a
            6f3ffa9ba085a1142254885125d20ccc5fa0f8d1
            8aeeac2905bf97cb51377ad074b7dbaf59b8d5ae
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          : > /tmp/pr1658-patch.b64
          for sha in $PATCH_BLOB_SHAS; do
            curl --fail --silent --show-error \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/git/blobs/${sha}" \
              | jq -r '.content' | tr -d '\n' | base64 --decode \
              >> /tmp/pr1658-patch.b64
          done
          base64 --decode /tmp/pr1658-patch.b64 | gzip --decompress \
            > /tmp/pr1658_hardening.py
          python /tmp/pr1658_hardening.py
      - name: Apply safe source fixes and formatting
        run: |
          python -m ruff check --fix --exit-zero \
            scripts/platform/validate_two_operator_pilot.py \
            scripts/platform/validate_platform.py \
            scripts/ci/tests/test_two_operator_cell_pilot.py \
            scripts/ci/tests/test_kubernetes_platform_contract.py
          cargo fmt --all
          python -m ruff format \
            scripts/platform/validate_two_operator_pilot.py \
            scripts/ci/tests/test_two_operator_cell_pilot.py
      - name: Ruff
        id: ruff
        continue-on-error: true
        run: |
          set -o pipefail
          python -m ruff check \
            scripts/platform/validate_two_operator_pilot.py \
            scripts/platform/validate_platform.py \
            scripts/ci/tests/test_two_operator_cell_pilot.py \
            scripts/ci/tests/test_kubernetes_platform_contract.py \
            2>&1 | tee /tmp/pr1658-ruff.log
      - name: Python compile
        id: pycompile
        continue-on-error: true
        run: |
          set -o pipefail
          python -m py_compile \
            scripts/platform/validate_two_operator_pilot.py \
            scripts/platform/validate_platform.py \
            scripts/ci/tests/test_two_operator_cell_pilot.py \
            scripts/ci/tests/test_kubernetes_platform_contract.py \
            2>&1 | tee /tmp/pr1658-pycompile.log
      - name: Pilot unit tests
        id: pilot_tests
        continue-on-error: true
        run: |
          set -o pipefail
          python -m unittest scripts.ci.tests.test_two_operator_cell_pilot \
            2>&1 | tee /tmp/pr1658-pilot-tests.log
      - name: Kubernetes platform contract tests
        id: platform_tests
        continue-on-error: true
        run: |
          set -o pipefail
          python -m unittest scripts.ci.tests.test_kubernetes_platform_contract \
            2>&1 | tee /tmp/pr1658-platform-tests.log
      - name: Platform check
        id: platform_check
        continue-on-error: true
        run: |
          set -o pipefail
          make platform-check 2>&1 | tee /tmp/pr1658-platform-check.log
      - name: Docs guard
        id: docs_guard
        continue-on-error: true
        run: |
          set -o pipefail
          make docs-guard 2>&1 | tee /tmp/pr1658-docs-guard.log
      - name: Cargo formatting
        id: cargo_fmt
        continue-on-error: true
        run: |
          set -o pipefail
          cargo fmt --all -- --check 2>&1 | tee /tmp/pr1658-cargo-fmt.log
      - name: Federation module tests
        id: federation_tests
        continue-on-error: true
        run: |
          set -o pipefail
          cargo test -p weltgewebe-api federation::tests:: \
            2>&1 | tee /tmp/pr1658-federation-tests.log
      - name: Exact weak-key regression
        id: weak_key_test
        continue-on-error: true
        run: |
          set -o pipefail
          cargo test -p weltgewebe-api \
            federation::tests::weak_public_keys_cannot_validate_universal_signatures \
            -- --exact 2>&1 | tee /tmp/pr1658-weak-key-test.log
      - name: Upload gate diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # tag: v7.0.1
        with:
          name: pr1658-gates-${{ github.run_id }}-${{ github.run_attempt }}
          path: /tmp/pr1658-*.log
          if-no-files-found: error
          retention-days: 2
      - name: Require all validation gates
        env:
          RUFF: ${{ steps.ruff.outcome }}
          PYCOMPILE: ${{ steps.pycompile.outcome }}
          PILOT_TESTS: ${{ steps.pilot_tests.outcome }}
          PLATFORM_TESTS: ${{ steps.platform_tests.outcome }}
          PLATFORM_CHECK: ${{ steps.platform_check.outcome }}
          DOCS_GUARD: ${{ steps.docs_guard.outcome }}
          CARGO_FMT: ${{ steps.cargo_fmt.outcome }}
          FEDERATION_TESTS: ${{ steps.federation_tests.outcome }}
          WEAK_KEY_TEST: ${{ steps.weak_key_test.outcome }}
        run: |
          set -euo pipefail
          for result in \
            "$RUFF" "$PYCOMPILE" "$PILOT_TESTS" "$PLATFORM_TESTS" \
            "$PLATFORM_CHECK" "$DOCS_GUARD" "$CARGO_FMT" \
            "$FEDERATION_TESTS" "$WEAK_KEY_TEST"; do
            test "$result" = success
          done
      - name: Commit hardening and restore canonical workflow
        shell: bash
        run: |
          set -euo pipefail
          git checkout dd8349fc5bf93ab1db132c783651fa3edd2804a0 -- \
            .github/workflows/kubernetes-platform.yml
          git diff --check
          test -z "$(git status --short | grep -E '^\?\?' || true)"
          git config user.name 'heimgewebe-operator'
          git config user.email 'noreply@heimgewebe.invalid'
          git add -A
          git commit -m 'fix(platform): harden two-operator pilot trust boundary'
          git push origin HEAD:feat/gewebezelle-two-operator-pilot-v1
