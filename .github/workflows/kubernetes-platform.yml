---
name: kubernetes-platform
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

permissions:
  contents: read

"on":
  pull_request:
    paths:
      - ".github/workflows/kubernetes-platform.yml"
      - ".github/workflows/kubernetes-platform-proof.yml"
      - ".dockerignore"
      - "Cargo.toml"
      - "Cargo.lock"
      - "toolchain.versions.yml"
      - "apps/api/**"
      - "apps/web/**"
      - "configs/**"
      - "scripts/dev/**"
      - "scripts/ops/**"
      - "policies/**"
      - "infra/compose/compose.prod.yml"
      - "platform/**"
      - "scripts/platform/**"
      - "scripts/security/**"
      - "scripts/ci/tests/test_kubernetes_platform_contract.py"
      - "scripts/ci/tests/test_two_operator_cell_pilot.py"
      - "scripts/ci/tests/test_trivy_rendered_manifests.py"
      - "scripts/ci/tests/test_kubernetes_ha_contract.py"
      - "docs/runbooks/gewebezelle-manual-pilot.md"
      - "docs/runbooks/gewebezelle-two-operator-pilot-v1.md"
      - "docs/proofs/gewebezelle-two-operator-pilot-contract-v1.md"
      - "docs/tasks/board.md"
      - "Makefile"
      - "repo.meta.yaml"

concurrency:
  group: kubernetes-platform-pr-${{ github.event.pull_request.head.sha }}
  cancel-in-progress: false

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # tag: v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # tag: v7.0.0
        with:
          python-version: "3.10"
      - name: Install validator dependency
        run: python -m pip install --disable-pip-version-check 'PyYAML==6.0.3'
      - name: Compile platform tools
        run: >-
          python -m py_compile
          scripts/platform/bootstrap_tools.py
          scripts/platform/proof_identity.py
          scripts/platform/oci_proof_mirror.py
          scripts/platform/validate_platform.py
          scripts/platform/validate_two_operator_pilot.py
          scripts/platform/kind_reference.py
          scripts/platform/ha_reference.py
          scripts/security/trivy_rendered_manifests.py
      - name: Run platform contract tests
        run: >-
          python -m unittest
          scripts.ci.tests.test_kubernetes_platform_contract
          scripts.ci.tests.test_two_operator_cell_pilot
          scripts.ci.tests.test_kubernetes_ha_contract
          scripts.ci.tests.test_trivy_rendered_manifests
      - name: Render and validate all platform targets
        run: python scripts/platform/validate_platform.py --render

  two-operator-pilot-proof:
    name: Two-Operator Pilot Proof
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # tag: v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # tag: v7.0.0
        with:
          python-version: "3.10"
      - name: Install validator dependency
        run: python -m pip install --disable-pip-version-check 'PyYAML==6.0.3'
      - name: Validate two-operator pilot proof
        run: make cell-pilot-check

  trivy-rendered-security:
    needs: contract
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # tag: v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # tag: v7.0.0
        with:
          python-version: "3.10"
      - name: Install validator dependency
        run: python -m pip install --disable-pip-version-check 'PyYAML==6.0.3'
      - name: Scan canonical rendered manifests and generate CycloneDX SBOM
        run: python scripts/security/trivy_rendered_manifests.py
      - name: Upload Trivy evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # tag: v7.0.1
        with:
          name: trivy-rendered-security-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/security/trivy/*.json
          if-no-files-found: error
          retention-days: 14

  pr1658-foldin:
    if: >-
      github.event.pull_request.number == 1658 &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'feat/gewebezelle-two-operator-pilot-v1'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # tag: v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: true
      - name: Verify immutable fold-in binding
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_HEAD_REF}" = "feat/gewebezelle-two-operator-pilot-v1"
          test "$(git rev-parse HEAD^)" = "f417a869bd4cebed166403096d9a5a786f540375"
          test "$(git diff --name-only HEAD^ HEAD)" = ".github/workflows/kubernetes-platform.yml"
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # tag: v7.0.0
        with:
          python-version: "3.12"
      - name: Install fold-in dependencies
        run: python -m pip install --disable-pip-version-check 'PyYAML==6.0.3' ruff
      - name: Materialize and apply reviewed fold-in
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PATCH_BLOB_SHA: b4b00a03161d10564ab5bca521e830ec3d074fad
          PATCH_SHA256: f8a7350fdfb0b6f3e9706067fee935be19949820544d2a7886a364fcdc1003be
        run: |
          set -euo pipefail
          curl --fail --silent --show-error \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/git/blobs/${PATCH_BLOB_SHA}" \
            | jq -r '.content' | tr -d '\n' | base64 --decode \
            | gzip --decompress > /tmp/pr1658-foldin.py
          test "$(sha256sum /tmp/pr1658-foldin.py | cut -d' ' -f1)" = "$PATCH_SHA256"
          python /tmp/pr1658-foldin.py
      - name: Format and lint changed Python
        run: |
          python -m ruff check --fix \
            scripts/platform/validate_two_operator_pilot.py \
            scripts/ci/tests/test_two_operator_cell_pilot.py
          python -m ruff format \
            scripts/platform/validate_two_operator_pilot.py \
            scripts/ci/tests/test_two_operator_cell_pilot.py
          python -m ruff check \
            scripts/platform/validate_two_operator_pilot.py \
            scripts/ci/tests/test_two_operator_cell_pilot.py
          python -m py_compile \
            scripts/platform/validate_two_operator_pilot.py \
            scripts/ci/tests/test_two_operator_cell_pilot.py \
            scripts/ci/tests/test_kubernetes_platform_contract.py \
            scripts/ci/tests/test_kubernetes_ha_contract.py
      - name: Run focused Python contracts
        run: |
          python -m unittest scripts.ci.tests.test_two_operator_cell_pilot
          python -m unittest \
            scripts.ci.tests.test_kubernetes_platform_contract \
            scripts.ci.tests.test_kubernetes_ha_contract
      - name: Run platform and docs gates
        run: |
          make cell-pilot-check
          make platform-check
          make docs-guard
      - name: Run federation key regressions
        run: |
          cargo fmt --all -- --check
          cargo test -p weltgewebe-api federation::tests::
          cargo test -p weltgewebe-api --test two_operator_pilot_example_keys
      - name: Commit reviewed fold-in
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          test -z "$(git status --short | grep -E '^\?\?' || true)"
          git config user.name 'heimgewebe-operator'
          git config user.email 'noreply@heimgewebe.invalid'
          git add -A
          git commit -m 'fix(platform): close two-operator pilot trust gaps'
          git push origin HEAD:feat/gewebezelle-two-operator-pilot-v1
