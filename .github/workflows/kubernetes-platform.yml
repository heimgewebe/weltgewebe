---
name: kubernetes-platform
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

permissions:
  contents: read

"on":
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/kubernetes-platform.yml"
      - "apps/api/Dockerfile"
      - "apps/api/entrypoint.sh"
      - "apps/web/**"
      - "infra/compose/compose.prod.yml"
      - "platform/**"
      - "scripts/platform/**"
      - "scripts/security/**"
      - "scripts/ci/tests/test_kubernetes_platform_contract.py"
      - "scripts/ci/tests/test_trivy_rendered_manifests.py"
      - "scripts/ci/tests/test_kubernetes_ha_contract.py"
      - "repo.meta.yaml"
  push:
    branches: [main]
    paths:
      - ".github/workflows/kubernetes-platform.yml"
      - "apps/api/Dockerfile"
      - "apps/api/entrypoint.sh"
      - "apps/web/**"
      - "infra/compose/compose.prod.yml"
      - "platform/**"
      - "scripts/platform/**"
      - "scripts/security/**"
      - "scripts/ci/tests/test_kubernetes_platform_contract.py"
      - "scripts/ci/tests/test_trivy_rendered_manifests.py"
      - "scripts/ci/tests/test_kubernetes_ha_contract.py"
      - "repo.meta.yaml"

concurrency:
  group: kubernetes-platform-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # tag: v7.0.1
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # tag: v7.0.0
        with:
          python-version: "3.10"
      - name: Install validator dependency
        run: python -m pip install --disable-pip-version-check 'PyYAML==6.0.3'
      - name: Compile platform tools
        run: >-
          python -m py_compile
          scripts/platform/bootstrap_tools.py
          scripts/platform/validate_platform.py
          scripts/platform/kind_reference.py
          scripts/platform/ha_reference.py
          scripts/security/trivy_rendered_manifests.py
      - name: Run platform contract tests
        run: >-
          python -m unittest
          scripts.ci.tests.test_kubernetes_platform_contract
          scripts.ci.tests.test_kubernetes_ha_contract
          scripts.ci.tests.test_trivy_rendered_manifests
      - name: Render and validate all platform targets
        run: python scripts/platform/validate_platform.py --render

  trivy-rendered-security:
    needs: contract
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # tag: v7.0.1
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # tag: v7.0.0
        with:
          python-version: "3.10"
      - name: Install validator dependency
        run: python -m pip install --disable-pip-version-check 'PyYAML==6.0.3'
      - name: Scan canonical rendered manifests and generate CycloneDX SBOM
        run: python scripts/security/trivy_rendered_manifests.py
      - name: Upload Trivy evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # tag: v7.0.1
        with:
          name: trivy-rendered-security-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/security/trivy/*.json
          if-no-files-found: error
          retention-days: 14

  kind-gitops-proof:
    needs: contract
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CLUSTER_NAME: wg-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # tag: v7.0.1
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # tag: v7.0.0
        with:
          python-version: "3.10"
      - name: Install proof dependency
        run: python -m pip install --disable-pip-version-check 'PyYAML==6.0.3'
      - name: Run pull-request direct reference proof
        if: github.event_name == 'pull_request'
        run: >-
          python scripts/platform/kind_reference.py proof
          --cluster "$CLUSTER_NAME"
          --mode direct
      - name: Run commit-bound GitOps reference proof
        if: github.event_name != 'pull_request'
        run: >-
          python scripts/platform/kind_reference.py proof
          --cluster "$CLUSTER_NAME"
          --mode gitops
          --source-commit "$GITHUB_SHA"
      - name: Stage failure diagnostics
        if: failure()
        run: |
          set -euo pipefail
          source=.cache/weltgewebe-platform/failures
          target=build/kubernetes-platform/failures
          if [[ -d "$source" ]]; then
            mkdir -p "$target"
            cp -a "$source"/. "$target"/
          fi
      - name: Collect failure diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # tag: v7.0.1
        with:
          name: kubernetes-platform-failure-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/kubernetes-platform/failures/
          if-no-files-found: ignore
          retention-days: 7

  kind-ha-recovery-proof:
    needs: contract
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      CLUSTER_NAME: wg-ha-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # tag: v7.0.1
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # tag: v7.0.0
        with:
          python-version: "3.10"
      - name: Install proof dependency
        run: python -m pip install --disable-pip-version-check 'PyYAML==6.0.3'
      - name: Run HA failover and blank-cluster recovery proof
        run: >-
          python scripts/platform/ha_reference.py proof
          --cluster "$CLUSTER_NAME"
      - name: Stage HA recovery receipt
        run: |
          set -euo pipefail
          mkdir -p build/kubernetes-platform/ha-recovery
          cp -- .cache/weltgewebe-platform/receipts/*-ha-recovery.json \
            build/kubernetes-platform/ha-recovery/
      - name: Upload HA recovery receipt
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # tag: v7.0.1
        with:
          name: kubernetes-ha-recovery-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/kubernetes-platform/ha-recovery/*.json
          if-no-files-found: error
          retention-days: 14
      - name: Stage HA failure diagnostics
        if: failure()
        run: |
          set -euo pipefail
          source=.cache/weltgewebe-platform/failures
          target=build/kubernetes-platform/failures
          if [[ -d "$source" ]]; then
            mkdir -p "$target"
            cp -a "$source"/. "$target"/
          fi
      - name: Collect HA failure diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # tag: v7.0.1
        with:
          name: kubernetes-ha-failure-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/kubernetes-platform/failures/
          if-no-files-found: ignore
          retention-days: 14
      - name: Reconcile owned HA proof resources
        if: always()
        run: >-
          python scripts/platform/ha_reference.py down
          --cluster "$CLUSTER_NAME"
          --commit "$(git rev-parse HEAD)"
