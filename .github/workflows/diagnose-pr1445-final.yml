---
name: Diagnose PR 1445 final patch

"on":
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/diagnose-pr1445-final.yml"

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: deploy/merge-to-live-v1
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version-file: ".python-version"
      - name: Capture exact final-patch diagnostic
        shell: bash
        env:
          EXPECTED_BASE: 05a6f6be032b7cb53157d55881b57ebb52ed69ae
        run: |
          set +e
          {
            set -x
            git rev-parse HEAD
            git merge-base --is-ancestor "$EXPECTED_BASE" HEAD
            git diff --name-only "$EXPECTED_BASE"...HEAD
            python scripts/ci/prepare_pr1445_contract_index.py
            python scripts/ci/apply_pr1445_review_followups.py
            python scripts/ci/prepare_pr1445_pax_compat.py
            python -m py_compile \
              scripts/ops/verify_public_release_commit.py \
              scripts/ops/validate_web_deploy_archive.py
            bash -n scripts/ops/deploy-exact-commit-vps.sh
            shellcheck -S style scripts/ops/deploy-exact-commit-vps.sh
            python -m unittest \
              scripts/ci/tests/test_verify_public_release_commit.py \
              scripts/ci/tests/test_validate_web_deploy_archive.py \
              scripts/ci/tests/test_production_reconciler_contract.py \
              scripts/ci/tests/test_deploy_exact_commit_integration.py -v
            git diff --check
            printf '\nTARGET PATHS\n'
            git diff --name-only "$EXPECTED_BASE" -- \
              ':(exclude).github/workflows/apply-pr1445-review-followups.yml' \
              ':(exclude).github/workflows/diagnose-pr1445-final.yml' \
              ':(exclude)scripts/ci/apply_pr1445_review_followups.py' \
              ':(exclude)scripts/ci/prepare_pr1445_contract_index.py' \
              ':(exclude)scripts/ci/prepare_pr1445_pax_compat.py'
          } > pr1445-final-diagnostic.txt 2>&1
          rc=$?
          printf '\nexit_code=%s\n' "$rc" >> pr1445-final-diagnostic.txt
          cat pr1445-final-diagnostic.txt
          exit 0
      - name: Upload diagnostic
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pr1445-final-diagnostic
          path: pr1445-final-diagnostic.txt
          if-no-files-found: error
          retention-days: 3
