name: PR1596 Domain Outcome
# activation revision: 5

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

permissions:
  contents: write
  issues: write

"on":
  push:
    branches: [fix/node-delete-archive-history-v1]
    paths: ['.github/workflows/pr1596-domain-outcome.yml']
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/pr1596-domain-outcome.yml'
      - '.github/pr1596-domain-outcome.py'

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          ref: fix/node-delete-archive-history-v1
      - name: Verify staged inputs
        run: |
          set -euo pipefail
          base=4c3b3b6183e7e3c3c46ea32db1c1511ef7697bf3
          test "$(git diff --name-only "$base" HEAD | sort)" = $'.github/pr1596-domain-outcome.py\n.github/workflows/pr1596-domain-outcome.yml'
      - name: Apply
        run: python3 .github/pr1596-domain-outcome.py
      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9
        with:
          toolchain: stable
      - name: Format and scope check
        id: format
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          cargo fmt --manifest-path apps/api/Cargo.toml 2>&1 | tee /tmp/pr1596-format.log
          test "$(git diff --name-only | sort)" = 'apps/api/src/domain_db.rs'
      - name: Clippy
        id: clippy
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          cargo clippy --locked --manifest-path apps/api/Cargo.toml --all-targets -- -D warnings 2>&1 | tee /tmp/pr1596-clippy.log
      - name: Compile DB target
        id: compile
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          cargo test --locked --manifest-path apps/api/Cargo.toml --test db_domain_node_write_path --no-run 2>&1 | tee /tmp/pr1596-compile.log
      - name: Diff check
        id: diff
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          git diff --check 2>&1 | tee /tmp/pr1596-diff.log
      - name: Report validation failure
        if: steps.format.outcome != 'success' || steps.clippy.outcome != 'success' || steps.compile.outcome != 'success' || steps.diff.outcome != 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          FORMAT_OUTCOME: ${{ steps.format.outcome }}
          CLIPPY_OUTCOME: ${{ steps.clippy.outcome }}
          COMPILE_OUTCOME: ${{ steps.compile.outcome }}
          DIFF_OUTCOME: ${{ steps.diff.outcome }}
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "PR1596 domain-outcome validation failed: format=${FORMAT_OUTCOME}, clippy=${CLIPPY_OUTCOME}, compile=${COMPILE_OUTCOME}, diff=${DIFF_OUTCOME}."
            for log in /tmp/pr1596-format.log /tmp/pr1596-clippy.log /tmp/pr1596-compile.log /tmp/pr1596-diff.log; do
              if test -s "$log"; then
                echo
                echo "--- $(basename "$log") (tail) ---"
                tail -n 40 "$log"
              fi
            done
            echo
            echo "No product commit was published."
          } >/tmp/pr1596-report.txt
          gh api "repos/${{ github.repository }}/issues/1596/comments" --raw-field body="$(cat /tmp/pr1596-report.txt)"
          exit 1
      - name: Publish
        if: steps.format.outcome == 'success' && steps.clippy.outcome == 'success' && steps.compile.outcome == 'success' && steps.diff.outcome == 'success'
        run: |
          set -euo pipefail
          rm .github/pr1596-domain-outcome.py .github/workflows/pr1596-domain-outcome.yml
          git config user.name weltgewebe-operator
          git config user.email actions@users.noreply.github.com
          git add apps/api/src/domain_db.rs .github/pr1596-domain-outcome.py .github/workflows/pr1596-domain-outcome.yml
          git commit -m 'feat(nodes): return conversation removal effects'
          git push origin HEAD:fix/node-delete-archive-history-v1
