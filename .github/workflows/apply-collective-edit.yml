name: Apply collective edit builder

on:
  push:
    branches:
      - feat/collective-edit-delete-v1
    paths:
      - .operator-build/READY
  pull_request:
    branches:
      - main
    types:
      - opened
      - reopened
      - synchronize

permissions:
  contents: write

jobs:
  build:
    if: >-
      (github.event_name == 'push' && github.event.head_commit.message == 'chore: run collective edit builder') ||
      (github.event_name == 'pull_request' && github.head_ref == 'feat/collective-edit-delete-v1')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: feat/collective-edit-delete-v1
      - name: Reproduce verified changes
        run: |
          set -euo pipefail
          python3 .operator-build/apply_state_router.py
          python3 .operator-build/apply_collective_backend.py
          python3 .operator-build/fix_generated_rust.py
          cargo fmt --all
          python3 .operator-build/harden_collective.py
          cargo fmt --all
          python3 .operator-build/apply_map_refresh.py
          git diff --check
      - name: Commit generated result
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -r .operator-build
          git rm .github/workflows/apply-collective-edit.yml
          git add apps/api apps/web docs/specs/garnrolle-knoten-faden.md
          git commit -m "feat: allow collective editing and deletion"
          git push origin HEAD:feat/collective-edit-delete-v1
