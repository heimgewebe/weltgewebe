---
name: PR1596 Isolated Conversation DB Proof
# activation revision: 3

permissions:
  contents: write
  issues: write
  pull-requests: write

"on":
  push:
    branches: [fix/node-delete-archive-history-v1]
    paths:
      - '.github/workflows/pr1596-product-convergence.yml'
  pull_request:
    branches: [main]
    paths:
      - '.github/pr1596-isolate-conversation-db-tests.py'
      - '.github/workflows/pr1596-product-convergence.yml'

jobs:
  prove:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: welt
          POSTGRES_PASSWORD: gewebe
          POSTGRES_DB: weltgewebe_ci_proof
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U welt -d weltgewebe_ci_proof"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgres://welt:gewebe@localhost:5432/weltgewebe_ci_proof
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          ref: fix/node-delete-archive-history-v1

      - name: Verify staged inputs
        run: |
          set -euo pipefail
          base=b092ae550756704fea6ff2b062809ac584c8c2bd
          test "$(git diff --name-only "$base" HEAD | sort)" = $'.github/pr1596-isolate-conversation-db-tests.py\n.github/workflows/pr1596-product-convergence.yml'

      - name: Apply isolated schema proof
        run: python3 .github/pr1596-isolate-conversation-db-tests.py

      - name: Read Rust version
        id: rust-version
        shell: bash
        run: |
          set -euo pipefail
          SED_EXPR="s/^[[:space:]]*rust:[[:space:]]*['\"]?([^'\"#[:space:]]+)['\"]?[[:space:]]*(#.*)?$/\1/p"
          RUST_VERSION="$(sed -nE "${SED_EXPR}" toolchain.versions.yml | head -n1 | xargs)"
          test -n "${RUST_VERSION}"
          printf 'rust_version=%s\n' "${RUST_VERSION}" >> "${GITHUB_OUTPUT}"

      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9
        with:
          toolchain: ${{ steps.rust-version.outputs.rust_version }}
          components: rustfmt, clippy

      - name: Format and scope
        run: |
          set -euo pipefail
          cargo fmt --manifest-path apps/api/Cargo.toml
          test "$(git diff --name-only)" = 'apps/api/tests/db_node_conversations.rs'
          git diff --check

      - name: Clippy
        run: |
          set -o pipefail
          cargo clippy --all-targets --all-features -- -D warnings 2>&1 | tee /tmp/pr1596-isolation-clippy.log

      - name: Run proof twice on one database
        run: |
          set -o pipefail
          command=(cargo test --locked --manifest-path apps/api/Cargo.toml --test db_node_conversations -- --include-ignored --test-threads=1)
          { "${command[@]}" && "${command[@]}"; } 2>&1 | tee /tmp/pr1596-isolation-tests.log

      - name: Verify no isolated schemas remain
        run: |
          set -o pipefail
          count="$(PGPASSWORD=gewebe psql -h localhost -U welt -d weltgewebe_ci_proof -Atc \"SELECT count(*) FROM pg_namespace WHERE nspname LIKE 'pr1596_conversations_%'\")"
          echo "remaining_schemas=${count}" | tee /tmp/pr1596-isolation-schemas.log
          test "$count" = 0

      - name: Report failure
        if: failure()
        run: |
          {
            echo '## PR1596 isolated PostgreSQL proof failed'
            echo
            echo '```text'
            test ! -f /tmp/pr1596-isolation-clippy.log || tail -n 60 /tmp/pr1596-isolation-clippy.log
            test ! -f /tmp/pr1596-isolation-tests.log || tail -n 100 /tmp/pr1596-isolation-tests.log
            test ! -f /tmp/pr1596-isolation-schemas.log || cat /tmp/pr1596-isolation-schemas.log
            echo '```'
            echo
            echo "Head: ${GITHUB_SHA}"
          } > /tmp/pr1596-isolation-report.md
          gh pr comment 1596 --repo "${GITHUB_REPOSITORY}" --body-file /tmp/pr1596-isolation-report.md

      - name: Publish
        run: |
          set -euo pipefail
          rm .github/pr1596-isolate-conversation-db-tests.py .github/workflows/pr1596-product-convergence.yml
          git config user.name weltgewebe-operator
          git config user.email actions@users.noreply.github.com
          git add -A
          git commit -m 'test(conversations): isolate PostgreSQL lifecycle proofs'
          git push origin HEAD:fix/node-delete-archive-history-v1
