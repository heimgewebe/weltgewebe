---
name: PR1596 Product Convergence

permissions:
  contents: write

"on":
  pull_request:
    branches: [main]
    paths:
      - '.github/pr1596-product-convergence.py'
      - '.github/workflows/pr1596-product-convergence.yml'

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          ref: fix/node-delete-archive-history-v1

      - name: Verify staged inputs
        run: |
          set -euo pipefail
          base=45e2b30d70829febd68074ee3437f3ad55ceace5
          test "$(git diff --name-only "$base" HEAD | sort)" = $'.github/pr1596-product-convergence.py\n.github/workflows/pr1596-product-convergence.yml'

      - name: Apply product convergence
        run: python3 .github/pr1596-product-convergence.py

      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9
        with:
          toolchain: stable
          components: rustfmt, clippy

      - uses: pnpm/action-setup@b0f76dfb45f55f8421693e4803ac7bb65143bd34
        with:
          run_install: false

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version-file: '.node-version'
          cache: 'pnpm'
          cache-dependency-path: |
            pnpm-lock.yaml
            apps/web/pnpm-lock.yaml

      - name: Format and verify scope
        run: |
          set -euo pipefail
          cargo fmt --manifest-path apps/api/Cargo.toml
          expected=$'apps/api/src/routes/nodes.rs\napps/api/tests/api_collective_mutations.rs\napps/web/src/lib/api/domainWrites.test.ts\napps/web/src/lib/api/domainWrites.ts\napps/web/src/lib/components/ContextPanel.svelte\napps/web/src/lib/components/panels/NodePanel.svelte\napps/web/src/routes/map/+page.svelte\napps/web/tests/fixtures/mockApi.ts\napps/web/tests/node-mutations.spec.ts\ndocs/specs/objektlebenszyklen-und-loeschwirkungen.md'
          test "$(git diff --name-only | sort)" = "$expected"

      - name: Validate Rust
        run: |
          set -euo pipefail
          cargo clippy --locked --manifest-path apps/api/Cargo.toml --all-targets -- -D warnings
          cargo test --locked --manifest-path apps/api/Cargo.toml --test api_collective_mutations

      - name: Validate web
        working-directory: apps/web
        run: |
          set -euo pipefail
          pnpm install --frozen-lockfile
          pnpm sync
          pnpm exec vitest run src/lib/api/domainWrites.test.ts
          pnpm run check:ci

      - name: Validate docs and diff
        run: |
          set -euo pipefail
          python3 scripts/docmeta/check_repo_index_consistency.py
          git diff --check

      - name: Publish
        run: |
          set -euo pipefail
          rm .github/pr1596-product-convergence.py .github/workflows/pr1596-product-convergence.yml
          git config user.name weltgewebe-operator
          git config user.email actions@users.noreply.github.com
          git add -A
          git commit -m 'fix(nodes): complete removal receipt convergence'
          git push origin HEAD:fix/node-delete-archive-history-v1
