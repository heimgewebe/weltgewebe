---
name: Temporary merge-to-live rebase

"on":
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/rebase-merge-to-live-temporary.yml
  push:
    branches:
      - deploy/merge-to-live-v1-rebased-20260716
    paths:
      - .github/workflows/rebase-merge-to-live-temporary.yml

permissions:
  contents: write

jobs:
  rebase:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: deploy/merge-to-live-v1-rebased-20260716
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version-file: ".python-version"
      - name: Materialize exact reviewed files on current main
        shell: bash
        env:
          SOURCE_HEAD: 947e4ab4a00e438dbf068149a9ac38fa4d6199d9
          TARGET_BRANCH: deploy/merge-to-live-v1-rebased-20260716
        run: |
          set -euo pipefail
          [[ "$SOURCE_HEAD" =~ ^[0-9a-f]{40}$ ]]
          git fetch --no-tags origin "$SOURCE_HEAD"
          paths=(
            .github/workflows/production-live-contract.yml
            apps/web/scripts/generate-version.js
            docs/deploy/merge-to-live.md
            infra/systemd/system/weltgewebe-production-reconcile.service
            infra/systemd/system/weltgewebe-production-reconcile.timer
            scripts/ci/tests/test_deploy_exact_commit_integration.py
            scripts/ci/tests/test_generate_version_env.py
            scripts/ci/tests/test_production_reconciler_contract.py
            scripts/ci/tests/test_validate_web_deploy_archive.py
            scripts/ci/tests/test_verify_public_release_commit.py
            scripts/ops/deploy-exact-commit-vps.sh
            scripts/ops/install-production-reconciler.sh
            scripts/ops/reconcile-production-main-vps.sh
            scripts/ops/validate_web_deploy_archive.py
            scripts/ops/verify_public_release_commit.py
          )
          git checkout "$SOURCE_HEAD" -- "${paths[@]}"
          make generate
          git rm .github/workflows/rebase-merge-to-live-temporary.yml
          expected_paths="$(mktemp)"
          actual_paths="$(mktemp)"
          trap 'rm -f "$expected_paths" "$actual_paths"' EXIT
          cat > "$expected_paths" <<'EOF'
          .github/workflows/production-live-contract.yml
          .github/workflows/rebase-merge-to-live-temporary.yml
          apps/web/scripts/generate-version.js
          docs/_generated/backlinks.md
          docs/_generated/doc-index.md
          docs/_generated/relates-to-audit.md
          docs/_generated/relations-analysis.md
          docs/deploy/merge-to-live.md
          infra/systemd/system/weltgewebe-production-reconcile.service
          infra/systemd/system/weltgewebe-production-reconcile.timer
          scripts/ci/tests/test_deploy_exact_commit_integration.py
          scripts/ci/tests/test_generate_version_env.py
          scripts/ci/tests/test_production_reconciler_contract.py
          scripts/ci/tests/test_validate_web_deploy_archive.py
          scripts/ci/tests/test_verify_public_release_commit.py
          scripts/ops/deploy-exact-commit-vps.sh
          scripts/ops/install-production-reconciler.sh
          scripts/ops/reconcile-production-main-vps.sh
          scripts/ops/validate_web_deploy_archive.py
          scripts/ops/verify_public_release_commit.py
          EOF
          sed -i 's/^          //' "$expected_paths"
          git status --porcelain | cut -c4- | sort > "$actual_paths"
          sort -o "$expected_paths" "$expected_paths"
          diff -u "$expected_paths" "$actual_paths"
          git add -- "${paths[@]}" docs/_generated
          git diff --cached --check
          git config user.name "weltgewebe-rebase-bot"
          git config user.email "rebase-bot@weltgewebe.invalid"
          git commit -m "chore: rebase merge-to-live onto current main"
          git push origin "HEAD:$TARGET_BRANCH"
