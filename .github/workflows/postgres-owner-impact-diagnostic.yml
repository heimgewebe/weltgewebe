---
name: PostgreSQL owner impact diagnostic

"on":
  pull_request:
    paths:
      - "apps/api/migrations/**semantic_search_owner_lifecycle**"
      - "apps/api/tests/db_semantic_search_owner_lifecycle.rs"
      - "apps/api/tests/db_semantic_search_projection_worker.rs"
      - "scripts/ci/run-postgres-integration-proofs.sh"
      - ".github/workflows/postgres-owner-impact-diagnostic.yml"
  workflow_dispatch: {}

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  matrix-log:
    name: Full PostgreSQL matrix with log artifact
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16@sha256:be01cf82fc7dbba824acf0a82e150b4b360f3ff93c6631d7844af431e841a95c
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/weltgewebe_owner_impact_test
      PG_DIRECT_URL: postgres://postgres:postgres@127.0.0.1:5432/weltgewebe_owner_impact_test
      POSTGRES_PROOF_PROVISION_NATS: "1"
      POSTGRES_PROOF_ALLOW_RESET: "1"
      CARGO_TERM_COLOR: never
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # tag: v7.0.1

      - name: Install PostgreSQL client
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends postgresql-client

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # tag: v1
        with:
          toolchain: 1.89.0

      - name: Cache cargo
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # tag: v2

      - name: Run full PostgreSQL matrix
        run: |
          set -o pipefail
          scripts/ci/run-postgres-integration-proofs.sh 2>&1 | tee postgres-owner-impact.log

      - name: Upload diagnostic log
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # tag: v7.0.1
        with:
          name: postgres-owner-impact-${{ github.run_id }}
          path: postgres-owner-impact.log
          if-no-files-found: error
          retention-days: 3
