---
name: Patch owner API fixture

"on":
  pull_request:
    paths:
      - ".github/workflows/postgres-owner-impact-diagnostic.yml"

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # tag: v7.0.1
        with:
          ref: feat/semantic-search-t012-production-v1
          fetch-depth: 0

      - name: Bind API owner fixtures to active accounts
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("apps/api/tests/db_semantic_search_projection_worker.rs")
          text = path.read_text(encoding="utf-8")

          old_query = "DELETE FROM domain_accounts WHERE id='owner-private'"
          new_query = "DELETE FROM domain_accounts WHERE id IN ('owner-private','owner-a','owner-b')"
          if text.count(old_query) != 1:
              raise SystemExit(f"unexpected owner cleanup query count: {text.count(old_query)}")
          text = text.replace(old_query, new_query, 1)

          old_message = "remove prior private-owner account"
          new_message = "remove prior private-owner accounts"
          if text.count(old_message) != 1:
              raise SystemExit(f"unexpected owner cleanup message count: {text.count(old_message)}")
          text = text.replace(old_message, new_message, 1)

          loop_line = "    for (index, (id, kind, title, payload, visibility, embedding)) in nodes.iter().enumerate() {\n"
          owner_setup = (
              "    sqlx::query(\n"
              "        \"INSERT INTO domain_accounts (id,title,disabled) VALUES \\\n"
              "         ('owner-a','Owner A',FALSE),('owner-b','Owner B',FALSE)\",\n"
              "    )\n"
              "    .execute(&pool)\n"
              "    .await\n"
              "    .expect(\"insert active T006 owner accounts\");\n\n"
              + loop_line
          )
          if text.count(loop_line) != 1:
              raise SystemExit(f"unexpected T006 node loop count: {text.count(loop_line)}")
          text = text.replace(loop_line, owner_setup, 1)
          path.write_text(text, encoding="utf-8")
          PY

          cargo fmt --all
          git diff --check
          rm .github/workflows/postgres-owner-impact-diagnostic.yml

      - name: Commit exact fixture correction
        run: |
          git config user.name "weltgewebe-ci"
          git config user.email "weltgewebe-ci@users.noreply.github.com"
          git add apps/api/tests/db_semantic_search_projection_worker.rs \
            .github/workflows/postgres-owner-impact-diagnostic.yml
          git diff --cached --check
          git commit -m "test(search): bind API owner fixtures to accounts"
          git push origin HEAD:feat/semantic-search-t012-production-v1
