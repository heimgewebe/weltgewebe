---
name: Patch owner API fixture

"on":
  pull_request:
    paths:
      - ".github/workflows/postgres-owner-impact-diagnostic.yml"

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # tag: v7.0.1
        with:
          ref: feat/semantic-search-t012-production-v1
          fetch-depth: 0

      - name: Bind API owner fixtures to active accounts
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("apps/api/tests/db_semantic_search_projection_worker.rs")
          text = path.read_text(encoding="utf-8")

          old_cleanup = '''    sqlx::query("DELETE FROM domain_accounts WHERE id='owner-private'")
              .execute(pool)
              .await
              .expect("remove prior private-owner account");
          '''
          new_cleanup = '''    sqlx::query("DELETE FROM domain_accounts WHERE id IN ('owner-private','owner-a','owner-b')")
              .execute(pool)
              .await
              .expect("remove prior private-owner accounts");
          '''
          if text.count(old_cleanup) != 1:
              raise SystemExit("unexpected owner cleanup anchor count")
          text = text.replace(old_cleanup, new_cleanup, 1)

          loop_anchor = '''    for (index, (id, kind, title, payload, visibility, embedding)) in nodes.iter().enumerate() {
          '''
          owner_setup = '''    sqlx::query(
              "INSERT INTO domain_accounts (id,title,disabled) VALUES \
               ('owner-a','Owner A',FALSE),('owner-b','Owner B',FALSE)",
          )
          .execute(&pool)
          .await
          .expect("insert active T006 owner accounts");

              for (index, (id, kind, title, payload, visibility, embedding)) in nodes.iter().enumerate() {
          '''
          if text.count(loop_anchor) != 1:
              raise SystemExit("unexpected T006 node loop anchor count")
          text = text.replace(loop_anchor, owner_setup, 1)
          path.write_text(text, encoding="utf-8")
          PY

          cargo fmt --all
          git diff --check
          rm .github/workflows/postgres-owner-impact-diagnostic.yml

      - name: Commit exact fixture correction
        run: |
          git config user.name "weltgewebe-ci"
          git config user.email "weltgewebe-ci@users.noreply.github.com"
          git add apps/api/tests/db_semantic_search_projection_worker.rs \
            .github/workflows/postgres-owner-impact-diagnostic.yml
          git diff --cached --check
          git commit -m "test(search): bind API owner fixtures to accounts"
          git push origin HEAD:feat/semantic-search-t012-production-v1
