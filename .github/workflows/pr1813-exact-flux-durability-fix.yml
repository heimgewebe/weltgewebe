---
name: PR1813 exact Flux and directory durability fix

"on":
  push:
    branches:
      - bureau/weltgewebe-os-v1-t084/5e0085fc46
    paths:
      - .github/workflows/pr1813-exact-flux-durability-fix.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # tag: v7.0.1
        with:
          fetch-depth: 0
          ref: bureau/weltgewebe-os-v1-t084/5e0085fc46

      - name: Verify exact parent
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "9e04da374e382d713fd4b287175f260a570d5302"

      - name: Require current Flux revisions and durable directories
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              p = Path(path)
              text = p.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one replacement, found {count}")
              p.write_text(text.replace(old, new, 1), encoding="utf-8")

          staging = "scripts/platform/staging_cell.py"

          replace_once(
              staging,
              '''def atomic_json(path: Path, payload: dict[str, Any], *, mode: int = 0o600) -> None:\n    path.parent.mkdir(parents=True, exist_ok=True)\n''',
              '''def ensure_directory_durable(path: Path, *, mode: int = 0o700) -> None:\n    missing: list[Path] = []\n    current = path\n    while True:\n        try:\n            linked = current.lstat()\n        except FileNotFoundError:\n            parent = current.parent\n            if parent == current:\n                raise StagingCellError(\n                    f"cannot find an existing parent for durable directory {path}"\n                )\n            missing.append(current)\n            current = parent\n            continue\n        if stat.S_ISLNK(linked.st_mode) or not stat.S_ISDIR(linked.st_mode):\n            raise StagingCellError(\n                f"durable directory parent must be a real directory: {current}"\n            )\n        break\n    for directory in reversed(missing):\n        directory.mkdir(mode=mode)\n        fsync_directory(directory.parent)\n\n\ndef atomic_json(path: Path, payload: dict[str, Any], *, mode: int = 0o600) -> None:\n    ensure_directory_durable(path.parent)\n''',
          )
          replace_once(
              staging,
              '''def atomic_text(path: Path, text: str, *, mode: int = 0o600) -> None:\n    path.parent.mkdir(parents=True, exist_ok=True)\n''',
              '''def atomic_text(path: Path, text: str, *, mode: int = 0o600) -> None:\n    ensure_directory_durable(path.parent)\n''',
          )
          replace_once(
              staging,
              '''@contextmanager\ndef lifecycle_lock(root: Path):\n    root.mkdir(parents=True, exist_ok=True, mode=0o700)\n''',
              '''@contextmanager\ndef lifecycle_lock(root: Path):\n    ensure_directory_durable(root, mode=0o700)\n''',
          )
          replace_once(
              staging,
              '''    root = state_root(getattr(args, "state_root", None))\n    root.mkdir(parents=True, exist_ok=True)\n    os.chmod(root, 0o700)\n    configure_reference_paths(root)\n    receipt = load_tool_receipt(root)\n    data_root = root / "data"\n    data_root.mkdir(parents=True, exist_ok=True)\n    os.chmod(data_root, 0o755)\n    (data_root / "postgres").mkdir(parents=True, exist_ok=True)\n    (data_root / "nats").mkdir(parents=True, exist_ok=True)\n''',
              '''    root = state_root(getattr(args, "state_root", None))\n    ensure_directory_durable(root, mode=0o700)\n    os.chmod(root, 0o700)\n    configure_reference_paths(root)\n    receipt = load_tool_receipt(root)\n    data_root = root / "data"\n    ensure_directory_durable(data_root, mode=0o755)\n    os.chmod(data_root, 0o755)\n    ensure_directory_durable(data_root / "postgres", mode=0o700)\n    ensure_directory_durable(data_root / "nats", mode=0o700)\n''',
          )

          replace_once(
              staging,
              '''def wait_data(kubectl: str) -> None:\n    reference.wait_condition(\n        kubectl, "flux-system", f"gitrepository/{SOURCE_NAME}", "Ready"\n    )\n    wait_pvcs_bound(kubectl)\n    reference.wait_condition(\n        kubectl,\n        "flux-system",\n        f"kustomization/{DATA_KUSTOMIZATION}",\n        "Ready",\n    )\n''',
              '''def flux_resource_current_state(\n    kubectl: str, resource: str, name: str, commit: str\n) -> dict[str, Any]:\n    if resource not in {"gitrepository", "kustomization"}:\n        raise StagingCellError(f"unsupported Flux resource type: {resource}")\n    raw = output(\n        [\n            kubectl,\n            "-n",\n            "flux-system",\n            "get",\n            resource,\n            name,\n            "--ignore-not-found",\n            "-o",\n            "json",\n        ]\n    )\n    if not raw:\n        return {\n            "ready": "missing",\n            "revision": "missing",\n            "matches_commit": False,\n            "current_generation": False,\n        }\n    try:\n        document = json.loads(raw)\n    except json.JSONDecodeError as error:\n        raise StagingCellError(f"cannot parse Flux {resource} status JSON") from error\n    if not isinstance(document, dict):\n        raise StagingCellError(f"Flux {resource} status payload is not an object")\n    metadata = document.get("metadata")\n    status_payload = document.get("status")\n    if not isinstance(metadata, dict) or not isinstance(status_payload, dict):\n        return {\n            "ready": "missing",\n            "revision": "missing",\n            "matches_commit": False,\n            "current_generation": False,\n        }\n    generation = metadata.get("generation")\n    observed_generation = status_payload.get("observedGeneration")\n    current_generation = (\n        isinstance(generation, int)\n        and not isinstance(generation, bool)\n        and isinstance(observed_generation, int)\n        and not isinstance(observed_generation, bool)\n        and generation == observed_generation\n    )\n    ready_status = "missing"\n    conditions = status_payload.get("conditions")\n    if isinstance(conditions, list):\n        for condition in conditions:\n            if isinstance(condition, dict) and condition.get("type") == "Ready":\n                value = condition.get("status")\n                if isinstance(value, str) and value:\n                    ready_status = value\n                break\n    ready = ready_status if current_generation else "stale"\n    if resource == "gitrepository":\n        artifact = status_payload.get("artifact")\n        revision_value = artifact.get("revision") if isinstance(artifact, dict) else None\n    else:\n        revision_value = status_payload.get("lastAppliedRevision")\n    revision = revision_value if isinstance(revision_value, str) and revision_value else "missing"\n    return {\n        "ready": ready,\n        "revision": revision,\n        "matches_commit": flux_revision_matches_commit(revision, commit),\n        "current_generation": current_generation,\n    }\n\n\ndef wait_flux_resource_current(\n    kubectl: str,\n    resource: str,\n    name: str,\n    commit: str,\n    *,\n    timeout_seconds: float = DATA_KUSTOMIZATION_TIMEOUT_SECONDS,\n) -> dict[str, Any]:\n    deadline = time.monotonic() + timeout_seconds\n    observed: dict[str, Any] = {}\n    while True:\n        observed = flux_resource_current_state(kubectl, resource, name, commit)\n        if observed["ready"] == "True" and observed["matches_commit"]:\n            return observed\n        if time.monotonic() >= deadline:\n            raise StagingCellError(\n                f"Flux {resource}/{name} did not reach the current receipt-bound revision "\n                f"within {timeout_seconds:g}s: ready={observed.get('ready')!r} "\n                f"revision={observed.get('revision')!r}"\n            )\n        time.sleep(1)\n\n\ndef wait_data(kubectl: str, commit: str) -> None:\n    wait_flux_resource_current(kubectl, "gitrepository", SOURCE_NAME, commit)\n    wait_pvcs_bound(kubectl)\n    wait_flux_resource_current(kubectl, "kustomization", DATA_KUSTOMIZATION, commit)\n''',
          )
          replace_once(
              staging,
              '''    apply_yaml(kubectl, flux_documents(commit))\n    wait_data(kubectl)\n''',
              '''    apply_yaml(kubectl, flux_documents(commit))\n    wait_data(kubectl, commit)\n''',
          )

          tests = "scripts/ci/tests/test_staging_cell_runtime_contract.py"
          replace_once(
              tests,
              '''    def test_status_reports_not_bootstrapped_without_toolchain(self) -> None:\n''',
              '''    def test_atomic_write_fsyncs_new_parent_directory_entry(self) -> None:\n        with tempfile.TemporaryDirectory(prefix="staging-cell-fsync-new-parent-") as tmp_name:\n            root = Path(tmp_name)\n            receipt_path = root / "receipts/cell.json"\n            with mock.patch.object(staging, "fsync_directory") as fsync_mock:\n                staging.atomic_json(receipt_path, {"schema_version": 1})\n        self.assertEqual(\n            fsync_mock.call_args_list,\n            [mock.call(root), mock.call(root / "receipts")],\n        )\n\n    def test_status_reports_not_bootstrapped_without_toolchain(self) -> None:\n''',
          )
          replace_once(
              tests,
              '''    def test_wait_data_checks_pvcs_before_flux_health_without_rollout_duplication(self) -> None:\n        events: list[str] = []\n\n        def wait_condition(_kubectl: str, _namespace: str, resource: str, _condition: str) -> None:\n            events.append(resource)\n\n        with (\n            mock.patch.object(staging.reference, "wait_condition", side_effect=wait_condition),\n            mock.patch.object(\n                staging,\n                "wait_pvcs_bound",\n                side_effect=lambda _kubectl: events.append("pvcs-bound"),\n            ),\n            mock.patch.object(\n                staging.reference,\n                "wait_rollout",\n                side_effect=AssertionError("redundant rollout wait must not run"),\n            ),\n        ):\n            staging.wait_data("kubectl")\n        self.assertEqual(\n            events,\n            [\n                f"gitrepository/{staging.SOURCE_NAME}",\n                "pvcs-bound",\n                f"kustomization/{staging.DATA_KUSTOMIZATION}",\n            ],\n        )\n''',
              '''    def test_flux_wait_requires_current_generation_and_exact_revision(self) -> None:\n        commit = "a" * 40\n        states = [\n            {\n                "ready": "stale",\n                "revision": f"main@sha1:{commit}",\n                "matches_commit": True,\n                "current_generation": False,\n            },\n            {\n                "ready": "True",\n                "revision": f"main@sha1:{'b' * 40}",\n                "matches_commit": False,\n                "current_generation": True,\n            },\n            {\n                "ready": "True",\n                "revision": f"main@sha1:{commit}",\n                "matches_commit": True,\n                "current_generation": True,\n            },\n        ]\n        with (\n            mock.patch.object(\n                staging, "flux_resource_current_state", side_effect=states\n            ) as state_mock,\n            mock.patch.object(staging.time, "monotonic", side_effect=[0.0, 1.0, 2.0]),\n            mock.patch.object(staging.time, "sleep") as sleep_mock,\n        ):\n            result = staging.wait_flux_resource_current(\n                "kubectl",\n                "kustomization",\n                staging.DATA_KUSTOMIZATION,\n                commit,\n                timeout_seconds=10.0,\n            )\n        self.assertTrue(result["matches_commit"])\n        self.assertEqual(result["ready"], "True")\n        self.assertEqual(state_mock.call_count, 3)\n        self.assertEqual(sleep_mock.call_count, 2)\n\n    def test_wait_data_requires_exact_flux_states_around_pvc_binding(self) -> None:\n        events: list[str] = []\n        commit = "c" * 40\n\n        def wait_flux(\n            _kubectl: str, resource: str, name: str, observed_commit: str\n        ) -> dict[str, object]:\n            self.assertEqual(observed_commit, commit)\n            events.append(f"{resource}/{name}")\n            return {\n                "ready": "True",\n                "revision": f"main@sha1:{commit}",\n                "matches_commit": True,\n                "current_generation": True,\n            }\n\n        with (\n            mock.patch.object(staging, "wait_flux_resource_current", side_effect=wait_flux),\n            mock.patch.object(\n                staging,\n                "wait_pvcs_bound",\n                side_effect=lambda _kubectl: events.append("pvcs-bound"),\n            ),\n            mock.patch.object(\n                staging.reference,\n                "wait_condition",\n                side_effect=AssertionError("condition-only Flux wait must not run"),\n            ),\n            mock.patch.object(\n                staging.reference,\n                "wait_rollout",\n                side_effect=AssertionError("redundant rollout wait must not run"),\n            ),\n        ):\n            staging.wait_data("kubectl", commit)\n        self.assertEqual(\n            events,\n            [\n                f"gitrepository/{staging.SOURCE_NAME}",\n                "pvcs-bound",\n                f"kustomization/{staging.DATA_KUSTOMIZATION}",\n            ],\n        )\n''',
          )
          PY

      - name: Run focused regression
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check --no-cache-dir 'PyYAML==6.0.2'
          python3 -m compileall -q scripts/platform/staging_cell.py scripts/ci/tests/test_staging_cell_runtime_contract.py
          python3 -m unittest scripts.ci.tests.test_staging_cell_runtime_contract
          python3 -m unittest scripts.ci.tests.test_kubernetes_platform_contract
          python3 scripts/platform/staging_cell.py self-check
          python3 scripts/platform/validate_platform.py --render
          git diff --check

      - name: Commit exact fix and remove one-shot writer
        shell: bash
        env:
          BRANCH: bureau/weltgewebe-os-v1-t084/5e0085fc46
        run: |
          set -euo pipefail
          git rm .github/workflows/pr1813-exact-flux-durability-fix.yml
          git config user.name 'alexdermohr'
          git config user.email '216529510+alexdermohr@users.noreply.github.com'
          git add scripts/platform/staging_cell.py scripts/ci/tests/test_staging_cell_runtime_contract.py
          git diff --cached --check
          git commit -m 'fix(platform): require exact Flux bootstrap state'
          git push origin "HEAD:${BRANCH}"
