---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: weltgewebe
  namespace: weltgewebe
spec:
  parentRefs:
    - name: weltgewebe
      namespace: weltgewebe-gateway
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /api
      filters:
        - type: URLRewrite
          urlRewrite:
            path:
              type: ReplacePrefixMatch
              replacePrefixMatch: /
      backendRefs:
        - name: weltgewebe-api
          port: 8080
    - matches:
        - path:
            type: PathPrefix
            value: /health
      backendRefs:
        - name: weltgewebe-api
          port: 8080
    - backendRefs:
        - name: weltgewebe-web
          port: 8080
