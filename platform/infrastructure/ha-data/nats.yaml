---
apiVersion: v1
kind: ConfigMap
metadata:
  name: nats-ha-config
data:
  nats.conf: |
    server_name: $SERVER_NAME
    host: 0.0.0.0
    port: 4222
    http: 8222
    jetstream {
      store_dir: /data/jetstream
      max_memory_store: 128MiB
      max_file_store: 1GiB
      domain: weltgewebe-ha
    }
    cluster {
      name: weltgewebe-ha
      listen: 0.0.0.0:6222
      routes: [
        nats://nats-0.nats-headless.weltgewebe-data.svc.cluster.local:6222,
        nats://nats-1.nats-headless.weltgewebe-data.svc.cluster.local:6222,
        nats://nats-2.nats-headless.weltgewebe-data.svc.cluster.local:6222
      ]
    }
---
apiVersion: v1
kind: Service
metadata:
  name: nats-headless
  labels:
    app.kubernetes.io/name: nats
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  selector:
    app.kubernetes.io/name: nats
  ports:
    - name: client
      port: 4222
    - name: cluster
      port: 6222
    - name: monitor
      port: 8222
---
apiVersion: v1
kind: Service
metadata:
  name: nats
  labels:
    app.kubernetes.io/name: nats
spec:
  selector:
    app.kubernetes.io/name: nats
  ports:
    - name: client
      port: 4222
      targetPort: client
    - name: monitor
      port: 8222
      targetPort: monitor
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: nats
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: nats
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: nats
  labels:
    app.kubernetes.io/name: nats
    app.kubernetes.io/component: messaging
spec:
  serviceName: nats-headless
  replicas: 3
  podManagementPolicy: Parallel
  selector:
    matchLabels:
      app.kubernetes.io/name: nats
  template:
    metadata:
      labels:
        app.kubernetes.io/name: nats
        app.kubernetes.io/component: messaging
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      nodeSelector:
        weltgewebe.net/data-node: "true"
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  app.kubernetes.io/name: nats
              topologyKey: topology.kubernetes.io/zone
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: nats
          image: nats@sha256:c11af972c99ae542de8925e6a7d9c533aa1eb039660420d2074beed6089b3bf0
          imagePullPolicy: IfNotPresent
          args: ["-c", "/etc/nats/nats.conf"]
          env:
            - name: SERVER_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
          ports:
            - name: client
              containerPort: 4222
            - name: cluster
              containerPort: 6222
            - name: monitor
              containerPort: 8222
          startupProbe:
            tcpSocket:
              port: client
            failureThreshold: 60
            periodSeconds: 2
          readinessProbe:
            tcpSocket:
              port: client
            periodSeconds: 3
          livenessProbe:
            tcpSocket:
              port: client
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            privileged: false
            readOnlyRootFilesystem: true
          volumeMounts:
            - name: config
              mountPath: /etc/nats
              readOnly: true
            - name: data
              mountPath: /data
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: config
          configMap:
            name: nats-ha-config
        - name: tmp
          emptyDir: {}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 1Gi
