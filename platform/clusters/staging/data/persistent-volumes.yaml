---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: weltgewebe-staging-postgres
spec:
  capacity:
    storage: 10Gi
  accessModes: ["ReadWriteOnce"]
  persistentVolumeReclaimPolicy: Retain
  storageClassName: weltgewebe-staging-hostpath
  hostPath:
    path: /var/local/weltgewebe-staging/postgres
    type: DirectoryOrCreate
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-data
  namespace: weltgewebe-data
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: weltgewebe-staging-hostpath
  volumeName: weltgewebe-staging-postgres
  resources:
    requests:
      storage: 10Gi
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: weltgewebe-staging-nats
spec:
  capacity:
    storage: 5Gi
  accessModes: ["ReadWriteOnce"]
  persistentVolumeReclaimPolicy: Retain
  storageClassName: weltgewebe-staging-hostpath
  hostPath:
    path: /var/local/weltgewebe-staging/nats
    type: DirectoryOrCreate
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: nats-data
  namespace: weltgewebe-data
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: weltgewebe-staging-hostpath
  volumeName: weltgewebe-staging-nats
  resources:
    requests:
      storage: 5Gi
