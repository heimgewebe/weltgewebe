---
apiVersion: kind.x-k8s.io/v1alpha4
kind: Cluster
name: weltgewebe-staging
networking:
  disableDefaultCNI: true
  kubeProxyMode: none
nodes:
  - role: control-plane
    extraMounts:
      - hostPath: /home/alex/.local/state/weltgewebe/staging-cell/data
        containerPath: /var/local/weltgewebe-staging
        readOnly: false
  - role: worker
    extraMounts:
      - hostPath: /home/alex/.local/state/weltgewebe/staging-cell/data
        containerPath: /var/local/weltgewebe-staging
        readOnly: false
  - role: worker
    extraMounts:
      - hostPath: /home/alex/.local/state/weltgewebe/staging-cell/data
        containerPath: /var/local/weltgewebe-staging
        readOnly: false
