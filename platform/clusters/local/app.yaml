---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: weltgewebe-app
  namespace: flux-system
spec:
  interval: 2m
  retryInterval: 20s
  timeout: 5m
  prune: true
  wait: true
  dependsOn:
    - name: weltgewebe-migration
  sourceRef:
    kind: GitRepository
    name: weltgewebe
  path: ./platform/apps/weltgewebe/overlays/local
  healthChecks:
    - apiVersion: apps/v1
      kind: Deployment
      name: weltgewebe-api
      namespace: weltgewebe
    - apiVersion: apps/v1
      kind: Deployment
      name: weltgewebe-web
      namespace: weltgewebe
