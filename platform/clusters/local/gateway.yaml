---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: weltgewebe-gateway
  namespace: flux-system
spec:
  interval: 2m
  retryInterval: 20s
  timeout: 5m
  prune: true
  wait: true
  dependsOn:
    - name: weltgewebe-app
  sourceRef:
    kind: GitRepository
    name: weltgewebe
  path: ./platform/infrastructure/gateway
  healthChecks:
    - apiVersion: gateway.networking.k8s.io/v1
      kind: Gateway
      name: weltgewebe
      namespace: weltgewebe-gateway
