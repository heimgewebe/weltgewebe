---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: weltgewebe-migration
  namespace: flux-system
spec:
  interval: 2m
  retryInterval: 20s
  timeout: 5m
  prune: true
  wait: true
  dependsOn:
    - name: weltgewebe-local-data
  force: true
  sourceRef:
    kind: GitRepository
    name: weltgewebe
  path: ./platform/apps/weltgewebe/migration/local
  healthChecks:
    - apiVersion: batch/v1
      kind: Job
      name: weltgewebe-migration
      namespace: weltgewebe
