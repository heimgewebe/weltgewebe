---
apiVersion: batch/v1
kind: Job
metadata:
  name: weltgewebe-migration
  labels:
    app.kubernetes.io/name: weltgewebe-migration
    app.kubernetes.io/component: database-migration
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 480
  template:
    metadata:
      labels:
        app.kubernetes.io/name: weltgewebe-migration
        app.kubernetes.io/component: database-migration
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: migration
          image: ghcr.io/heimgewebe/weltgewebe-api:promotion-required
          imagePullPolicy: Never
          env:
            - name: DATABASE_URL
              valueFrom:
                configMapKeyRef:
                  name: weltgewebe-ha-runtime
                  key: database-url
            - name: APP_BASE_URL
              value: http://weltgewebe.localhost
            - name: AUTH_AUTO_PROVISION
              value: "0"
            - name: AUTH_COOKIE_SECURE
              value: "0"
            - name: AUTH_LOG_MAGIC_TOKEN
              value: "0"
            - name: AUTH_PUBLIC_LOGIN
              value: "0"
            - name: GEWEBE_IN_DIR
              value: /data
            - name: GEWEBE_SEED_DEMO
              value: "false"
            - name: GEWEBE_SEED_REAL
              value: "false"
            - name: RUST_LOG
              value: info
            - name: WELTGEWEBE_API_MIGRATION_ONLY
              value: "1"
            - name: WELTGEWEBE_API_STARTUP_MIGRATIONS
              value: run
            - name: WELTGEWEBE_DOMAIN_ACCOUNT_WRITE_SOURCE
              value: postgres
            - name: WELTGEWEBE_DOMAIN_EDGE_WRITE_SOURCE
              value: postgres
            - name: WELTGEWEBE_DOMAIN_NODE_WRITE_SOURCE
              value: postgres
            - name: WELTGEWEBE_DOMAIN_READ_SOURCE
              value: postgres
            - name: WELTGEWEBE_PASSKEY_CREDENTIAL_SOURCE
              value: postgres
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            privileged: false
            readOnlyRootFilesystem: true
          volumeMounts:
            - name: data
              mountPath: /data
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: data
          emptyDir: {}
        - name: tmp
          emptyDir: {}
