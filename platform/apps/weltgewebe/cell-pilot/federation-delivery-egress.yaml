---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: allow-api-federation-delivery-example
  annotations:
    weltgewebe.net/template: replace-peer.example.invalid-and-port-before-inclusion
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: weltgewebe-api
  egress:
    - toFQDNs:
        - matchName: peer.example.invalid
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
