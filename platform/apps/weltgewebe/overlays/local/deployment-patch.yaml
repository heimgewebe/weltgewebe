---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: weltgewebe-api
spec:
  replicas: 2
  template:
    spec:
      containers:
        - name: api
          imagePullPolicy: Never
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: weltgewebe-web
spec:
  replicas: 1
  template:
    spec:
      containers:
        - name: web
          imagePullPolicy: Never
