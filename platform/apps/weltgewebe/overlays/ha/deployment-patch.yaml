---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: weltgewebe-api
spec:
  replicas: 3
  # Keep a new API replica stably Ready before it may displace an old one.
  # The HA proof observed a readiness-to-dataplane convergence gap during rollback.
  minReadySeconds: 10
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    spec:
      nodeSelector:
        weltgewebe.net/data-node: "true"
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/name: weltgewebe-api
                topologyKey: topology.kubernetes.io/zone
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: weltgewebe-api
      containers:
        - name: api
          imagePullPolicy: Never
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: weltgewebe-ha-runtime
                  key: database-url
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: weltgewebe-web
spec:
  replicas: 2
  template:
    spec:
      nodeSelector:
        weltgewebe.net/data-node: "true"
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: weltgewebe-web
      containers:
        - name: web
          imagePullPolicy: Never
