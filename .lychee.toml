# Active lychee configuration for GitHub Actions link checks.
# Workflows pass --config .lychee.toml and may still add per-job CLI flags.

max_redirects = 5
max_retries = 3
max_concurrency = 3
timeout = 20
retry_wait_time = 3
user_agent = "heimgewebe-ci-lychee"

exclude = [
  "https?://(localhost|127\\.0\\.0\\.1|0\\.0\\.0\\.0)(:\\d+)?(/.*)?"
]

exclude_path = [
  "node_modules",
  "dist",
  ".git"
]
