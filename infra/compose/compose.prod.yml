---
services:
  api:
    image: weltgewebe-api:${API_VERSION:?API_VERSION must be set}
    build:
      context: ../..
      dockerfile: apps/api/Dockerfile
    restart: always
    volumes:
      - gewebe_fs_data:/data
    environment:
      API_BIND: 0.0.0.0:8080
      GEWEBE_IN_DIR: /data
      # Enable demo data seeding via env var (default: false).
      # Set GEWEBE_SEED_DEMO=true in .env for development deployments.
      GEWEBE_SEED_DEMO: ${GEWEBE_SEED_DEMO:-false}
      # Enable REAL initial data seeding (default: false). Idempotent.
      # For a real deployment set GEWEBE_SEED_REAL=true and GEWEBE_SEED_DEMO=false.
      # Also set ACCOUNT_TITLE, PUBLIC_LAT, PUBLIC_LON (required when GEWEBE_SEED_REAL=true).
      GEWEBE_SEED_REAL: ${GEWEBE_SEED_REAL:-false}
      # Required when GEWEBE_SEED_REAL=true:
      ACCOUNT_TITLE: ${ACCOUNT_TITLE:-}
      PUBLIC_LAT: ${PUBLIC_LAT:-}
      PUBLIC_LON: ${PUBLIC_LON:-}
      # Optional bootstrap fields (account is always a Garnrolle; map_state controls visibility):
      ACCOUNT_ID: ${ACCOUNT_ID:-}
      ACCOUNT_SUMMARY: ${ACCOUNT_SUMMARY:-}
      ACCOUNT_ROLE: ${ACCOUNT_ROLE:-admin}
      ACCOUNT_TAGS: ${ACCOUNT_TAGS:-real}
      ACCOUNT_EMAIL: ${ACCOUNT_EMAIL:-}
      DATABASE_URL: ${DATABASE_URL}
      WELTGEWEBE_DOMAIN_READ_SOURCE: ${WELTGEWEBE_DOMAIN_READ_SOURCE:-postgres}
      WELTGEWEBE_DOMAIN_ACCOUNT_WRITE_SOURCE: ${WELTGEWEBE_DOMAIN_ACCOUNT_WRITE_SOURCE:-postgres}
      WELTGEWEBE_DOMAIN_NODE_WRITE_SOURCE: ${WELTGEWEBE_DOMAIN_NODE_WRITE_SOURCE:-postgres}
      WELTGEWEBE_DOMAIN_EDGE_WRITE_SOURCE: ${WELTGEWEBE_DOMAIN_EDGE_WRITE_SOURCE:-postgres}
      WELTGEWEBE_PASSKEY_CREDENTIAL_SOURCE: ${WELTGEWEBE_PASSKEY_CREDENTIAL_SOURCE:-postgres}
      WELTGEWEBE_API_STARTUP_MIGRATIONS: ${WELTGEWEBE_API_STARTUP_MIGRATIONS:-verify-applied}
      RUST_LOG: ${RUST_LOG:-info}
      # Auth
      AUTH_PUBLIC_LOGIN: ${AUTH_PUBLIC_LOGIN:-0}
      APP_BASE_URL: ${APP_BASE_URL:-}
      AUTH_TRUSTED_PROXIES: ${AUTH_TRUSTED_PROXIES:-}
      NATS_URL: ${NATS_URL:-nats://nats:4222}
    depends_on:
      db:
        condition: service_healthy
      nats:
        condition: service_healthy
    healthcheck:
      test:
        - CMD-SHELL
        - >
          wget -qO- http://localhost:8080/health/ready >/dev/null 2>&1 ||
          wget -qO- http://localhost:8080/health/live >/dev/null 2>&1 ||
          exit 1
      interval: 10s
      timeout: 3s
      retries: 10
    networks:
      default:
        aliases:
          - weltgewebe-api

  db:
    image: postgres:16@sha256:be01cf82fc7dbba824acf0a82e150b4b360f3ff93c6631d7844af431e841a95c
    restart: always
    volumes:
      - pg_data_prod:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 3s
      retries: 5

  nats:
    image: nats:2.10-alpine@sha256:b83efabe3e7def1e0a4a31ec6e078999bb17c80363f881df35edc70fcb6bb927
    command:
      - -js
      - -sd
      - /data
      - -m
      - "8222"
    restart: always
    volumes:
      - nats_js:/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8222/healthz"]
      interval: 5s
      timeout: 3s
      retries: 10

  caddy:
    build:
      context: ../caddy
    restart: always
    ports:
      - "${CADDY_BIND:-127.0.0.1}:80:80"
      - "${CADDY_BIND:-127.0.0.1}:443:443"
    volumes:
      - ../caddy/Caddyfile.heim:/etc/caddy/Caddyfile:ro
      - ../../build/basemap:/srv/weltgewebe-basemap:ro
      - ../../map-style:/srv/weltgewebe-map-style:ro
      - ../../apps/web/build:/srv/weltgewebe-web:ro
      - caddy_data:/data
      - caddy_config:/config
    environment:
      WELTGEWEBE_BUILD: ${WELTGEWEBE_BUILD:?WELTGEWEBE_BUILD must be set}
    depends_on:
      api:
        condition: service_healthy

volumes:
  pg_data_prod:
  caddy_data:
  caddy_config:
  gewebe_fs_data:
  nats_js:
