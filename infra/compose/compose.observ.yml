---
services:
  prometheus:
    image: prom/prometheus:v2.54.1@sha256:f6639335d34a77d9d9db382b92eeb7fc00934be8eae81dbc03b31cfe90411a94
    ports: ["${OBSERVABILITY_BIND:-127.0.0.1}:9090:9090"]
    configs:
      - source: prometheus_config
        target: /etc/prometheus/prometheus.yml
  grafana:
    image: grafana/grafana:11.1.4@sha256:886b56d5534e54f69a8cfcb4b8928da8fc753178a7a3d20c3f9b04b660169805
    ports: ["${OBSERVABILITY_BIND:-127.0.0.1}:3001:3000"]
    environment:
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Viewer
  loki:
    image: grafana/loki:3.2.1@sha256:09a53b4a4ff81ffcd8f13886df19d33fac7a8d3aaf952e3c7e66cbade5b2fc31
    ports: ["${OBSERVABILITY_BIND:-127.0.0.1}:3100:3100"]
  tempo:
    image: grafana/tempo:2.5.0@sha256:f0200a9bff6d14eb3a4332194f7b77c37ee1a3535e7e41db024d95aab6f1b4e8
    ports: ["${OBSERVABILITY_BIND:-127.0.0.1}:3200:3200"]

configs:
  prometheus_config:
    content: |
      global:
        scrape_interval: 15s
      scrape_configs:
        - job_name: api
          static_configs:
            - targets:
                - weltgewebe-api:8080
