---
services:
  api:
    # erzwingt, dass relative Pfade wie "policies/limits.yaml" unter /app auflösen
    working_dir: /app
    ports:
      - "8081:8080"
    environment:
      # falls die App eine NATS_URL kennt, ist das der Standard
      - NATS_URL=nats://nats:4222
    volumes:
      - ./policies:/app/policies:ro

  nats:
    image: nats:2@sha256:ecf677bae6a0ae7900bd3217be041c6614d5dcd2cae780000f9cd69462b36541
    command: ["-js"]
    restart: unless-stopped
    ports:
      - "4222:4222"
