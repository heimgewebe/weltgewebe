---
services:
  api:
    env_file:
      - ${WELTGEWEBE_ENV_FILE:-/etc/weltgewebe/weltgewebe.env}
    environment:
      POLICY_LIMITS_PATH: /app/policies/limits.yaml
      APP_BASE_URL: https://commonthing.net
      AUTH_PUBLIC_LOGIN: ${AUTH_PUBLIC_LOGIN:-0}
      AUTH_LOG_MAGIC_TOKEN: ${AUTH_LOG_MAGIC_TOKEN:-0}
      AUTH_AUTO_PROVISION: ${AUTH_AUTO_PROVISION:-1}
      AUTH_ALLOW_EMAILS: ${AUTH_ALLOW_EMAILS:-}
      # Caddy reaches the API over the compose bridge network, so its peer address
      # is never loopback. Without this the allowlist falls back to loopback only,
      # X-Forwarded-For is discarded, and every client collapses into the single
      # per-IP bucket below — a site-wide login outage for the cost of 5 requests.
      # The API refuses to start on the unset combination; keep this next to the
      # rate limits it makes meaningful.
      AUTH_TRUSTED_PROXIES: ${AUTH_TRUSTED_PROXIES:-127.0.0.1,::1,172.16.0.0/12}
      AUTH_RL_IP_PER_MIN: "5"
      AUTH_RL_IP_PER_HOUR: "30"
      AUTH_RL_EMAIL_PER_MIN: "2"
      AUTH_RL_EMAIL_PER_HOUR: "10"
    volumes:
      - type: bind
        source: ${REPO_DIR:-/opt/weltgewebe}/policies/limits.yaml
        target: /app/policies/limits.yaml
        read_only: true

  search-worker:
    env_file:
      - ${WELTGEWEBE_ENV_FILE:-/etc/weltgewebe/weltgewebe.env}

  caddy:
    ports:
      - "${CADDY_IPV6_BIND:-[::]}:80:80"
      - "${CADDY_IPV6_BIND:-[::]}:443:443"
    volumes:
      - ${WELTGEWEBE_CADDYFILE:-../caddy/Caddyfile.vps}:/etc/caddy/Caddyfile:ro
      - ../../build/basemap:/srv/weltgewebe-basemap:ro
      - ../../map-style:/srv/weltgewebe-map-style:ro
      - ../../apps/web/build:/srv/weltgewebe-web:ro
      - type: bind
        source: ${SCHAUWERK_EDITOR_RELEASE_DIR:-${SCHAUWERK_EDITOR_ROOT:-/opt/schauwerk-editor}/current}
        target: /srv/schauwerk-editor-release
        read_only: true
        bind:
          create_host_path: false
      - caddy_data:/data
      - caddy_config:/config
    environment:
      WELTGEWEBE_BUILD: ${WELTGEWEBE_BUILD:?WELTGEWEBE_BUILD must be set}
