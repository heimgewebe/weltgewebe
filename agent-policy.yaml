---
# Compatibility Projection of agent-contract.json.
# Not an independent authority. Projected path/check fields must stay in exact
# parity with the canonical machine norm; drift fails repo-agent-contract checks.
safe_read_paths:
  - agent-contract.json
  - repo.meta.yaml
  - AGENTS.md
  - agent-policy.yaml
  - docs/policies/agent-reading-protocol.md
  - README.md
  - docs/

guarded_write_paths:
  - .github/workflows/
  - apps/
  - contracts/
  - docs/
  - infra/
  - platform/
  - scripts/

forbidden_write_paths:
  - docs/_generated/
  - secrets/
  - snapshots/

requires_target_proof_for:
  - .github/workflows/
  - apps/
  - deployment/
  - infra/

required_checks_before_patch:
  - repo-structure-guard
  - docs-relations-guard
  - generated-files-guard
  - coverage-guard
  - lint
  - test

human_review_required_for:
  - security/
  - deployment/
  - credentials/

# Note: These agent_rules are normative guidelines for agent execution behavior,
# not mechanically enforced by a specific CI runner or tooling engine.
agent_rules:
  abort_on_conflict: true
  interpolation_allowed: false
  require_explicit_reading_order: true
